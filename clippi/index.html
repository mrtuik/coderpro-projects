/* ============================ UTIL ============================ */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2) + Date.now());
const now = () => Date.now();
const fmt = (s) => {
  if (!isFinite(s) || s < 0) s = 0;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  return (h ? String(h).padStart(2, "0") + ":" : "") + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function el(tag, props = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") throw new Error("html not allowed");
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "value") n.value = v;
    else if (k === "checked") n.checked = !!v;
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined || c === false) continue;
    n.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }

}
const icon = (name, cls = "") => el("i", { "data-lucide": name, class: cls });
function refreshIcons() { try { window.lucide && window.lucide.createIcons(); } catch (e) { /* icons optional */ } }

const btn = (label, opts = {}) => {

  const map = {
    primary: "bg-neutral-900 text-white border-neutral-900 hover:bg-neutral-800",
    ghost: "bg-white text-neutral-800 border-neutral-200 hover:bg-neutral-50",

/* ============================ STORAGE MODULE ============================ */
const DB_NAME = "ClippiDB", DB_VERSION = 1;
const STORES = {
  projects: { key: "id", idx: [["updatedAt", "updatedAt"], ["status", "status"]] },
  videoAssets: { key: "id", idx: [["projectId", "projectId"]] },
  transcriptSegments: { key: "id", idx: [["projectId", "projectId"], ["videoAssetId", "videoAssetId"]] },
  editVersions: { key: "id", idx: [["projectId", "projectId"]] },
  editSegments: { key: "id", idx: [["editVersionId", "editVersionId"]] },
  chatMessages: { key: "id", idx: [["projectId", "projectId"]] },
  editHistory: { key: "id", idx: [["projectId", "projectId"]] },
  appSettings: { key: "key", idx: [] },
};

let _db = null;
function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      for (const [name, cfg] of Object.entries(STORES)) {
        const store = db.objectStoreNames.contains(name) ? req.transaction.objectStore(name) : db.createObjectStore(name, { keyPath: cfg.key });
        for (const [iname, path] of cfg.idx) if (!store.indexNames.contains(iname)) store.createIndex(iname, path);
      }
    };
    req.onsuccess = () => { _db = req.result; _db.onversionchange = () => _db.close(); resolve(_db); };
    req.onerror = () => reject(dbErr(req.error));
  });
}
function dbErr(e) {
  const name = (e && e.name) || "";
  if (name === "QuotaExceededError") return new Error("Storage limit reached. Delete an old project to free space, then retry.");
  return new Error("Local database error: " + (e && e.message ? e.message : "unknown") + ".");
}
function tx(stores, mode) { return openDB().then((db) => db.transaction(stores, mode)); }
function wrap(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(dbErr(req.error)); }); }

async function addRecord(store, rec) { const t = await tx([store], "readwrite"); await wrap(t.objectStore(store).put(rec)); return rec; }
async function updateRecord(store, rec) { return addRecord(store, rec); }
async function getRecord(store, key) { const t = await tx([store], "readonly"); return wrap(t.objectStore(store).get(key)); }
async function getAll(store) { const t = await tx([store], "readonly"); return wrap(t.objectStore(store).getAll()); }
async function getAllByIndex(store, index, value) {
  const t = await tx([store], "readonly");
  return wrap(t.objectStore(store).index(index).getAll(value));
}
async function deleteRecord(store, key) { const t = await tx([store], "readwrite"); return wrap(t.objectStore(store).delete(key)); }
function runTransaction(stores, fn) {
  return openDB().then((db) => new Promise((resolve, reject) => {
    const t = db.transaction(stores, "readwrite");
    let out;
    t.oncomplete = () => resolve(out);
    t.onerror = () => reject(dbErr(t.error));
    t.onabort = () => reject(dbErr(t.error));
    const api = {
      put: (s, rec) => t.objectStore(s).put(rec),
      del: (s, k) => t.objectStore(s).delete(k),
      byIndex: (s, i, v) => wrap(t.objectStore(s).index(i).getAll(v)),
    };
    Promise.resolve(fn(api)).then((r) => { out = r; }).catch((e) => { try { t.abort(); } catch (_) {} reject(e); });
  }));
}

/* ============================ STATE MANAGER ============================ */
const State = {
  data: {
    screen: "home",
    projects: [],
    stats: { projects: 0, minutes: 0, storage: null },
    currentProject: null,
    currentVideoAsset: null,
    transcript: [],
    editVersions: [],
    activeVersionId: null,
    editSegmentsByVersion: {},
    chatMessages: [],
    selectedSegmentIds: [],
    playback: { currentTime: 0, duration: 0, isPlaying: false },
    processing: { stage: null, progress: 0, engine: null, message: '', gesturePrompt: false },
    exportState: { status: "idle", progress: 0, url: null },
    settings: null,
    history: { undoStack: [], redoStack: [] },
    errors: {},
    search: { q: "", matches: [], cursor: 0 },     ui: { renamingId: null, confirmDeleteId: null, confirmDeleteVersionId: null, compare: false, chatBusy: false, chatErrors: {}, feedLogs: {}, modelProgress: null, mediaBarExpanded: false, autoExpandTranscript: false, homeTab: 'home', homeCreateOpen: false, expandedFeedItems: {}, crossOriginWarning: false },
  },
  subs: new Map(),

  set(patch) {

    for (const { keys: k, fn } of this.subs.values()) if (k === "*" || k.some((x) => keys.has(x))) fn(this.data);
    refreshIcons();
  },
};
const S = () => State.data;

/* ============================ EVENT BUS ============================ */
const Bus = {
  map: new Map(),
  on(evt, fn) { if (!this.map.has(evt)) this.map.set(evt, []); this.map.get(evt).push(fn); },
  async emit(evt, payload) {
    const list = this.map.get(evt) || [];
    for (const fn of list) { try { await fn(payload); } catch (e) { console.error(evt, e); toast(e.message || String(e), "error"); } }
  },
};

/* ============================ TOASTS (inline, non-modal) ============================ */
const toastHost = el("div", { class: "fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-[min(92vw,26rem)]" });
document.body.appendChild(toastHost);
function toast(msg, kind = "info") {
  const colors = { info: "border-neutral-200 bg-white text-neutral-800", error: "border-red-200 bg-red-50 text-red-700", ok: "border-emerald-200 bg-emerald-50 text-emerald-800" };
  const t = el("div", { class: `flex items-start gap-2 rounded-xl border px-3 py-2 text-sm shadow-sm ${colors[kind]}` }, [
    icon(kind === "error" ? "alert-triangle" : kind === "ok" ? "check-circle-2" : "info", "mt-0.5 shrink-0"),
    el("span", { class: "flex-1", text: msg }),
  ]);
  toastHost.appendChild(t); refreshIcons();
  setTimeout(() => t.remove(), 6000);
}

/* ============================ SETTINGS ============================ */
const DEFAULT_SETTINGS = {
  key: "global", transcriptionEngine: "wasm", cloudProvider: null, cloudApiKey: "",
  preferredModelSize: "base", theme: "light", llmProvider: "openai", llmApiKey: "", llmModel: "",
};
async function loadSettings() {
  let s = await getRecord("appSettings", "global");
  if (!s) { s = { ...DEFAULT_SETTINGS, transcriptionEngine: (await hasWebGPU()) ? "webgpu" : "wasm" }; await addRecord("appSettings", s); }
  return { ...DEFAULT_SETTINGS, ...s };
}
async function hasWebGPU() {
  try { if (!navigator.gpu) return false; const a = await navigator.gpu.requestAdapter(); return !!a; } catch (e) { return false; }
}

/* ============================ MEDIA MODULE (ffmpeg.wasm) ============================ */
const Media = {
  ff: null, loading: null, cancelled: false, nativeCapture: null,
  async load(onLog) {
    if (this.ff) return this.ff;
    if (this.loading) return this.loading;
    this.loading = (async () => {
      const base = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";
      const ff = new FFmpeg();
      ff.on("log", ({ message }) => onLog && onLog(message));
      await withTimeout(ff.load({
        coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, "text/javascript"),        wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm'),
        classWorkerURL: await toBlobURL('https://esm.sh/@ffmpeg/ffmpeg@0.12.10/es2022/worker.js', 'text/javascript'),
      }), 45000);
      this.ff = ff; return ff;
    })().catch((e) => { this.loading = null; throw e; });
    return this.loading;
  },
  async extractAudioNative(blob, onProgress) {
    this.cancelled = false;
    const url = URL.createObjectURL(blob);
    const video = document.createElement("video");
    video.src = url; video.playsInline = true; video.preload = "auto";
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const source = ctx.createMediaElementSource(video);
    const processor = ctx.createScriptProcessor(4096, 2, 1);
    const gain = ctx.createGain(); gain.gain.value = 0;
    const chunks = [];
    let settled = false;
    let resolveCapture, rejectCapture;
    const promise = new Promise((resolve, reject) => { resolveCapture = resolve; rejectCapture = reject; });
    const cleanup = () => {
      if (settled) return;
      settled = true; this.nativeCapture = null;
      try { video.pause(); processor.disconnect(); source.disconnect(); gain.disconnect(); ctx.close(); } catch (_) {}
      URL.revokeObjectURL(url);
    };
    const cancel = () => { cleanup(); rejectCapture(new Error("Cancelled")); };
    this.nativeCapture = { cancel, video };

      const input = event.inputBuffer;
      const length = input.length, channels = input.numberOfChannels;
      const mono = new Float32Array(length);
      for (let i = 0; i < length; i++) {
        let total = 0;
        for (let c = 0; c < channels; c++) total += input.getChannelData(c)[i] || 0;

      }

    };

    video.onerror = () => { cleanup(); rejectCapture(new Error("Could not read audio from this video file. Try a different video format (mp4/webm) or browser, then retry.")); };

      const total = chunks.reduce((n, c) => n + c.length, 0), input = new Float32Array(total);
      let offset = 0; chunks.forEach((c) => { input.set(c, offset); offset += c.length; });
      const outputLength = Math.max(1, Math.round(input.length * 16000 / ctx.sampleRate));
      const output = new Float32Array(outputLength);
      for (let i = 0; i < outputLength; i++) {
        const pos = i * (input.length - 1) / Math.max(1, outputLength - 1), left = Math.floor(pos), right = Math.min(input.length - 1, left + 1), frac = pos - left;
        output[i] = (input[left] || 0) * (1 - frac) + (input[right] || 0) * frac;
      }
      cleanup(); resolveCapture(output);
    };
    source.connect(processor); processor.connect(gain); gain.connect(ctx.destination);
    let watchdog = setTimeout(() => {
      if (!video.currentTime && !settled) {
        cleanup();
        const err = new Error('GestureRequired');
        err.name = 'GestureRequired';
        rejectCapture(err);
      }
    }, 6000);
    try {
      await ctx.resume();
      await video.play();
    } catch (e) {
      clearTimeout(watchdog);
      cleanup();
      const err = new Error('GestureRequired');
      err.name = 'GestureRequired';
      rejectCapture(err);
    }
    promise.finally(() => clearTimeout(watchdog));
    return promise;
  },
  async renderCut(blob, ranges, onProgress) {
    const ff = await withTimeout(this.load(), 45000);
    const prog = ({ progress }) => onProgress && onProgress(Math.max(0, Math.min(1, progress)));
    ff.on("progress", prog);
    try {
      const inName = "src_" + uid().slice(0, 8) + ".mp4";
      await ff.writeFile(inName, new Uint8Array(await blob.arrayBuffer()));
      const parts = [];
      ranges.forEach((r, i) => {
        parts.push(`[0:v]trim=start=${r.start.toFixed(3)}:end=${r.end.toFixed(3)},setpts=PTS-STARTPTS[v${i}]`);
        parts.push(`[0:a]atrim=start=${r.start.toFixed(3)}:end=${r.end.toFixed(3)},asetpts=PTS-STARTPTS[a${i}]`);
      });
      const concat = ranges.map((_, i) => `[v${i}][a${i}]`).join("") + `concat=n=${ranges.length}:v=1:a=1[vout][aout]`;
      const filter = parts.join(";") + ";" + concat;
      await withTimeout(ff.exec(["-i", inName, "-filter_complex", filter, "-map", "[vout]", "-map", "[aout]",
        "-c:v", "libx264", "-preset", "ultrafast", "-crf", "24", "-c:a", "aac", "-movflags", "+faststart", "out.mp4"]), 45000);
      const data = await ff.readFile("out.mp4");
      await ff.deleteFile(inName); await ff.deleteFile("out.mp4");
      return new Blob([data.buffer], { type: "video/mp4" });
    } finally { ff.off("progress", prog); }
  },
  cancel() { try { this.nativeCapture && this.nativeCapture.cancel(); } catch (e) {} try { this.ff && this.ff.terminate(); } catch (e) {} this.ff = null; this.loading = null; },
};

async function decodeToMono16k(wavBlob) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC({ sampleRate: 16000 });
  const buf = await ctx.decodeAudioData(await wavBlob.arrayBuffer());
  const data = buf.getChannelData(0).slice();
  ctx.close();
  return data;
}

/* ============================ TRANSCRIPTION MODULE ============================ */
let transformersMod = null;
async function loadTransformers() {
  if (!transformersMod) transformersMod = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.1");
  return transformersMod;
}
const MODEL_BY_SIZE = { tiny: "onnx-community/whisper-tiny.en", base: "onnx-community/whisper-base", small: "onnx-community/whisper-small" };
const pipelineCache = new Map();

class LocalWhisperEngine {
  constructor(device, size) { this.device = device; this.size = size; this.name = device === "webgpu" ? "webgpu" : "wasm"; }
  async getPipe(onProgress) {
    const model = MODEL_BY_SIZE[this.size] || MODEL_BY_SIZE.base;
    const cacheKey = this.device + "|" + model;
    if (pipelineCache.has(cacheKey)) return pipelineCache.get(cacheKey);
    const { pipeline, env } = await loadTransformers();
    env.allowLocalModels = false;
    env.useBrowserCache = true;
    const p = await pipeline("automatic-speech-recognition", model, {
      device: this.device,
      dtype: this.device === "webgpu" ? { encoder_model: "fp16", decoder_model_merged: "q4" } : "q8",
      progress_callback: (e) => {
        if (e && e.status === "progress" && e.total) onProgress && onProgress(e.progress / 100, e.file);
        if (e && e.status === "done") onProgress && onProgress(1, e.file);
      },
    });
    pipelineCache.set(cacheKey, p);
    return p;
  }
  async transcribe(audioBlob, hooks = {}) {
    const pipe = await this.getPipe(hooks.onModel);
    const audio = audioBlob instanceof Float32Array ? audioBlob : await decodeToMono16k(audioBlob);
    hooks.onStage && hooks.onStage("Transcribing audio locally");
    const out = await pipe(audio, { return_timestamps: true, chunk_length_s: 30, stride_length_s: 5 });
    const chunks = (out && out.chunks) || [];
    const segs = chunks.map((c) => ({
      start: Number(c.timestamp && c.timestamp[0]) || 0,
      end: Number(c.timestamp && c.timestamp[1]) || 0,
      text: (c.text || "").trim(),
    })).filter((s) => s.text);
    if (!segs.length && out && out.text) segs.push({ start: 0, end: audio.length / 16000, text: out.text.trim() });
    return normalizeSegs(segs, audio.length / 16000);
  }
}
class CloudWhisperEngine {
  constructor(provider, apiKey) { this.provider = provider; this.apiKey = apiKey; this.name = "cloud"; }
  async transcribe(audioBlob, hooks = {}) {
    if (audioBlob instanceof Float32Array) audioBlob = floatToWavBlob(audioBlob, 16000);
    hooks.onStage && hooks.onStage("Transcribing via " + this.provider);
    const url = this.provider === "groq" ? "https://api.groq.com/openai/v1/audio/transcriptions" : "https://api.openai.com/v1/audio/transcriptions";
    const model = this.provider === "groq" ? "whisper-large-v3" : "whisper-1";
    const fd = new FormData();
    fd.append("file", new File([audioBlob], "audio.wav", { type: "audio/wav" }));
    fd.append("model", model);
    fd.append("response_format", "verbose_json");
    fd.append("timestamp_granularities[]", "segment");
    const res = await withTimeout(fetch(url, { method: "POST", headers: { Authorization: "Bearer " + this.apiKey }, body: fd }), 180000);
    if (!res.ok) throw new Error("Cloud transcription failed (" + res.status + "). Check your API key and try again.");
    const json = await res.json();
    const segs = (json.segments || []).map((s) => ({ start: Number(s.start) || 0, end: Number(s.end) || 0, text: String(s.text || "").trim() })).filter((s) => s.text);
    if (!segs.length && json.text) segs.push({ start: 0, end: 0, text: String(json.text) });

}
function floatToWavBlob(samples, sampleRate) {

  const write = (offset, text) => [...text].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
  write(0, "RIFF"); view.setUint32(4, 36 + samples.length * 2, true); write(8, "WAVE"); write(12, "fmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); write(36, "data"); view.setUint32(40, samples.length * 2, true);

      const nextStart = segs[i + 1] ? segs[i + 1].start : (dur || s.start + 2);
      end = Math.min(est, Math.max(s.start + 0.05, nextStart - 0.15));

}
async function resolveEngine() {
  const st = S().settings;
  let choice = st.transcriptionEngine;
  if (choice === "cloud") {
    if (!st.cloudApiKey || !st.cloudProvider) throw new Error("Cloud transcription selected but no API key is saved. Open Settings to add one.");
    return new CloudWhisperEngine(st.cloudProvider, st.cloudApiKey);
  }
  if (choice === "webgpu" && !(await hasWebGPU())) {
    Bus.emit("engine:fallback");
    toast("WebGPU is not available in this browser — falling back to the WASM engine.", "info");
    choice = "wasm";
  }
  return new LocalWhisperEngine(choice === "webgpu" ? "webgpu" : "wasm", st.preferredModelSize);
}

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("Request timed out. Check your connection and retry.")), ms))]);
}

/* ============================ AI EDIT MODULE ============================ */
const AI = {
  cfg() {
    const st = S().settings;
    const provider = st.llmProvider || "openai";
    const key = st.llmApiKey || (st.cloudProvider === provider ? st.cloudApiKey : "");
    if (!key) throw new Error("No AI key saved. Add your OpenAI or Groq key in Settings to generate cuts.");
    const url = provider === "groq" ? "https://api.groq.com/openai/v1/chat/completions" : "https://api.openai.com/v1/chat/completions";
    const model = st.llmModel || (provider === "groq" ? "llama-3.3-70b-versatile" : "gpt-4o-mini");
    return { url, key, model };
  },
  async chat(messages, jsonMode = true) {
    const { url, key, model } = this.cfg();
    const res = await withTimeout(fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
      body: JSON.stringify({ model, messages, temperature: 0.3, ...(jsonMode ? { response_format: { type: "json_object" } } : {}) }),
    }), 120000);
    if (!res.ok) {
      const t = await res.text().catch(() => "");
      throw new Error("AI request failed (" + res.status + "). " + (t ? t.slice(0, 160) : "Check your key and model."));
    }
    const json = await res.json();
    const content = json && json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
    if (!content) throw new Error("AI returned an empty response. Retry.");
    return content;
  },
  parseJSON(raw) {
    let text = String(raw).trim();
    const fence = text.match(/```(?:json)?([\s\S]*?)```/);
    if (fence) text = fence[1].trim();
    const first = text.indexOf("{"), last = text.lastIndexOf("}");
    if (first > 0 || last < text.length - 1) text = text.slice(first, last + 1);
    try { return JSON.parse(text); } catch (e) { throw new Error("The AI response was not valid JSON. Retry the instruction."); }
  },
  // Hierarchical map for long transcripts
  async buildStoryMap(transcript) {
    if (transcript.length <= 150) return null;
    const groups = [];
    for (let i = 0; i < transcript.length; i += 60) groups.push(transcript.slice(i, i + 60));
    const summaries = [];
    for (let gi = 0; gi < groups.length; gi++) {
      const g = groups[gi];
      const body = g.map((s) => `${s.index}|${fmt(s.start)}|${s.text}`).join("\n");
      const raw = await this.chat([
        { role: "system", content: 'Summarise this transcript chunk for a video editor. Reply JSON: {"summary":string,"keyMoments":[{"segmentId":number,"why":string}]} where segmentId is the leading number of a line.' },
        { role: "user", content: body },
      ]);
      const j = this.parseJSON(raw);
      summaries.push({ chunk: gi + 1, range: [g[0].index, g[g.length - 1].index], summary: String(j.summary || ""), keyMoments: Array.isArray(j.keyMoments) ? j.keyMoments.slice(0, 12) : [] });
    }
    return summaries;
  },
  transcriptDigest(transcript) {
    return transcript.map((s) => `${s.index}|${fmt(s.start)}-${fmt(s.end)}|${s.text}`).join("\n");
  },
  async generateVersions(instruction, transcript, priorChat, activePlan) {
    const storyMap = await this.buildStoryMap(transcript);
    const sys = [
      "You are Clippi, a video edit planner. You cut videos by selecting transcript segments.",
      "You NEVER invent timestamps. You only reference the integer segment indexes given to you.",
      'Reply with STRICT JSON only, shape: {"summary": string, "versionA": {"label": string, "plan": [{"segmentId": number, "action": "keep"|"remove", "reason": string}]}, "versionB": {"label": string, "plan": [...]}}',
      "versionA = Story cut: preserve narrative flow, context and setup, gentle trimming.",
      "versionB = Impact cut: aggressive, keep only the strongest highlight moments, much shorter.",
      "Every transcript segment index MUST appear exactly once in each plan with keep or remove.",
    ].join(" ");
    const parts = [];
    if (storyMap) parts.push("STORY MAP (chunk summaries of a long transcript):\n" + JSON.stringify(storyMap));
    parts.push("TRANSCRIPT (index|start-end|text):\n" + this.transcriptDigest(transcript));
    if (activePlan && activePlan.length) parts.push("CURRENT ACTIVE PLAN (segmentId:action):\n" + activePlan.map((p) => p.segmentIndex + ":" + p.action).join(","));
    if (priorChat && priorChat.length) parts.push("PRIOR CONVERSATION:\n" + priorChat.map((m) => m.role + ": " + m.content).join("\n").slice(-4000));
    parts.push("INSTRUCTION FROM USER:\n" + instruction);
    const raw = await this.chat([{ role: "system", content: sys }, { role: "user", content: parts.join("\n\n") }]);
    const json = this.parseJSON(raw);
    return validatePlanResponse(json, transcript);
  },
};

function validatePlanResponse(json, transcript) {
  if (!json || typeof json !== "object") throw new Error("AI response had an unexpected shape.");
  const byIndex = new Map(transcript.map((s) => [s.index, s]));
  const clean = (v, fallbackLabel) => {
    if (!v || !Array.isArray(v.plan)) throw new Error("AI response is missing a valid edit plan.");
    const seen = new Map();
    for (const item of v.plan) {
      if (!item || typeof item !== "object") continue;
      const idx = Number(item.segmentId);
      if (!Number.isFinite(idx) || !byIndex.has(idx)) continue;
      const action = item.action === "remove" ? "remove" : item.action === "keep" ? "keep" : null;
      if (!action) continue;
      seen.set(idx, { segmentIndex: idx, action, reason: typeof item.reason === "string" ? item.reason.slice(0, 300) : "" });
    }
    if (!seen.size) throw new Error("The AI plan did not reference any real transcript segments. Retry with a clearer instruction.");
    for (const s of transcript) if (!seen.has(s.index)) seen.set(s.index, { segmentIndex: s.index, action: "keep", reason: "" });
    const plan = [...seen.values()].sort((a, b) => a.segmentIndex - b.segmentIndex);
    if (!plan.some((p) => p.action === "keep")) throw new Error("The AI plan removed every segment. Retry with a clearer instruction.");
    return { label: typeof v.label === "string" && v.label.trim() ? v.label.trim().slice(0, 60) : fallbackLabel, plan };
  };
  return {
    summary: typeof json.summary === "string" ? json.summary.slice(0, 1200) : "Generated two alternative cuts.",
    versionA: clean(json.versionA, "Version A - Story"),
    versionB: clean(json.versionB, "Version B - Impact"),
  };
}

async function refreshProjects() {
  const projects = (await getAll("projects")).sort((a, b) => b.updatedAt - a.updatedAt);
  State.set({ projects });
}
async function loadProject(projectId) {
  const project = await getRecord("projects", projectId);
  if (!project) throw new Error("That project no longer exists.");
  const assets = await getAllByIndex("videoAssets", "projectId", projectId);
  const transcript = (await getAllByIndex("transcriptSegments", "projectId", projectId)).sort((a, b) => a.index - b.index);
  const versions = (await getAllByIndex("editVersions", "projectId", projectId)).sort((a, b) => a.createdAt - b.createdAt);
  const chat = (await getAllByIndex("chatMessages", "projectId", projectId)).sort((a, b) => a.createdAt - b.createdAt);
  const map = {};
  for (const v of versions) map[v.id] = (await getAllByIndex("editSegments", "editVersionId", v.id)).sort((a, b) => a.order - b.order);
  State.set({
    screen: "editor", currentProject: project, currentVideoAsset: assets[0] || null,
    transcript, editVersions: versions, chatMessages: chat, editSegmentsByVersion: map,
    activeVersionId: project.activeVersionId || (versions[0] ? versions[0].id : null),
    selectedSegmentIds: [], search: { q: "", matches: [], cursor: 0 },
    exportState: { status: "idle", progress: 0, url: null },
    history: { undoStack: [], redoStack: [] },
    processing: { stage: null, progress: 0, engine: null, message: "" },
  });
  localStorage.setItem("clippi:lastProject", projectId);
}
function activeEditSegments() { const s = S(); return (s.activeVersionId && s.editSegmentsByVersion[s.activeVersionId]) || []; }
function keepMapFor(versionId) {
  const list = (S().editSegmentsByVersion[versionId] || []);
  const m = new Map();
  for (const e of list) m.set(e.transcriptSegmentId, e.action);
  return m;
}
function keptRanges(versionId) {
  const m = keepMapFor(versionId);
  const kept = S().transcript.filter((t) => (m.get(t.id) || "keep") === "keep");
  const ranges = [];
  for (const t of kept) {
    const last = ranges[ranges.length - 1];
    if (last && Math.abs(t.start - last.end) < 0.08) last.end = t.end;
    else ranges.push({ start: t.start, end: t.end });
  }
  return ranges;
}
async function touchProject(patch = {}) {
  const p = { ...S().currentProject, ...patch, updatedAt: now() };
  await updateRecord("projects", p);
  State.set({ currentProject: p });
  return p;
}

/* history */
function pushHistory(label) {
  const snap = JSON.stringify({
    transcript: S().transcript,
    editSegmentsByVersion: S().editSegmentsByVersion,
    activeVersionId: S().activeVersionId,
  });
  const undoStack = S().history.undoStack.concat([{ label, snap }]).slice(-40);
  State.set({ history: { undoStack, redoStack: [] } });
  const proj = S().currentProject;
  if (proj) addRecord("editHistory", { id: uid(), projectId: proj.id, snapshotOf: "editVersion", refId: S().activeVersionId || proj.id, action: label, stateSnapshot: snap, createdAt: now() }).catch(() => {});
}
async function deleteMessageAndAfter(pId, msgId) {
  const all = (await getAllByIndex('chatMessages', 'projectId', pId)).sort((a,b)=>a.createdAt-b.createdAt), idx = all.findIndex(m => m.id === msgId);
  if (idx < 0) return;
  const msgIds = all.slice(idx).map(m=>m.id);
  await runTransaction(['chatMessages', 'editVersions', 'editSegments', 'projects'], async (api) => {
    msgIds.forEach(id => api.del('chatMessages', id));
    const vToDel = (await api.byIndex('editVersions', 'projectId', pId)).filter(v => msgIds.includes(v.sourceInstructionId) || (v.relatedVersionIds && v.relatedVersionIds.some(rv => msgIds.includes(rv))));
    for (const v of vToDel) { (await api.byIndex('editSegments', 'editVersionId', v.id)).forEach(s => api.del('editSegments', s.id)); api.del('editVersions', v.id); }
    const p = S().currentProject;
    if (p && p.activeVersionId && vToDel.find(v=>v.id===p.activeVersionId)) api.put('projects', {...p, activeVersionId: null, updatedAt: now()});
  });
  await loadProject(pId); State.set({ ui: { ...S().ui, msgActionOpen: null, editingMsgId: null } });
}

async function applySnapshot(snapStr) {
  const s = JSON.parse(snapStr);
  await runTransaction(["transcriptSegments", "editSegments", "projects"], async (api) => {
    for (const t of s.transcript) api.put("transcriptSegments", t);
    for (const list of Object.values(s.editSegmentsByVersion)) for (const e of list) api.put("editSegments", e);
    api.put("projects", { ...S().currentProject, activeVersionId: s.activeVersionId, updatedAt: now() });
  });
  State.set({ transcript: s.transcript, editSegmentsByVersion: s.editSegmentsByVersion, activeVersionId: s.activeVersionId });
}

Bus.on("video:import", async (file) => {
  const proj = S().currentProject;
  if (!proj) throw new Error("Open a project first.");
  if (!file || !file.type || !file.type.startsWith("video/")) throw new Error("That file is not a video. Import an mp4, mov, webm or similar.");
  if (file.size > 1024 * 1024 * 1024) toast("This file is over 1 GB — browser processing may be slow or hit storage limits.", "info");
  State.set({ processing: { stage: "uploading", progress: 0, engine: null, message: "Storing video locally" } });
  const duration = await probeDuration(file).catch(() => 0);
  const asset = { id: uid(), projectId: proj.id, fileName: file.name, mimeType: file.type, duration, blob: file, createdAt: now() };
  await addRecord("videoAssets", asset);
  await touchProject({ status: "processing" });
  State.set({ currentVideoAsset: asset, processing: { stage: null, progress: 0, engine: null, message: "" } });
  await refreshProjects();
  await runTranscription();
});
Bus.on("video:remove", async () => {
  const a = S().currentVideoAsset; if (!a) return;
  await resetMedia(a.id);
  toast("Video and derived edits removed.", "ok");
});
Bus.on("video:replace", async (file) => {

});
async function resetMedia(assetId) {
  const proj = S().currentProject;
  await runTransaction(["videoAssets", "transcriptSegments", "editVersions", "editSegments", "projects"], async (api) => {
    api.del("videoAssets", assetId);
    (await api.byIndex("transcriptSegments", "projectId", proj.id)).forEach((r) => api.del("transcriptSegments", r.id));
    const versions = await api.byIndex("editVersions", "projectId", proj.id);
    for (const v of versions) {
      (await api.byIndex("editSegments", "editVersionId", v.id)).forEach((e) => api.del("editSegments", e.id));
      api.del("editVersions", v.id);
    }
    api.put("projects", { ...proj, activeVersionId: null, status: "draft", updatedAt: now() });
  });
  await loadProject(proj.id);
  await refreshProjects();
}
function probeDuration(file) {
  return new Promise((resolve, reject) => {
    const v = document.createElement("video");
    v.preload = "metadata";
    v.onloadedmetadata = () => { const d = v.duration; URL.revokeObjectURL(v.src); resolve(isFinite(d) ? d : 0); };
    v.onerror = () => reject(new Error("Could not read this video file."));
    v.src = URL.createObjectURL(file);
  });
}

async function runTranscription() {
  const proj = S().currentProject, asset = S().currentVideoAsset;
  if (!asset) throw new Error('Import a video first.');
  let engine;
  try { engine = await resolveEngine(); } catch (e) { State.set({ processing: { stage: null, progress: 0, engine: null, message: '', gesturePrompt: false }, errors: { ...S().errors, transcribe: e.message } }); throw e; }
  State.set({ errors: { ...S().errors, transcribe: null }, processing: { stage: 'extracting', progress: 0, engine: engine.name, message: 'Reading audio from video', gesturePrompt: false } });
  try {
    const audio = await withTimeout(Media.extractAudioNative(asset.blob, (p) => State.set({ processing: { ...S().processing, progress: p, message: 'Reading audio from video', gesturePrompt: false } })), 45000);
    State.set({ processing: { stage: "transcribing", progress: 0, engine: engine.name, message: "Loading transcription engine" } });
    const segs = await withTimeout(engine.transcribe(audio, {
      onStage: (m) => State.set({ processing: { ...S().processing, message: m } }),
      onModel: (p, file) => State.set({ ui: { ...S().ui, modelProgress: p < 1 ? { p, file } : null }, processing: { ...S().processing, progress: p, message: "Downloading AI model (~400-500MB) — this only happens once" } }),
    }), 45000);
    if (!segs.length) throw new Error("No speech was detected in this video.");
    const rows = segs.map((s, i) => ({ id: uid(), projectId: proj.id, videoAssetId: asset.id, index: i, start: s.start, end: s.end, text: s.text, engineUsed: engine.name }));
    await runTransaction(["transcriptSegments", "projects"], async (api) => {
      (await api.byIndex("transcriptSegments", "projectId", proj.id)).forEach((r) => api.del("transcriptSegments", r.id));
      rows.forEach((r) => api.put("transcriptSegments", r));
      api.put("projects", { ...proj, status: "ready", updatedAt: now() });
    });
    State.set({ transcript: rows, currentProject: { ...proj, status: "ready" }, processing: { stage: null, progress: 0, engine: engine.name, message: "" }, ui: { ...S().ui, modelProgress: null } });
    await refreshProjects();
    Bus.emit("transcript:ready");
    toast("Transcript ready — " + rows.length + " segments.", "ok");
  } catch (e) {
    if (e && (e.name === 'GestureRequired' || e.message === 'GestureRequired')) {
      State.set({ processing: { stage: 'extracting', progress: 0, engine: engine ? engine.name : null, message: 'Audio playback requires user interaction', gesturePrompt: true }, errors: { ...S().errors, transcribe: null } });
      return;
    }
    const timedOut = /timed out/i.test(e.message || '');
    if (timedOut) Media.cancel();
    const message = timedOut ? 'Audio processing did not respond. Check your connection and retry; if this keeps happening, try a different browser.' : e.message === 'Cancelled' ? 'Transcription cancelled. Retry when ready.' : (e.message || String(e));
    State.set({ processing: { stage: null, progress: 0, engine: engine ? engine.name : null, message: '', gesturePrompt: false }, errors: { ...S().errors, transcribe: message } });
    throw e;
  }
}

Bus.on("transcript:edit", async ({ id, text }) => {
  const t = text.trim();
  if (!t) throw new Error("Segment text cannot be empty.");
  pushHistory("transcript edit");
  const transcript = S().transcript.map((s) => (s.id === id ? { ...s, text: t } : s));
  await updateRecord("transcriptSegments", transcript.find((s) => s.id === id));
  State.set({ transcript });
});
Bus.on("transcript:split", async (id) => {
  const s = S().transcript.find((x) => x.id === id);
  if (!s) return;
  const words = s.text.split(/\s+/);
  if (words.length < 2) throw new Error("This segment is too short to split.");
  const half = Math.ceil(words.length / 2), mid = +(s.start + (s.end - s.start) / 2).toFixed(3);
  pushHistory("split segment");
  const a = { ...s, id: uid(), end: mid, text: words.slice(0, half).join(" ") };
  const b = { ...s, id: uid(), start: mid, text: words.slice(half).join(" ") };
  await rewriteTranscript(S().transcript.flatMap((x) => (x.id === id ? [a, b] : [x])));
});
Bus.on("transcript:merge", async (id) => {
  const list = S().transcript, i = list.findIndex((x) => x.id === id);
  if (i < 0 || i === list.length - 1) throw new Error("There is no following segment to merge with.");
  pushHistory("merge segments");
  const merged = { ...list[i], id: uid(), end: list[i + 1].end, text: (list[i].text + " " + list[i + 1].text).trim() };
  await rewriteTranscript(list.flatMap((x, k) => (k === i ? [merged] : k === i + 1 ? [] : [x])));
});
async function rewriteTranscript(next) {
  const proj = S().currentProject;
  const rows = next.map((s, i) => ({ ...s, index: i }));
  await runTransaction(["transcriptSegments", "editSegments", "editVersions"], async (api) => {
    (await api.byIndex("transcriptSegments", "projectId", proj.id)).forEach((r) => api.del("transcriptSegments", r.id));
    rows.forEach((r) => api.put("transcriptSegments", r));
    const versions = await api.byIndex("editVersions", "projectId", proj.id);
    for (const v of versions) {
      const existing = await api.byIndex("editSegments", "editVersionId", v.id);
      const byT = new Map(existing.map((e) => [e.transcriptSegmentId, e]));
      existing.forEach((e) => api.del("editSegments", e.id));
      rows.forEach((r, i) => api.put("editSegments", {
        id: uid(), editVersionId: v.id, transcriptSegmentId: r.id,
        action: (byT.get(r.id) && byT.get(r.id).action) || "keep",
        reason: (byT.get(r.id) && byT.get(r.id).reason) || null, order: i,
      }));
    }
  });
  await loadProject(proj.id);
}

Bus.on("edit:apply", async ({ segmentIds, action }) => {
  let versionId = S().activeVersionId;
  if (!versionId) versionId = await createManualVersion();
  pushHistory("manual " + action);
  const list = (S().editSegmentsByVersion[versionId] || []).slice();
  const byT = new Map(list.map((e) => [e.transcriptSegmentId, e]));
  const changed = [];
  for (const tid of segmentIds) {
    let row = byT.get(tid);
    if (!row) { row = { id: uid(), editVersionId: versionId, transcriptSegmentId: tid, action, reason: null, order: S().transcript.findIndex((t) => t.id === tid) }; list.push(row); byT.set(tid, row); }
    row.action = action; row.reason = null; changed.push(row);
  }
  await runTransaction(["editSegments"], (api) => { changed.forEach((r) => api.put("editSegments", r)); });
  State.set({ editSegmentsByVersion: { ...S().editSegmentsByVersion, [versionId]: list }, activeVersionId: versionId });
});
Bus.on('edit:preset', async (preset) => {
  const proj = S().currentProject;
  if (!proj || !S().transcript.length) throw new Error('Generate a transcript first.');
  const v = { id: uid(), projectId: proj.id, label: preset === 'silent' ? 'Silent parts removed' : 'Clipped to 60 seconds', createdAt: now(), parentVersionId: null, sourceInstructionId: null };
  let keptDur = 0;
  const segs = S().transcript.map((t, i) => {
    let action = 'keep', dur = t.end - t.start;
    if (preset === '60sec' && keptDur + dur > 60) action = 'remove';
    else if (preset === '60sec') keptDur += dur;
    return { id: uid(), editVersionId: v.id, transcriptSegmentId: t.id, action, reason: null, order: i };
  });
  await finishPreset(proj, v, segs);
});

async function createManualVersion() {
  const proj = S().currentProject;
  const v = { id: uid(), projectId: proj.id, label: 'Manual edit', createdAt: now(), parentVersionId: null, sourceInstructionId: null };
  const segs = S().transcript.map((t, i) => ({ id: uid(), editVersionId: v.id, transcriptSegmentId: t.id, action: "keep", reason: null, order: i }));
  await runTransaction(["editVersions", "editSegments", "projects"], (api) => {
    api.put("editVersions", v); segs.forEach((s) => api.put("editSegments", s));
    api.put("projects", { ...proj, activeVersionId: v.id, updatedAt: now() });
  });
  State.set({
    editVersions: S().editVersions.concat([v]),
    editSegmentsByVersion: { ...S().editSegmentsByVersion, [v.id]: segs },
    activeVersionId: v.id, currentProject: { ...proj, activeVersionId: v.id },
  });
  return v.id;
}
async function finishPreset(proj, v, segs) {
  await runTransaction(['editVersions', 'editSegments', 'projects'], (api) => {
    api.put('editVersions', v); segs.forEach((s) => api.put('editSegments', s));
    api.put('projects', { ...proj, activeVersionId: v.id, updatedAt: now() });
  });
  State.set({ editVersions: S().editVersions.concat([v]), editSegmentsByVersion: { ...S().editSegmentsByVersion, [v.id]: segs }, activeVersionId: v.id, currentProject: { ...proj, activeVersionId: v.id } });
  pushHistory('preset edit');
}

Bus.on('edit:undo', async () => {
  const { undoStack, redoStack } = S().history;
  if (!undoStack.length) return;
  const last = undoStack[undoStack.length - 1];
  const current = JSON.stringify({ transcript: S().transcript, editSegmentsByVersion: S().editSegmentsByVersion, activeVersionId: S().activeVersionId });
  await applySnapshot(last.snap);
  State.set({ history: { undoStack: undoStack.slice(0, -1), redoStack: redoStack.concat([{ label: last.label, snap: current }]) } });
});
Bus.on("edit:redo", async () => {
  const { undoStack, redoStack } = S().history;
  if (!redoStack.length) return;
  const nxt = redoStack[redoStack.length - 1];
  const current = JSON.stringify({ transcript: S().transcript, editSegmentsByVersion: S().editSegmentsByVersion, activeVersionId: S().activeVersionId });
  await applySnapshot(nxt.snap);

Bus.on("version:delete", async (id) => {

    if (proj.activeVersionId === id) api.put("projects", { ...proj, activeVersionId: null, updatedAt: now() });
  });
  const map = { ...S().editSegmentsByVersion }; delete map[id];
  const versions = S().editVersions.filter((v) => v.id !== id);
  State.set({
    editVersions: versions, editSegmentsByVersion: map,

Bus.on("chat:send", async (instruction) => {
  const text = instruction.trim();
  if (!text) throw new Error("Type an edit instruction first.");
  if (!S().transcript.length) throw new Error("Generate a transcript before asking for a cut.");
  const proj = S().currentProject;
  State.set({ ui: { ...S().ui, chatBusy: true }, errors: { ...S().errors, ai: null } });
  const userMsg = { id: uid(), projectId: proj.id, role: 'user', content: text, relatedVersionIds: null, createdAt: now() };
  State.set({ chatMessages: S().chatMessages.concat([userMsg]) });
  await addRecord('chatMessages', userMsg);
  try {
    const active = S().activeVersionId;
    const activePlan = active ? (S().editSegmentsByVersion[active] || []).map((e) => {
      const t = S().transcript.find((x) => x.id === e.transcriptSegmentId);
      return { segmentIndex: t ? t.index : -1, action: e.action };
    }).filter((x) => x.segmentIndex >= 0) : null;
    const result = await AI.generateVersions(text, S().transcript, S().chatMessages.slice(-10), activePlan);
    const parent = active || null;
    const mk = (v, fallback) => {
      const ver = { id: uid(), projectId: proj.id, label: v.label || fallback, createdAt: now(), parentVersionId: parent, sourceInstructionId: userMsg.id };
      const byIndex = new Map(S().transcript.map((t) => [t.index, t]));
      const segs = v.plan.map((p, i) => ({ id: uid(), editVersionId: ver.id, transcriptSegmentId: byIndex.get(p.segmentIndex).id, action: p.action, reason: p.reason || null, order: i }));
      return { ver, segs };
    };
    const A = mk(result.versionA, "Version A - Story"), B = mk(result.versionB, "Version B - Impact");
    const keptA = A.segs.filter((s) => s.action === "keep").length, keptB = B.segs.filter((s) => s.action === "keep").length;
    const assistantMsg = {
      id: uid(), projectId: proj.id, role: "assistant",
      content: result.summary + "\n\n" + A.ver.label + ": keeps " + keptA + " of " + A.segs.length + " segments.\n" + B.ver.label + ": keeps " + keptB + " of " + B.segs.length + " segments.",
      relatedVersionIds: [A.ver.id, B.ver.id], createdAt: now() + 1,
    };
    await runTransaction(["chatMessages", "editVersions", "editSegments", "projects"], (api) => {
      api.put("chatMessages", userMsg);
      api.put("editVersions", A.ver); A.segs.forEach((s) => api.put("editSegments", s));
      api.put("editVersions", B.ver); B.segs.forEach((s) => api.put("editSegments", s));
      api.put("chatMessages", assistantMsg);
      api.put("projects", { ...proj, activeVersionId: A.ver.id, status: "ready", updatedAt: now() });
    });
    pushHistory("ai edit");
    State.set({
      chatMessages: S().chatMessages.concat([assistantMsg]),
      editVersions: S().editVersions.concat([A.ver, B.ver]),
      editSegmentsByVersion: { ...S().editSegmentsByVersion, [A.ver.id]: A.segs, [B.ver.id]: B.segs },
      activeVersionId: A.ver.id,
      currentProject: { ...proj, activeVersionId: A.ver.id, status: "ready" },
      ui: { ...S().ui, chatBusy: false, compare: true },
    });
    await refreshProjects();
  } catch (e) {
    const errMap = { ...S().ui.chatErrors, [userMsg.id]: e.message || String(e) };
    State.set({ ui: { ...S().ui, chatBusy: false, chatErrors: errMap }, errors: { ...S().errors, ai: null } });
    Bus.emit('ai:error', e);
    throw e;
  }
});

Bus.on("export:start", async () => {
  const asset = S().currentVideoAsset;
  if (!asset) throw new Error("Import a video first.");
  const vid = S().activeVersionId;
  const ranges = vid ? keptRanges(vid) : S().transcript.map((t) => ({ start: t.start, end: t.end }));
  if (!ranges.length) throw new Error("Nothing is marked as keep — nothing to export.");
  State.set({ exportState: { status: "rendering", progress: 0, url: null } });
  try {
    const out = await withTimeout(Media.renderCut(asset.blob, ranges, (p) => State.set({ exportState: { ...S().exportState, progress: p } })), 45000);
    const url = URL.createObjectURL(out);
    State.set({ exportState: { status: "done", progress: 1, url } });
    const a = el("a", { href: url, download: (S().currentProject.name || "clippi").replace(/[^\w-]+/g, "_") + "_cut.mp4" });
    document.body.appendChild(a); a.click(); a.remove();
    toast("Export complete.", "ok");
  } catch (e) {
    State.set({ exportState: { status: "error", progress: 0, url: null } });
    throw new Error("Export failed: " + (e.message || e));
  }
});

async function startNewProjectFromHome(action) {
  const existing = (S().projects || []).map((p) => (p.name || '').toLowerCase());
  let name = 'Untitled';
  let i = 1;
  while (existing.includes(name.toLowerCase())) {
    name = 'Untitled' + i;
    i++;
  }
  await Bus.emit('project:create', name);
  if (action && action.type === 'video') {
    await Bus.emit('video:import', action.file);
  } else if (action && action.type === 'text') {
    await Bus.emit('chat:send', action.text);
  } else if (action && action.type === 'preset') {
    await Bus.emit('edit:preset', action.preset);
  }
}

    }
    const segs = s.editSegmentsByVersion[v.id] || [];
    const kept = segs.filter((e) => e.action === "keep").length;
    const dur = keptRanges(v.id).reduce((n, r) => n + (r.end - r.start), 0);
    const active = s.activeVersionId === v.id;
    return el("div", { class: `rounded-xl border p-3 ${active ? "border-neutral-900 bg-neutral-50" : "border-neutral-200"}` }, [
      el("div", { class: "flex items-center gap-2" }, [
        icon(active ? "circle-dot" : "circle", "text-neutral-500"),
        el("span", { class: "flex-1 text-sm font-medium", text: v.label }),
        btn("", { icon: "trash-2", kind: "danger", title: "Delete version", onclick: () => State.set({ ui: { ...s.ui, confirmDeleteVersionId: v.id } }) }),
      ]),
      el("p", { class: "mt-1 text-xs text-neutral-500", text: "Keeps " + kept + " of " + segs.length + " segments · " + fmt(dur) }),
      el("div", { class: "mt-2 flex flex-wrap gap-2" }, [
        btn(active ? "Active" : "Use this version", { kind: active ? "subtle" : "primary", icon: "check", disabled: active, onclick: () => Bus.emit("version:select", v.id) }),
        btn("Preview", { icon: "play-circle", onclick: () => previewVersion(v.id) }),
      ]),
      v.parentVersionId ? el("p", { class: "mt-1 text-[11px] text-neutral-400", text: "Refined from an earlier version" }) : null,
    ]);
  });
  return card("Versions", [
    btn(s.ui.compare ? "Stack" : "Compare", { icon: "columns-2", onclick: () => State.set({ ui: { ...s.ui, compare: !s.ui.compare } }) }),
  ], [el("div", { class: s.ui.compare ? "grid gap-3 sm:grid-cols-2" : "flex flex-col gap-3" }, rows)]);
}
let previewTimer = null;
let isPreviewMode = false;
function previewVersion(versionId) {
  if (!videoEl) return;
  const ranges = keptRanges(versionId);
  if (!ranges.length) { toast('This version keeps nothing to preview.', 'info'); return; }
  isPreviewMode = true;
  clearInterval(previewTimer);
  let i = 0;
  videoEl.currentTime = ranges[0].start;
  videoEl.play().catch(() => {});
  previewTimer = setInterval(() => {
    if (!videoEl || videoEl.paused) { isPreviewMode = false; clearInterval(previewTimer); return; }
    if (videoEl.currentTime >= ranges[i].end - 0.02) {
      i++;
      if (i >= ranges.length) { videoEl.pause(); clearInterval(previewTimer); isPreviewMode = false; return; }
      videoEl.currentTime = ranges[i].start;
    }
  }, 60);
}
function seekTo(t) { if (videoEl) { videoEl.currentTime = t; videoEl.play().catch(() => {}); } }
function highlightActiveSegment(time) {
  const list = S().transcript;
  const seg = list.find((s) => time >= s.start && time < s.end);
  document.querySelectorAll("[data-seg]").forEach((n) => n.classList.remove("seg-active"));
  if (!seg) return;
  const node = document.querySelector(`[data-seg="${seg.id}"]`);
  if (node) { node.classList.add("seg-active"); const p = node.parentElement; if (p && p.scrollHeight > p.clientHeight) p.scrollTop = node.offsetTop - p.offsetTop - 60; }
}

function TranscriptPanel() {
  const s = S();
  const searchInput = el("input", { type: "search", value: s.search.q, placeholder: "Search transcript", class: "w-full rounded-xl border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400" });
  searchInput.addEventListener("input", debounce((e) => {
    const q = e.target.value.trim().toLowerCase();
    const matches = q ? S().transcript.filter((t) => t.text.toLowerCase().includes(q)).map((t) => t.id) : [];
    State.set({ search: { q: e.target.value, matches, cursor: 0 } });
  }, 300));

  const body = el("div", { class: "mt-2 flex flex-col gap-1.5 max-h-[28rem] overflow-y-auto relative" });
  if (!s.transcript.length) {
    body.appendChild(emptyState("file-text", "No transcript yet", s.currentVideoAsset ? "Run transcription to generate segments." : "Import a video to generate a transcript."));
  } else {
    const q = s.search.q.trim().toLowerCase();
    const visible = s.transcript;
    if (q && !s.search.matches.length) body.appendChild(el("p", { class: "text-sm text-neutral-500 p-3", text: "No segments match “" + s.search.q + "”." }));
    visible.forEach((t) => body.appendChild(SegmentRow(t, q)));
  }

  const right = [];
  if (s.search.matches.length) right.push(btn(s.search.cursor + 1 + "/" + s.search.matches.length, {
    icon: "chevron-down", onclick: () => {
      const cur = (s.search.cursor + 1) % s.search.matches.length;
      State.set({ search: { ...s.search, cursor: cur } });
      const t = S().transcript.find((x) => x.id === s.search.matches[cur]);
      if (t) seekTo(t.start);
    },
  }));
  if (s.currentVideoAsset) right.push(btn("", { icon: "rotate-cw", title: "Re-run transcription", disabled: !!s.processing.stage, onclick: () => runTranscription() }));
  const selectionBar = s.selectedSegmentIds.length ? el("div", { class: "mb-2 flex flex-wrap items-center gap-2 rounded-xl border border-neutral-200 bg-neutral-50 p-2" }, [
    el("span", { class: "text-xs text-neutral-600", text: s.selectedSegmentIds.length + " selected" }),
    btn("Keep", { icon: "check", onclick: () => Bus.emit("edit:apply", { segmentIds: s.selectedSegmentIds, action: "keep" }) }),
    btn("Remove", { icon: "scissors", kind: "danger", onclick: () => Bus.emit("edit:apply", { segmentIds: s.selectedSegmentIds, action: "remove" }) }),
    btn("Clear", { onclick: () => State.set({ selectedSegmentIds: [] }) }),
  ]) : null;

  return card("Transcript", right, [searchInput, selectionBar, body]);
}
function SegmentRow(t, q) {
  const s = S();
  const action = s.activeVersionId ? (keepMapFor(s.activeVersionId).get(t.id) || "keep") : "keep";
  const selected = s.selectedSegmentIds.includes(t.id);
  const textNode = el("p", { class: "text-sm leading-snug " + (action === "remove" ? "text-neutral-400 line-through" : "text-neutral-800") });
  if (q && t.text.toLowerCase().includes(q)) {
    const idx = t.text.toLowerCase().indexOf(q);
    textNode.appendChild(document.createTextNode(t.text.slice(0, idx)));
    textNode.appendChild(el("mark", { text: t.text.slice(idx, idx + q.length) }));
    textNode.appendChild(document.createTextNode(t.text.slice(idx + q.length)));
  } else textNode.textContent = t.text;

  const editBox = () => {
    const inp = el("textarea", { class: "w-full rounded-lg border border-neutral-300 p-2 text-sm outline-none focus:border-neutral-500", rows: "2" });
    inp.value = t.text;
    const e2 = el("p", { class: "text-xs text-red-600 hidden mt-1" });
    const save = () => { if (!inp.value.trim()) { e2.textContent = "Text is required."; e2.classList.remove("hidden"); return; } Bus.emit("transcript:edit", { id: t.id, text: inp.value }); };
    const holder = el("div", { class: "mt-1" }, [inp, e2, el("div", { class: "mt-1 flex gap-2" }, [btn("Save", { kind: "primary", onclick: save }), btn("Cancel", { onclick: () => row.replaceChild(textNode, holder) })])]);
    return holder;
  };

  const reason = s.activeVersionId ? ((s.editSegmentsByVersion[s.activeVersionId] || []).find((e) => e.transcriptSegmentId === t.id) || {}).reason : null;
  const row = el("div", {
    "data-seg": t.id,
    class: `rounded-xl border p-2 transition ${selected ? "border-neutral-900 bg-neutral-50" : "border-neutral-200 bg-white"}`,
  }, [
    el("div", { class: "flex items-center gap-2" }, [
      el("button", { type: "button", class: "text-[11px] tabular-nums text-neutral-500 hover:text-neutral-900", text: fmt(t.start), onclick: () => seekTo(t.start) }),
      el("span", { class: "flex-1" }),
      el("button", { type: "button", title: "Toggle select", class: "text-neutral-400 hover:text-neutral-900", onclick: () => State.set({ selectedSegmentIds: selected ? s.selectedSegmentIds.filter((x) => x !== t.id) : s.selectedSegmentIds.concat([t.id]) }) }, [icon(selected ? "check-square" : "square")]),
      el("button", { type: "button", title: action === "keep" ? "Mark remove" : "Mark keep", class: "text-neutral-400 hover:text-neutral-900", onclick: () => Bus.emit("edit:apply", { segmentIds: [t.id], action: action === "keep" ? "remove" : "keep" }) }, [icon(action === "keep" ? "scissors" : "rotate-ccw")]),
      el("button", { type: "button", title: "Edit text", class: "text-neutral-400 hover:text-neutral-900", onclick: () => { const b = editBox(); row.replaceChild(b, textNode); refreshIcons(); } }, [icon("pencil")]),
      el("button", { type: "button", title: "Split segment", class: "text-neutral-400 hover:text-neutral-900", onclick: () => Bus.emit("transcript:split", t.id) }, [icon("split")]),
      el("button", { type: "button", title: "Merge with next", class: "text-neutral-400 hover:text-neutral-900", onclick: () => Bus.emit("transcript:merge", t.id) }, [icon("merge")]),
    ]),
    textNode,
    reason ? el("p", { class: "mt-1 text-[11px] text-neutral-400", text: "AI: " + reason }) : null,
  ]);
  return row;
}

function ChatPanel() {
  const s = S();
  const list = el("div", { class: "flex flex-col gap-2 max-h-64 overflow-y-auto" });
  if (!s.chatMessages.length) list.appendChild(emptyState("message-square", "No messages yet", "Describe the edit you want, for example: cut the small talk and keep the product demo."));
  s.chatMessages.forEach((m) => {
    list.appendChild(el("div", { class: "flex " + (m.role === "user" ? "justify-end" : "justify-start") }, [
      el("div", { class: `max-w-[85%] whitespace-pre-wrap rounded-xl border px-3 py-2 text-sm ${m.role === "user" ? "bg-neutral-900 text-white border-neutral-900" : "bg-neutral-50 text-neutral-800 border-neutral-200"}`, text: m.content }),
    ]));
  });
  setTimeout(() => { list.scrollTop = list.scrollHeight; }, 0);

  const input = el("textarea", { rows: "2", placeholder: "Tell Clippi what to cut…", class: "w-full rounded-xl border border-neutral-200 px-3 py-2 text-sm outline-none focus:border-neutral-400" });
  const inputErr = el("p", { class: "text-xs text-red-600 hidden mt-1" });
  const send = () => {
    if (!input.value.trim()) { inputErr.textContent = "Enter an instruction first."; inputErr.classList.remove("hidden"); return; }
    inputErr.classList.add("hidden");
    const v = input.value; input.value = "";
    Bus.emit("chat:send", v);
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

  const children = [list];
  if (s.ui.chatBusy) children.push(el("div", { class: "mt-2 flex items-center gap-2 text-sm text-neutral-500" }, [icon("loader", "animate-spin"), el("span", { text: "Generating two alternative cuts…" })]));
  if (s.errors.ai) children.push(el("div", { class: "mt-2" }, [errorBox(s.errors.ai, null)]));
  children.push(el("div", { class: "mt-2" }, [input, inputErr, el("div", { class: "mt-1 flex justify-end" }, [btn("Generate cuts", { kind: "primary", icon: "sparkles", disabled: s.ui.chatBusy, onclick: send })])]));
  return card("AI editor", [], children);
}

/* ============================ INIT ============================ */
State.subscribe("*", () => render());
(async function init() {
  try {
    await openDB();
    const settings = await loadSettings();
    State.set({ settings, ui: { ...S().ui, crossOriginWarning: !window.crossOriginIsolated } });
    Bus.emit("engine:detect");
    await refreshProjects();
    render();
    const last = localStorage.getItem("clippi:lastProject");
    if (last) { const p = await getRecord("projects", last); if (p) await loadProject(last); }
  } catch (e) {
    root.replaceChildren(el("div", { class: "max-w-md mx-auto p-6" }, [errorBox(e.message || String(e), () => location.reload())]));
    refreshIcons();
  }
})();
</script>
</body>
