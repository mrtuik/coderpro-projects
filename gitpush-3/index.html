            flex: 1;
            min-height: 0;
            overflow-y: auto;

        .gpc-narr {

            font-weight: 400;

            line-height: 1.65;

        .gpc-narr b {

            font-size: 12px;
            background: #F4F4F5;
            padding: 1px 5px;
            border-radius: 5px;
        }

        .gpc-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 2px;
            color: #A1A1AA;
        }

        .gpc-actions button {
            color: #A1A1AA;
            display: inline-flex;
        }

        .gpc-actions button:active {
            color: #3F3F46;
        }

        /* ---- Step rows (multi-icon inline, no background box) ---- */
        .gpc-steps {
            padding-left: 2px;
        }

        .gpc-steps>*+* {
            margin-top: 12px;
        }

        .gpc-step {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .gpc-step-ics {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #404040;
        }

        .gpc-step-label {
            font-size: 12px;
            font-weight: 600;
            color: #27272A;
        }

        .gpc-step.is-pending {
            opacity: .45;
        }

        .gpc-step.is-running .gpc-step-ics {
            color: #B45309;
        }

        .gpc-step.is-running .gpc-step-label {
            color: #B45309;
        }

        .gpc-step.is-done .gpc-step-ics {
            color: #15803D;
        }

        .gpc-step.is-failed .gpc-step-ics {
            color: #DC2626;
        }

        .gpc-step.is-failed .gpc-step-label {
            color: #DC2626;
        }

        .gpc-spin {
            animation: gpcspin 1s linear infinite;
        }

        @keyframes gpcspin {
            to {
                transform: rotate(360deg);

        }

        .gpc-opts>*+* {
            margin-top: 8px;
        }

        .gpc-opt {

            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #fff;
            border: 1px solid #E4E4E7;
            border-radius: 9px;
            cursor: pointer;
            transition: background .15s;
        }

        .gpc-opt:active {
            background: #FAFAFA;
        }

        .gpc-opt.on {
            background: #FAFAFA;
        }

        .gpc-opt-l {

            align-items: center;
            gap: 12px;

        .gpc-opt-n {

            height: 20px;

            align-items: center;
            justify-content: center;

        .gpc-opt-t {
            font-size: 12px;
            font-weight: 500;
            color: #3F3F46;

        .gpc-opt.on .gpc-opt-t {

            color: #18181B;

        .gpc-opt-own {

            border-radius: 9px;
            font-size: 12px;
            color: #3F3F46;
            outline: none;
        }

        .gpc-opt-own::placeholder {
            color: #A1A1AA;
            font-style: italic;
        }

        .gpc-opt-submit {
            width: 100%;
            margin-top: 8px;
            background: #18181B;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 10px;
            border-radius: 9px;

        .gpc-opt-submit:active {
            background: #27272A;

        .gpc-opts.done {
            opacity: .75;

        .gpc-user {

            align-items: flex-end;
            gap: 6px;

        .gpc-user-bub {
            background: #fff;
            color: #18181B;
            font-size: 12px;
            padding: 10px 16px;

            box-shadow: 0 1px 2px rgba(0, 0, 0, .04);

            white-space: pre-wrap;
            word-break: break-word;
            text-align: left;

        .gpc-user .gpc-actions {

        .gpc-filecard {

            font-weight: 600;
            padding: 9px 16px;

            margin-top: 10px;

            background: #fff;
            padding: 4px;
            border-radius: 999px;

            color: #737373;

            color: #fff;

            font-size: 12px;
            color: #18181B;
            background: transparent;
            resize: none;
            outline: none;
            border: none;
            line-height: 1.65;
            max-height: 110px;

            color: #A1A1AA;

            justify-content: space-between;
            border-top: 1px solid #F4F4F5;
            padding-top: 10px;
            margin-top: 12px;

            display: flex;
            align-items: center;
            gap: 12px;
        }

            color: #A1A1AA;
            padding: 2px;

            color: #3F3F46;

            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #71717A;
            font-weight: 500;
            user-select: none;

            height: 32px;

            color: #fff;

            align-items: center;
            justify-content: center;

            background: #FAFAFA;

        .gpc-panel .field {
            margin-bottom: 10px;
        }

        .gpc-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        /* ---------------------------- Utilities ---------------------------- */
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            } [c]));
        }

        function el(html) {
            const t = document.createElement('template');
            t.innerHTML = html.trim();
            return t.content.firstElementChild;
        }

        function timeAgo(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const s = Math.floor((Date.now() - d.getTime()) / 1000);
            if (s < 60) return 'just now';
            if (s < 3600) return Math.floor(s / 60) + 'm ago';
            if (s < 86400) return Math.floor(s / 3600) + 'h ago';
            if (s < 86400 * 30) return Math.floor(s / 86400) + 'd ago';
            return d.toLocaleDateString();
        }

        function fmtTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function fmtBytes(n) {
            if (n < 1024) return n + ' B';
            if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
            return (n / 1024 / 1024).toFixed(1) + ' MB';
        }

        function extOf(name) {
            const m = /\.([a-zA-Z0-9]+)$/.exec(name);
            return m ? m[1].toLowerCase() : '';
        }
        const TEXT_EXTS = ['html', 'htm', 'css', 'js', 'jsx', 'ts', 'tsx', 'json', 'xml', 'yml', 'yaml', 'md', 'markdown', 'java', 'kt', 'kts', 'py', 'sh', 'txt', 'gradle', 'properties', 'gitignore', 'env', 'svg', 'c', 'cpp', 'h', 'hpp', 'rb', 'go', 'rs', 'php', 'sql', 'toml', 'ini', 'cfg'];

        function isTextFile(name) {
            const e = extOf(name);
            return TEXT_EXTS.includes(e) || !name.includes('.');
        }

        function b64EncodeUnicode(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p) => String.fromCharCode('0x' + p)));
        }

        function b64DecodeUnicode(b64) {
            try {
                return decodeURIComponent(atob(b64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
            } catch (e) {
                return atob(b64);
            }
        }

        function uid() {
            return Math.random().toString(36).slice(2, 10);
        }

        function debounce(fn, ms) {
            let t;
            return (...a) => {
                clearTimeout(t);
                t = setTimeout(() => fn(...a), ms);
            };
        }

        /* ---------------------------- Toasts ---------------------------- */
        function toast(msg, type) {
            const stack = document.getElementById('toastStack');
            const t = el('<div class="toast ' + (type || '') + '">' + (type === 'success' ? icon('check', 'icon-sm') : type === 'error' ? icon('x', 'icon-sm') : '') + '<span>' + esc(msg) + '</span></div>');
            stack.appendChild(t);
            setTimeout(() => {
                t.style.transition = 'opacity .2s';
                t.style.opacity = '0';
                setTimeout(() => t.remove(), 200);
            }, 2600);
        }

        /* ---------------------------- Storage layer (IndexedDB) ---------------------------- */
        const IDB_NAME = 'gitpush-store';
        const IDB_STORE = 'kv';
        let _idbP = null;

        function idbOpen() {
            if (_idbP) return _idbP;
            _idbP = new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) {
                    reject(new Error('IndexedDB unavailable'));
                    return;
                }
                const req = indexedDB.open(IDB_NAME, 1);
                req.onupgradeneeded = () => {
                    if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE);
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            return _idbP;
        }
        async function storeGet(key) {
            try {
                const db = await idbOpen();
                return await new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE, 'readonly');
                    const rq = tx.objectStore(IDB_STORE).get(key);
                    rq.onsuccess = () => resolve(rq.result === undefined ? null : rq.result);
                    rq.onerror = () => resolve(null);
                });
            } catch (e) {
                return null;
            }
        }
        async function storeSet(key, value) {
            try {
                const db = await idbOpen();
                return await new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE, 'readwrite');
                    tx.objectStore(IDB_STORE).put(value, key);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) {
                console.error('storage set failed', e);
                return false;
            }
        }
        async function storeDel(key) {
            try {
                const db = await idbOpen();
                await new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE, 'readwrite');
                    tx.objectStore(IDB_STORE).delete(key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                });
            } catch (e) {}
        }

        function ghHeaders() {
            return {
                'Authorization': 'token ' + (state.creds ? state.creds.token : ''),
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };
        }
        async function ghApi(path, opts) {
            opts = opts || {};
            const res = await fetch('https://api.github.com' + path, {
                method: opts.method || 'GET',
                headers: Object.assign(ghHeaders(), opts.headers || {}, opts.body ? {
                    'Content-Type': 'application/json'
                } : {}),
                body: opts.body ? JSON.stringify(opts.body) : undefined
            });
            let data = null;
            try {
                data = await res.json();
            } catch (e) {
                data = null;
            }
            if (!res.ok) {
                const err = new Error((data && (data.message)) || ('GitHub error ' + res.status));
                err.status = res.status;
                err.data = data;
                throw err;
            }
            return data;
        }

        /* ---------------------------- Init / boot ---------------------------- */
        async function boot() {
            state.creds = await storeGet('gh-credentials');
            state.recentRepos = (await storeGet('gh-recent-repos')) || [];
            state.cachedRepos = await storeGet('gh-cached-repos');
            if (state.creds && state.creds.token) {
                state.connected = true; // optimistic; verified silently
                verifyCredentials(true);
            }
            render();
        }

        async function verifyCredentials(silent) {
            if (!state.creds || !state.creds.token) {
                state.connected = false;
                return;
            }
            state.verifying = true;
            if (!silent) render();
            try {
                const u = await ghApi('/user');
                state.connected = true;
                state.creds.username = u.login || state.creds.username;
                await storeSet('gh-credentials', state.creds);
            } catch (e) {
                state.connected = false;
                if (!silent) toast('GitHub connection failed', 'error');
            }
            state.verifying = false;
            render();
        }

        async function saveAndVerifyKeys() {
            const user = document.getElementById('kUser').value.trim();
            const tok = document.getElementById('kTok').value.trim();
            if (!user || !tok) {
                toast('Enter username and token', 'error');
                return;
            }
            state.creds = {
                username: user,
                token: tok
            };
            const btn = document.getElementById('kSaveBtn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Verifying…';
            }
            try {
                const u = await ghApi('/user');
                if (u.login && u.login.toLowerCase() !== user.toLowerCase()) {
                    state.creds.username = u.login;
                }
                state.connected = true;
                await storeSet('gh-credentials', state.creds);
                toast('Connected as ' + u.login, 'success');
                openKeysPopover();
            } catch (e) {
                state.connected = false;
                toast('Invalid credentials or insufficient permission', 'error');
                openKeysPopover();
            }
        }

        async function submitCreateRepo() {
            const name = document.getElementById('crName').value.trim();
            const desc = document.getElementById('crDesc').value.trim();
            if (!name) {
                toast('Enter a repository name', 'error');
                return;
            }
            if (!/^[A-Za-z0-9._-]+$/.test(name)) {
                toast('Use letters, numbers, - . _ only', 'error');
                return;
            }
            const btn = document.getElementById('crBtn');
            btn.disabled = true;
            btn.textContent = 'Creating…';
            try {
                const repo = await ghApi('/user/repos', {
                    method: 'POST',
                    body: {
                        name,
                        description: desc,
                        private: createState.visibility === 'private',
                        auto_init: true
                    }
                });
                toast('Repository created', 'success');
                createState = {
                    visibility: 'public'
                };
                await pushRecent({
                    owner: repo.owner.login,
                    name: repo.name,
                    private: repo.private,
                    updated_at: repo.updated_at
                });
                state.cachedRepos = null;
                openRepo(repo.owner.login, repo.name, repo);
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Create Repository';
                let msg = e.message || 'Unable to create repository.';
                if (e.status === 422) msg = 'Repository name may already exist.';
                openModal('Unable to create repository.', '<p>' + esc(msg) + '</p>', '<button class="btn primary" onclick="closeAllOverlays()">Try Again</button>');

        function connectPromptHtml(action) {

        /* ============================================================
           HISTORY (repository list)
           ============================================================ */
        function repoActivityTs(r) {
            const a = r.pushed_at ? new Date(r.pushed_at).getTime() : 0;
            const b = r.updated_at ? new Date(r.updated_at).getTime() : 0;
            return Math.max(a || 0, b || 0);
        }
        async function ensureRepoList(force) {
            if (!state.connected) return;
            if (state.repoListLoading) return;
            if (!force && state.cachedRepos && state.cachedRepos.list && state.cachedRepos.list.length) return;
            state.repoListLoading = true;
            render();
            try {
                let all = [],
                    page = 1;
                while (true) {
                    const chunk = await ghApi('/user/repos?sort=updated&per_page=100&page=' + page);
                    all = all.concat(chunk);
                    if (chunk.length < 100 || page > 8) break;
                    page++;
                }
                const mapped = all.map(r => ({
                    owner: r.owner.login,
                    name: r.name,
                    description: r.description,
                    private: r.private,
                    updated_at: r.pushed_at || r.updated_at,
                    pushed_at: r.pushed_at,
                    default_branch: r.default_branch
                }));
                mapped.sort((a, b) => repoActivityTs(b) - repoActivityTs(a));
                state.cachedRepos = {
                    list: mapped,
                    lastSynced: Date.now()
                };
                await storeSet('gh-cached-repos', state.cachedRepos);
            } catch (e) {
                toast('Unable to refresh repositories', 'error');
            }
            state.repoListLoading = false;
            render();
        }

        function renderHistory() {
            if (!state.connected) {
                return connectPromptHtml('view your repositories');
            }
            ensureRepoList(false);
            const list = (state.cachedRepos && state.cachedRepos.list) || [];
            const q = state.historySearch.toLowerCase();
            const filtered = (q ? list.filter(r => r.name.toLowerCase().includes(q) || (r.description || '').toLowerCase().includes(q)) : list.slice()).sort((a, b) => repoActivityTs(b) - repoActivityTs(a));
            return (
                '<div style="display:flex;align-items:center;justify-content:space-between">' +
                '<div class="page-title" style="margin-bottom:0">Repositories</div>' +
                '<button class="icon-btn" onclick="ensureRepoList(true)" title="Refresh">' + (state.repoListLoading ? '<span class="dots-loader spin" style="display:inline-block"></span>' : icon('refresh')) + '</button>' +
                '</div>' +
                (state.cachedRepos ? '<div class="page-sub">Last synced ' + fmtTime(state.cachedRepos.lastSynced) + '</div>' : '<div class="page-sub">&nbsp;</div>') +
                '<div class="search-bar">' + icon('search', 'icon-sm') + '<input type="text" placeholder="Search repositories" value="' + esc(state.historySearch) + '" oninput="onHistorySearch(this.value)"></div>' +
                (state.repoListLoading && !list.length ? loaderRows(4) :
                    filtered.length ? filtered.map(r => repoRowHtml(r)).join('') :
                    '<div class="empty">' + icon('folder') + '<div>' + (q ? 'No repositories match your search.' : 'No repositories found.') + '</div></div>')
            );
        }

        function loaderRows(n) {
            let s = '';
            for (let i = 0; i < n; i++) s += '<div class="repo-row"><div class="repo-icon"><span class="dots-loader spin" style="display:inline-block"></span></div><div class="repo-meta"><div style="height:10px;width:60%;background:var(--surface-2);border-radius:4px;margin-bottom:6px"></div><div style="height:8px;width:40%;background:var(--surface-2);border-radius:4px"></div></div></div>';
            return s;
        }
        const onHistorySearch = debounce((v) => {
            state.historySearch = v;
            render();
            const inp = document.querySelector('.search-bar input');
            if (inp) {
                inp.focus();
                inp.selectionStart = inp.selectionEnd = inp.value.length;
            }

        /* ============================================================
           REPOSITORY MANAGER
           ============================================================ */
        async function openRepo(owner, name, repoObj) {
            state.currentRepo = repoObj ? {
                owner,
                name,
                description: repoObj.description,
                private: repoObj.private,
                default_branch: repoObj.default_branch || 'main'
            } : {
                owner,
                name,
                default_branch: 'main'
            };
            state.currentPath = '';
            state.pendingChanges = [];
            goTo('repo');
            if (!repoObj) {
                try {
                    const r = await ghApi('/repos/' + owner + '/' + name);
                    state.currentRepo = {
                        owner: r.owner.login,
                        name: r.name,
                        description: r.description,
                        private: r.private,
                        default_branch: r.default_branch
                    };
                    render();
                } catch (e) {
                    toast('Unable to load repository', 'error');
                }
            }
            await pushRecent({
                owner,
                name,
                private: state.currentRepo.private,
                updated_at: new Date().toISOString()
            });
            loadDir(state.currentPath, false);
        }

        function dirKey(path) {
            return state.currentRepo.owner + '/' + state.currentRepo.name + '/' + path;
        }
        async function loadDir(path, force) {
            const key = dirKey(path);
            if (!force && state.dirCache[key]) {
                render();
                return;
            }
            state.dirCache[key] = 'loading';
            render();
            try {
                const p = '/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/contents/' + encodeURI(path) + (force ? '?_=' + Date.now() : '');
                let data = await ghApi(p);
                if (!Array.isArray(data)) data = [data];
                data.sort((a, b) => (a.type === b.type) ? a.name.localeCompare(b.name) : (a.type === 'dir' ? -1 : 1));
                state.dirCache[key] = data;
            } catch (e) {
                state.dirCache[key] = (e.status === 404) ? [] : 'error';
            }
            render();
        }

        function navDir(path) {
            state.currentPath = path;
            render();
            loadDir(path, false);
        }

            if (!state.currentRepo) return '';
            const repo = state.currentRepo;
            const key = dirKey(state.currentPath);
            const items = state.dirCache[key];
            const crumbs = state.currentPath.split('/').filter(Boolean);

            let list;

            return (
                '<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">' +

                '<div style="flex:1;min-width:0">' +
                '<div class="page-title" style="margin:0 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px">' +
                '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (state.selectMode ? 'Select files' : esc(repo.name)) + '</span>' +
                (state.selectMode ? '' : '<span class="vis-ind" title="' + (repo.private ? 'Private' : 'Public') + '" aria-label="' + (repo.private ? 'Private repository' : 'Public repository') + '" role="img" style="flex:none;display:inline-flex">' + icon(repo.private ? 'lockClosed' : 'lockOpen', 'icon-sm') + '</span>') +
                '</div>' +
                '</div>' +
                (state.selectMode ? '' : '<button class="brand-mark" aria-label="GitHub actions" title="GitHub options" onclick="openGenerateLinkMenu()">' + icon('github', 'icon-sm') + '</button>') +
                (state.selectMode ? '' : '<button class="icon-btn" aria-label="Workflows" title="Workflows" onclick="openWorkflows()">' + icon('branch') + '</button>') +
                (state.selectMode ? '' : '<button class="icon-btn" aria-label="Releases and artifacts" title="Releases & Artifacts" onclick="openReleases()">' + icon('box') + '</button>') +
                (state.selectMode ? '' : '<button class="icon-btn" aria-label="More options" onclick="openRepoMenu()">' + icon('kebab') + '</button>') +
                (state.selectMode ? '' : '<button class="brand-mark" style="cursor:pointer;border:none;padding:0" onclick="openManualBuildSheet()" title="Manual setup">' + icon('play', 'icon-sm') + '</button>') +
                '</div>' +
                (state.selectMode ? '' :
                    '<div class="breadcrumb" style="margin-top:14px">' +
                    '<button class="' + (!crumbs.length ? 'cur' : '') + '" onclick="navDir(\'\')">' + esc(repo.name) + '</button>' +
                    crumbs.map((c, i) => {
                        const p = crumbs.slice(0, i + 1).join('/');
                        return '<span class="sep">/</span><button class="' + (i === crumbs.length - 1 ? 'cur' : '') + '" onclick="navDir(\'' + esc(p).replace(/'/g, "\\'") + '\')">' + esc(c) + '</button>';
                    }).join('') +

                (state.selectMode ?
                    '<div class="select-bar">' +
                    '<div class="chk ' + (allSelected ? 'on' : '') + '" onclick="toggleSelectAll()">' + (allSelected ? icon('check', 'icon-sm') : '') + '</div>' +
                    '<div class="sb-count">' + state.selectedPaths.size + ' selected</div>' +

                    '</div>' :

                '<div class="card" id="fileListCard">' + list + '</div>' +

        function fileRowHtml(it) {
            const isDir = it.type === 'dir';

                '<div class="file-row" data-name="' + esc(it.name.toLowerCase()) + '" onclick="fileRowClick(event,' + "'" + esc(it.path).replace(/'/g, "\\'") + "'" + ',' + "'" + it.type + "'" + ')">' +

        function fileRowClick(ev, path, type) {
            if (state.selectMode) {

        function exitRepo() {
            state.currentRepo = null;

        /* ---- bulk select mode ---- */
        function enterSelectMode() {
            state.selectMode = true;
            state.selectedPaths = new Set();
            render();
        }

        function exitSelectMode() {
            state.selectMode = false;
            state.selectedPaths = new Set();
            render();
        }

        function toggleSelectPath(path) {
            if (state.selectedPaths.has(path)) state.selectedPaths.delete(path);
            else state.selectedPaths.add(path);
            render();
        }

        function toggleSelectAll() {
            const key = dirKey(state.currentPath);
            const items = state.dirCache[key];
            if (!Array.isArray(items)) return;
            const allSelected = items.length > 0 && items.every(it => state.selectedPaths.has(it.path));
            if (allSelected) items.forEach(it => state.selectedPaths.delete(it.path));
            else items.forEach(it => state.selectedPaths.add(it.path));
            render();
        }

        function confirmBulkDelete() {
            const n = state.selectedPaths.size;
            if (!n) return;
            openModal('Delete ' + n + ' item' + (n === 1 ? '' : 's') + '?',
                '<p>Selected files and folders will be removed the next time you push.</p>',
                '<button class="btn ghost" onclick="closeAllOverlays()">Cancel</button><button class="btn danger" onclick="runBulkDelete()">Delete</button>'
            );
        }
        async function runBulkDelete() {
            closeAllOverlays();
            const key = dirKey(state.currentPath);
            const items = state.dirCache[key];
            const byPath = {};
            (Array.isArray(items) ? items : []).forEach(it => byPath[it.path] = it);
            let queued = 0;
            const targets = Array.from(state.selectedPaths);
            exitSelectMode();
            toast('Queuing deletion…');
            const counts = await Promise.all(targets.map(async function(path) {
                const it = byPath[path];
                if (!it) return 0;
                if (it.type === 'dir') {
                    try {
                        const files = await listAllFilesRecursive(path);
                        files.forEach(f => queueChange({
                            id: uid(),
                            type: 'delete',
                            path: f.path,
                            sha: f.sha,
                            message: 'Delete ' + f.path
                        }));
                        return files.length;
                    } catch (e) {
                        return 0;
                    }
                }
                queueChange({
                    id: uid(),
                    type: 'delete',
                    path: it.path,
                    sha: it.sha,
                    message: 'Delete ' + it.path
                });
                return 1;
            }));
            counts.forEach(function(c) {
                queued += c;
            });
            toast(queued + ' deletion' + (queued === 1 ? '' : 's') + ' queued — push to apply');
        }

        function triggerReplaceSelected() {
            if (!state.selectedPaths.size) return;
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.multiple = true;
            inp.style.display = 'none';
            document.body.appendChild(inp);
            inp.onchange = () => {
                if (inp.files.length) runBulkReplace(Array.from(inp.files));
                inp.remove();
            };
            inp.click();
        }
        async function runBulkReplace(files) {
            const key = dirKey(state.currentPath);
            const items = state.dirCache[key];
            const byName = {};
            (Array.isArray(items) ? items : []).forEach(it => {
                if (state.selectedPaths.has(it.path)) byName[it.name] = it;
            });
            let matched = 0,
                skipped = 0;
            const readOne = (file, targetItem) => new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const b64 = reader.result.split(',')[1];
                    queueChange({
                        id: uid(),
                        type: 'update',
                        path: targetItem.path,
                        content: b64,
                        sha: targetItem.sha,
                        binary: true,
                        message: 'Replace ' + targetItem.path
                    });
                    resolve();
                };
                reader.onerror = () => resolve();
                reader.readAsDataURL(file);
            });
            for (const file of files) {
                const target = byName[file.name];
                if (target) {
                    await readOne(file, target);
                    matched++;
                } else skipped++;
            }
            exitSelectMode();
            toast(matched + ' file' + (matched === 1 ? '' : 's') + ' queued to replace' + (skipped ? ', ' + skipped + ' skipped (name mismatch)' : ''));
        }

        async function handleGenerateLink() {
            if (!state.currentRepo) return;
            try {
                const key = dirKey('');
                let items = state.dirCache[key];
                if (!Array.isArray(items)) {
                    const p = '/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/contents/';
                    items = await ghApi(p);
                    if (!Array.isArray(items)) items = [items];
                    state.dirCache[key] = items;
                }
                const htmlFiles = items.filter(it => it.type === 'file' && /\.html?$/i.test(it.name));
                if (!htmlFiles.length) {
                    toast('No HTML file found in root folder', 'error');
                    return;
                }
                if (htmlFiles.length === 1) {
                    openLinkVersionSheet(htmlFiles[0].path, htmlFiles[0].name);
                    return;
                }
                const body = htmlFiles.map(f =>
                    '<button class="menu-item" onclick="closeAllOverlays();openLinkVersionSheet(\'' + esc(f.path).replace(/'/g, "\\'") + '\',\'' + esc(f.name).replace(/'/g, "\\'") + '\')">' + icon('file') + '<span class="mi-txt">' + esc(f.name) + '</span></button>'
                ).join('');
                openSheet('Pick HTML file', body);
            } catch (e) {
                toast('Unable to inspect files', 'error');
            }
        }

        async function getLinkVersions(filePath) {
            const key = 'link-versions-' + state.currentRepo.owner + '/' + state.currentRepo.name + '/' + filePath;
            return (await storeGet(key)) || [];

        function nextVersionLabel(versions) {

        async function buildPagesUrl(filePath) {
            let pg = null;
            try {
                pg = await ghApi(gpRepoBase() + '/pages');
            } catch (e) {
                const branch = (state.setup && state.setup.branch) || state.currentRepo.default_branch || 'main';
                try {
                    await ghApi(gpRepoBase() + '/pages', { method: 'POST', body: { source: { branch, path: '/' } } });
                } catch (e2) {}
            }
            let base = (pg && pg.html_url) || ('https://' + state.currentRepo.owner + '.github.io/' + state.currentRepo.name + '/');
            if (!base.endsWith('/')) base += '/';
            return base + filePath.split('/').map(encodeURIComponent).join('/');
        }

        }

        /* ---- item (file/folder) kebab menu ---- */
        function openItemMenu(path, type, name, sha) {
            const isDir = type === 'dir';
            const html =
                (!isDir ? '<button class="menu-item" onclick="closeAllOverlays();openFile(\'' + esc(path).replace(/'/g, "\\'") + '\')">' + icon('openFile') + '<span class="mi-txt">Open / Edit</span></button>' :
                    '<button class="menu-item" onclick="closeAllOverlays();navDir(\'' + esc(path).replace(/'/g, "\\'") + '\')">' + icon('folder') + '<span class="mi-txt">Open</span></button>') +
                '<button class="menu-item" onclick="closeAllOverlays();promptRename(\'' + esc(path).replace(/'/g, "\\'") + '\',\'' + esc(name).replace(/'/g, "\\'") + '\',\'' + type + '\')">' + icon('edit') + '<span class="mi-txt">Rename</span></button>' +
                (!isDir ? '<button class="menu-item" onclick="closeAllOverlays();downloadFile(\'' + esc(path).replace(/'/g, "\\'") + '\')">' + icon('download') + '<span class="mi-txt">Download</span></button>' : '') +
                '<button class="menu-item danger" onclick="closeAllOverlays();confirmDelete(\'' + esc(path).replace(/'/g, "\\'") + '\',\'' + esc(name).replace(/'/g, "\\'") + '\',\'' + type + '\')">' + icon('trash') + '<span class="mi-txt">Delete</span></button>';
            openSheet(name, html);
        }

        /* ---- create file ---- */
        function openNewFile() {
            openModal('New File',
                '<div class="field" style="margin-bottom:6px"><label>File name</label><input type="text" id="nfName" placeholder="index.html or .github/workflows/build.yml"></div>',
                '<button class="btn ghost" onclick="closeAllOverlays()">Cancel</button><button class="btn primary" onclick="submitNewFile()">Create</button>'
            );
            setTimeout(() => {
                const i = document.getElementById('nfName');
                if (i) i.focus();
            }, 50);
        }

        function joinPath(base, name) {
            let n = String(name == null ? '' : name).trim().replace(/^\/+/, '');
            let full = (base ? base + '/' : '') + n;
            full = full.replace(/\/{2,}/g, '/').replace(/\/+$/, '');
            return full;
        }

        function invalidateAncestorDirs(path) {
            const parts = String(path || '').split('/');
            parts.pop();
            let acc = '';
            delete state.dirCache[dirKey('')];
            for (const seg of parts) {
                if (!seg) continue;
                acc = acc ? acc + '/' + seg : seg;
                delete state.dirCache[dirKey(acc)];
            }
        }

        function submitNewFile() {
            const name = document.getElementById('nfName').value.trim();
            if (!name) {
                toast('Enter a file name', 'error');
                return;
            }
            const path = joinPath(state.currentPath, name);
            closeAllOverlays();
            openEditor(path, '', null, true);
        }

        /* ---- create folder ---- */
        function openNewFolder() {
            openModal('New Folder',
                '<div class="field" style="margin-bottom:6px"><label>Folder name</label><input type="text" id="nfoName" placeholder="components"></div>' +
                '<div class="hint">GitHub does not store empty folders, so a <span class="inline-code">.gitkeep</span> placeholder file will be added.</div>',
                '<button class="btn ghost" onclick="closeAllOverlays()">Cancel</button><button class="btn primary" onclick="submitNewFolder()">Create</button>'
            );
            setTimeout(() => {
                const i = document.getElementById('nfoName');
                if (i) i.focus();
            }, 50);
        }

        function submitNewFolder() {
            const name = document.getElementById('nfoName').value.trim();
            if (!name) {
                toast('Enter a folder name', 'error');
                return;
            }
            const path = joinPath(state.currentPath, name + '/.gitkeep');
            queueChange({
                id: uid(),
                type: 'add',
                path,
                content: '',
                binary: false,
                message: 'Create folder ' + name
            });
            closeAllOverlays();
            toast('Folder queued — push to publish');
        }

        /* ---- rename ---- */
        function promptRename(path, name, type) {
            openModal('Rename ' + (type === 'dir' ? 'Folder' : 'File'),
                '<div class="field" style="margin-bottom:6px"><label>New name</label><input type="text" id="rnName" value="' + esc(name) + '"></div>' +
                (type === 'dir' ? '<div class="hint">All files inside will be moved in the next push.</div>' : ''),
                '<button class="btn ghost" onclick="closeAllOverlays()">Cancel</button><button class="btn primary" onclick="submitRename(\'' + esc(path).replace(/'/g, "\\'") + '\',\'' + type + '\')">Rename</button>'
            );
        }
        async function submitRename(oldPath, type) {
            const newName = document.getElementById('rnName').value.trim();
            if (!newName) {
                toast('Enter a name', 'error');
                return;
            }
            closeAllOverlays();
            const parent = oldPath.split('/').slice(0, -1).join('/');
            if (type === 'file') {
                try {
                    const f = await ghApi('/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/contents/' + encodeURI(oldPath));
                    const newPath = (parent ? parent + '/' : '') + newName;
                    queueChange({
                        id: uid(),
                        type: 'delete',
                        path: oldPath,
                        sha: f.sha,
                        message: 'Remove ' + oldPath
                    });
                    queueChange({
                        id: uid(),
                        type: 'add',
                        path: newPath,
                        content: f.content.replace(/\n/g, ''),
                        binary: true,
                        message: 'Rename to ' + newName
                    });
                    toast('Rename queued — push to apply');
                } catch (e) {
                    toast('Unable to read file for rename', 'error');
                }
            } else {
                try {
                    const files = await listAllFilesRecursive(oldPath);
                    const newBase = (parent ? parent + '/' : '') + newName;
                    for (const f of files) {
                        const rel = f.path.slice(oldPath.length);
                        queueChange({
                            id: uid(),
                            type: 'delete',
                            path: f.path,
                            sha: f.sha,
                            message: 'Remove ' + f.path
                        });
                        queueChange({
                            id: uid(),
                            type: 'add',
                            path: newBase + rel,
                            content: f.content,
                            binary: true,
                            message: 'Move to ' + newBase + rel
                        });
                    }
                    toast(files.length + ' files queued for folder rename');
                } catch (e) {
                    toast('Unable to rename folder', 'error');
                }
            }
        }

        /* ---- delete ---- */
        function confirmDelete(path, name, type) {
            if (type === 'file') {
                openModal('Delete file?',
                    '<p><span class="inline-code">' + esc(path) + '</span></p><p>This will remove the file the next time you push.</p>',
                    '<button class="btn ghost" onclick="closeAllOverlays()">Cancel</button><button class="btn danger" onclick="queueDeleteFile(\'' + esc(path).replace(/'/g, "\\'") + '\')">Delete</button>'
                );
            } else {
                openModal('Checking folder…', '<p>Counting files inside <span class="inline-code">' + esc(path) + '</span>…</p>', '');
                listAllFilesRecursive(path).then(files => {
                    openModal('Delete folder?',
                        '<p><span class="inline-code">' + esc(path) + '/</span></p><p>This will delete ' + files.length + ' file' + (files.length === 1 ? '' : 's') + '.</p>',
                        '<button class="btn ghost" onclick="closeAllOverlays()">Cancel</button><button class="btn danger" onclick="queueDeleteFolder(\'' + esc(path).replace(/'/g, "\\'") + '\')">Delete</button>'
                    );
                    state._pendingFolderFiles = files;
                }).catch(() => toast('Unable to read folder', 'error'));
            }
        }
        async function queueDeleteFile(path) {
            closeAllOverlays();
            try {
                const f = await ghApi('/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/contents/' + encodeURI(path));
                queueChange({
                    id: uid(),
                    type: 'delete',
                    path,
                    sha: f.sha,
                    message: 'Delete ' + path
                });
            } catch (e) {
                toast('Unable to queue delete', 'error');
            }
        }

        function queueDeleteFolder(path) {
            closeAllOverlays();
            const files = state._pendingFolderFiles || [];
            files.forEach(f => queueChange({
                id: uid(),
                type: 'delete',
                path: f.path,
                sha: f.sha,
                message: 'Delete ' + f.path
            }));
            toast(files.length + ' deletions queued — push to apply');
        }
        async function listAllFilesRecursive(path) {
            let out = [];
            const p = '/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/contents/' + encodeURI(path);
            let items = await ghApi(p);
            if (!Array.isArray(items)) items = [items];
            const nested = await Promise.all(items.map(async function(it) {
                if (it.type === 'dir') {
                    return await listAllFilesRecursive(it.path);
                }
                return [{
                    path: it.path,
                    sha: it.sha,
                    content: null
                }];
            }));
            nested.forEach(function(arr) {
                out = out.concat(arr);
            });
            return out;
        }

        /* ---- download ---- */
        async function downloadFile(path) {
            try {
                const f = await ghApi('/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/contents/' + encodeURI(path));
                const bin = atob(f.content.replace(/\n/g, ''));
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const blob = new Blob([bytes]);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = path.split('/').pop();
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 4000);
            } catch (e) {
                toast('Unable to download file', 'error');
            }
        }

        /* ============================================================
           FILE UPLOAD (multi-file)
           ============================================================ */
        function handleFileUpload(files) {
            let remaining = files.length;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = () => {
                    const dataUrl = reader.result;
                    const b64 = dataUrl.split(',')[1];
                    const finalPath = (state.currentPath ? state.currentPath + '/' : '') + (file.webkitRelativePath || file.name);
                    queueChange({
                        id: uid(),
                        type: 'add',
                        path: finalPath,
                        content: b64,
                        binary: true,
                        message: 'Upload ' + file.name
                    });
                    remaining--;
                    if (remaining === 0) {
                        toast(files.length + ' file(s) queued — push to publish');
                        render();
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        /* ============================================================
           ZIP IMPORT
           ============================================================ */
        async function handleZipFile(file) {
            openModal('Reading ZIP…', '<p>Extracting <span class="inline-code">' + esc(file.name) + '</span>…</p>', '');
            try {
                const zip = await JSZip.loadAsync(file);
                const entries = [];
                zip.forEach((relPath, zEntry) => {
                    if (!zEntry.dir) entries.push({
                        path: relPath,
                        zEntry
                    });
                });
                const tree = buildZipTree(entries.map(e => e.path));
                state.zipImport = {
                    file,
                    zip,
                    entries,
                    tree,
                    selected: new Set(entries.map(e => e.path)),
                    removeOuter: detectSingleOuterFolder(entries.map(e => e.path))
                };
                closeAllOverlays();
                openZipReview();
            } catch (e) {
                closeAllOverlays();
                toast('Unable to read ZIP file', 'error');
            }
        }

        function detectSingleOuterFolder(paths) {
            if (!paths.length) return false;
            const first = paths[0].split('/')[0];
            return paths.every(p => p.split('/')[0] === first) ? first : false;
        }

        function buildZipTree(paths) {
            const root = {
                name: '',
                children: {},
                isFile: false
            };
            paths.forEach(p => {
                const parts = p.split('/').filter(Boolean);
                let node = root;
                parts.forEach((part, i) => {
                    const isLast = i === parts.length - 1;
                    if (!node.children[part]) node.children[part] = {
                        name: part,
                        children: {},
                        isFile: isLast,
                        fullPath: parts.slice(0, i + 1).join('/')
                    };
                    node = node.children[part];
                });
            });
            return root;
        }
        const ZIP_EXCLUDE_DEFAULT = ['node_modules', '.git', 'dist', 'build', '.DS_Store'];

        function openZipReview() {
            const z = state.zipImport;
            if (!z) {
                return;
            }
            // auto-deselect common junk on first open
            if (!z._autoFiltered) {
                z.entries.forEach(e => {
                    const parts = e.path.split('/');
                    if (parts.some(p => ZIP_EXCLUDE_DEFAULT.includes(p))) z.selected.delete(e.path);
                });
                z._autoFiltered = true;
            }
            goTo('zipReview');
        }

        function renderZipReview() {
            const z = state.zipImport;
            if (!z) return '<div class="empty">No ZIP loaded.</div>';
            const total = z.entries.length;
            const sel = z.selected.size;
            return (
                '<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">' +
                '<button class="icon-btn" onclick="cancelZipImport()">' + icon('x') + '</button>' +
                '<div class="page-title" style="margin:0">' + esc(z.file.name) + '</div>' +
                '</div>' +
                '<div class="page-sub">' + sel + ' of ' + total + ' files selected</div>' +
                (z.removeOuter ? (
                    '<div class="card card-pad" style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">' +
                    '<div><div style="font-weight:700;font-size:13px">Remove outer folder</div><div class="hint" style="margin-top:2px">Strip <span class="inline-code">' + esc(z.removeOuter) + '/</span> from paths</div></div>' +
                    '<button class="zip-check ' + (z.removeOuterOn !== false ? 'on' : '') + '" onclick="toggleRemoveOuter()">' + (z.removeOuterOn !== false ? icon('check', 'icon-sm') : '') + '</button>' +
                    '</div>'
                ) : '') +
                '<div class="zip-toolbar">' +
                '<button class="btn sm" onclick="zipSelectAll(true)">Select All</button>' +
                '<button class="btn sm" onclick="zipSelectAll(false)">Deselect All</button>' +
                '</div>' +
                '<div class="card card-pad">' + renderZipNode(z.tree, 0) + '</div>' +
                '<div style="height:8px"></div>' +
                '<button class="btn primary" style="margin-top:14px" onclick="pushZipSelection()" ' + (sel === 0 ? 'disabled' : '') + '>Review & Push ' + sel + ' file' + (sel === 1 ? '' : 's') + '</button>'
            );
        }

        function nodeState(node, z) {
            if (node.isFile) {
                return z.selected.has(node.fullPath) ? 'on' : 'off';
            }
            const kids = Object.values(node.children);
            const files = collectFiles(node);
            if (!files.length) return 'off';
            const onCount = files.filter(f => z.selected.has(f)).length;
            if (onCount === 0) return 'off';
            if (onCount === files.length) return 'on';
            return 'mixed';
        }

        function collectFiles(node) {
            let out = [];
            Object.values(node.children).forEach(c => {
                if (c.isFile) out.push(c.fullPath);
                else out = out.concat(collectFiles(c));
            });
            return out;
        }

        function renderZipNode(node, depth) {
            const z = state.zipImport;
            const entries = Object.values(node.children).sort((a, b) => (a.isFile === b.isFile) ? a.name.localeCompare(b.name) : (a.isFile ? 1 : -1));
            return entries.map(n => {
                const st = nodeState(n, z);
                const excluded = ZIP_EXCLUDE_DEFAULT.includes(n.name);
                const guide = depth > 0 ? '<span class="tree-guide">' + '&nbsp;&nbsp;'.repeat(depth - 1) + '└ </span>' : '';
                const row = (
                    '<div class="zip-row" style="padding-left:' + (depth * 4) + 'px">' +
                    guide +
                    '<button class="zip-check ' + (st === 'on' ? 'on' : st === 'mixed' ? 'mixed' : '') + '" onclick="toggleZipNode(\'' + esc(n.fullPath).replace(/'/g, "\\'") + '\',' + (n.isFile ? 'true' : 'false') + ')">' + (st === 'on' ? icon('check', 'icon-sm') : '') + '</button>' +
                    (!n.isFile ? icon('folder', 'icon-sm') : icon('file', 'icon-sm')) +
                    '<span class="zip-label ' + (excluded ? 'zip-excluded' : '') + '">' + esc(n.name) + (n.isFile ? '' : '/') + '</span>' +
                    '</div>'
                );
                const kidsHtml = !n.isFile ? renderZipNode(n, depth + 1) : '';
                return '<div class="zip-node">' + row + kidsHtml + '</div>';
            }).join('');
        }

        function toggleZipNode(fullPath, isFile) {
            const z = state.zipImport;
            if (isFile) {
                if (z.selected.has(fullPath)) z.selected.delete(fullPath);
                else z.selected.add(fullPath);
            } else {
                // find node
                const parts = fullPath.split('/');
                let node = z.tree;
                for (const p of parts) node = node.children[p];
                const files = collectFiles(node);
                const allOn = files.every(f => z.selected.has(f));
                files.forEach(f => allOn ? z.selected.delete(f) : z.selected.add(f));
            }
            render();
        }

        function zipSelectAll(on) {
            const z = state.zipImport;
            if (on) z.entries.forEach(e => z.selected.add(e.path));
            else z.selected.clear();
            render();
        }

        function toggleRemoveOuter() {
            const z = state.zipImport;
            z.removeOuterOn = z.removeOuterOn === false ? true : false;
            render();
        }

        function cancelZipImport() {
            state.zipImport = null;
            goTo('repo');
        }

        async function pushZipSelection() {
            const z = state.zipImport;
            const paths = Array.from(z.selected);
            if (!paths.length) {
                toast('Select at least one file', 'error');
                return;
            }
            openModal('Preparing files…', '<p>Reading ' + paths.length + ' file' + (paths.length === 1 ? '' : 's') + ' from the ZIP…</p>', '');
            const removeOuter = z.removeOuter && z.removeOuterOn !== false ? z.removeOuter + '/' : null;
            const entryMap = {};
            z.entries.forEach(e => entryMap[e.path] = e.zEntry);
            let done = 0;
            for (const p of paths) {
                const zEntry = entryMap[p];
                const b64 = await zEntry.async('base64');
                let target = p;
                if (removeOuter && target.startsWith(removeOuter)) target = target.slice(removeOuter.length);
                target = (state.currentPath ? state.currentPath + '/' : '') + target;
                queueChange({
                    id: uid(),
                    type: 'add',
                    path: target,
                    content: b64,
                    binary: true,
                    message: 'Import ' + p
                });
                done++;
            }
            state.zipImport = null;
            closeAllOverlays();
            toast(done + ' files queued — review and push');
            goTo('repo');
        }

        /* ============================================================
           PENDING CHANGES / REVIEW / PUSH
           ============================================================ */
        function queueChange(change) {
            state.pendingChanges = state.pendingChanges.filter(c => c.path !== change.path);
            state.pendingChanges.push(change);
            render();
        }

        function removePending(id) {
            state.pendingChanges = state.pendingChanges.filter(c => c.id !== id);
            render();
            if (document.getElementById('reviewSheetBody')) refreshReviewSheet();
        }

        function renderPendingBar() {
            if (!state.pendingChanges.length || state.screen !== 'repo') return '';
            return (
                '<div class="pending-bar">' +
                '<div class="pb-txt">' + state.pendingChanges.length + ' change' + (state.pendingChanges.length === 1 ? '' : 's') + ' pending</div>' +
                '<button onclick="openReviewChanges()">Review</button>' +
                '</div>'
            );
        }

        function diffTag(type) {
            return type === 'add' ? '+' : type === 'delete' ? '-' : 'M';
        }

        function diffClass(type) {
            return type === 'add' ? 'add' : type === 'delete' ? 'del' : 'mod';
        }

        function reviewBodyHtml() {
            if (!state.pendingChanges.length) return '<div class="empty">' + icon('check') + '<div>No pending changes.</div></div>';
            return state.pendingChanges.map(c =>
                '<div class="diff-row"><span class="diff-tag ' + diffClass(c.type) + '">' + diffTag(c.type) + '</span><span class="diff-path">' + esc(c.path) + '</span><button class="diff-x" onclick="removePending(\'' + c.id + '\')">' + icon('x', 'icon-sm') + '</button></div>'
            ).join('');
        }

        function openReviewChanges() {
            const html =
                '<div id="reviewSheetBody">' + reviewBodyHtml() + '</div>' +
                '<div class="field" style="margin-top:16px"><label>Commit message</label><input type="text" id="commitMsg" placeholder="Update files" value="' + esc(defaultCommitMsg()) + '"></div>' +
                '<button class="btn primary" id="pushBtn" style="margin-top:4px" onclick="doPush()" ' + (state.pendingChanges.length ? '' : 'disabled') + '>Push ' + state.pendingChanges.length + ' Change' + (state.pendingChanges.length === 1 ? '' : 's') + '</button>';
            openSheet('Changes', html);
        }

        function refreshReviewSheet() {
            const body = document.getElementById('reviewSheetBody');
            if (body) body.innerHTML = reviewBodyHtml();
            const btn = document.getElementById('pushBtn');
            if (btn) {
                btn.textContent = 'Push ' + state.pendingChanges.length + ' Change' + (state.pendingChanges.length === 1 ? '' : 's');
                btn.disabled = !state.pendingChanges.length;
            }
        }

        function defaultCommitMsg() {
            const n = state.pendingChanges.length;
            if (!n) return '';
            const add = state.pendingChanges.filter(c => c.type === 'add').length;
            const del = state.pendingChanges.filter(c => c.type === 'delete').length;
            const parts = [];
            if (add) parts.push(add + ' added');
            if (del) parts.push(del + ' removed');
            return 'Update files (' + parts.join(', ') + ')';
        }

        function parentKeyOf(path) {
            const parent = path.split('/').slice(0, -1).join('/');
            return dirKey(parent);
        }

        function patchCacheDelete(path) {
            const key = parentKeyOf(path);
            const items = state.dirCache[key];
            if (Array.isArray(items)) state.dirCache[key] = items.filter(it => it.path !== path);
        }

        function patchCacheUpsert(path, meta) {
            const key = parentKeyOf(path);
            const items = state.dirCache[key];
            if (!Array.isArray(items)) return;
            const idx = items.findIndex(it => it.path === path);
            const entry = {
                name: path.split('/').pop(),
                path,
                type: 'file',
                size: (meta && meta.size) || 0,
                sha: (meta && meta.sha) || undefined
            };
            if (idx >= 0) items[idx] = entry;
            else items.push(entry);
            items.sort((a, b) => (a.type === b.type) ? a.name.localeCompare(b.name) : (a.type === 'dir' ? -1 : 1));
        }
        async function silentRefreshDir(path) {
            if (!state.currentRepo) return;
            const key = dirKey(path);
            try {
                const p = '/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/contents/' + encodeURI(path) + '?_=' + Date.now();
                let data = await ghApi(p);
                if (!Array.isArray(data)) data = [data];
                data.sort((a, b) => (a.type === b.type) ? a.name.localeCompare(b.name) : (a.type === 'dir' ? -1 : 1));
                state.dirCache[key] = data;
                if (state.screen === 'repo' && state.currentPath === path) render();
            } catch (e) {
                /* keep optimistic view on failure */ }
        }
        async function doPush() {
            const msgInput = document.getElementById('commitMsg');
            const commitMsg = (msgInput ? msgInput.value.trim() : '') || 'Update files';
            const btn = document.getElementById('pushBtn');
            const changes = state.pendingChanges.slice();
            if (!changes.length) return;
            btn.disabled = true;
            let conflictDecisionAll = null;
            let pushed = 0,
                skipped = 0,
                failed = 0;
            for (const c of changes) {
                btn.textContent = 'Pushing ' + (pushed + skipped + failed + 1) + ' / ' + changes.length + '…';
                try {
                    if (c.type === 'delete') {
                        await ghApi('/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/contents/' + encodeURI(c.path), {
                            method: 'DELETE',
                            body: {
                                message: commitMsg,
                                sha: c.sha,
                                branch: state.currentRepo.default_branch
                            }
                        });
                        if (c.path.indexOf('.github/workflows/') === 0) state.wfList = null;
                        patchCacheDelete(c.path);
                    } else {
                        let sha = c.sha;
                        if (!sha) {
                            try {
                                const existing = await ghApi('/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/contents/' + encodeURI(c.path));
                                sha = existing.sha;
                                if (conflictDecisionAll == null) {
                                    const decision = await askConflictDecision(c.path);
                                    if (decision.applyAll) conflictDecisionAll = decision.action;
                                    if (decision.action === 'skip') {
                                        skipped++;
                                        continue;
                                    }
                                } else if (conflictDecisionAll === 'skip') {
                                    skipped++;
                                    continue;
                                }
                            } catch (e) {
                                /* 404 = no conflict, create new */ }
                        }
                        const content = c.binary ? c.content : b64EncodeUnicode(c.content);
                        const resp = await ghApi('/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/contents/' + encodeURI(c.path), {
                            method: 'PUT',
                            body: {
                                message: commitMsg,
                                content,
                                sha: sha || undefined,
                                branch: state.currentRepo.default_branch
                            }
                        });
                        patchCacheUpsert(c.path, resp && resp.content);
                        invalidateAncestorDirs(c.path);
                        if (c.path.indexOf('.github/workflows/') === 0) state.wfList = null;
                    }
                    pushed++;
                    state.pendingChanges = state.pendingChanges.filter(x => x.id !== c.id);
                } catch (e) {
                    failed++;
                }
            }
            closeAllOverlays();
            render();
            silentRefreshDir(state.currentPath);
            if (failed) toast(pushed + ' pushed, ' + failed + ' failed' + (skipped ? ', ' + skipped + ' skipped' : ''), failed ? 'error' : 'success');
            else toast(pushed + ' change' + (pushed === 1 ? '' : 's') + ' pushed' + (skipped ? ', ' + skipped + ' skipped' : ''), 'success');
        }

        function askConflictDecision(path) {
            return new Promise(resolve => {
                openModal('File already exists',
                    '<p><span class="inline-code">' + esc(path) + '</span> already exists in the repository. What do you want to do?</p>' +
                    '<label style="display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;margin-top:10px"><input type="checkbox" id="applyAllChk"> Apply to all remaining conflicts</label>',
                    '<button class="btn ghost" onclick="resolveConflict(\'skip\')">Skip</button><button class="btn primary" onclick="resolveConflict(\'replace\')">Replace</button>'
                );
                window._conflictResolve = (action) => {
                    const applyAll = document.getElementById('applyAllChk') ? document.getElementById('applyAllChk').checked : false;
                    closeAllOverlays();
                    resolve({
                        action,
                        applyAll
                    });
                };
            });
        }

        function resolveConflict(action) {
            if (window._conflictResolve) window._conflictResolve(action);
        }

        async function openFile(path) {
            goTo('editor', {
                editingFile: {
                    path,
                    content: '',
                    sha: null,
                    isNew: false,
                    loading: true,
                    binary: false
                }
            });
            // check pending queue first
            const pend = state.pendingChanges.find(c => c.path === path && c.type !== 'delete');
            if (pend) {
                state.editingFile = {
                    path,
                    content: pend.binary ? '' : pend.content,
                    sha: null,
                    isNew: false,
                    loading: false,
                    binary: !!pend.binary,

                };

            }
            try {
                const f = await ghApi('/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/contents/' + encodeURI(path));
                const bin = !isTextFile(path);
                state.editingFile = {
                    path,
                    content: bin ? '' : b64DecodeUnicode(f.content.replace(/\n/g, '')),
                    sha: f.sha,
                    isNew: false,
                    loading: false,
                    binary: bin

        function toggleFindBar() {
            const bar = document.getElementById('findBar');
            if (bar) {
                bar.classList.toggle('show');
                if (bar.classList.contains('show')) document.getElementById('findInput').focus();
            }
        }

        function onEditorInput() {
            const ta = document.getElementById('editorTa');
            state.editingFile.content = ta.value;
            const n = ta.value.split('\n').length;
            const gutter = document.getElementById('editorGutter');
            let arr = [];
            for (let i = 1; i <= n; i++) arr.push(i);
            gutter.textContent = arr.join('\n');
        }

        function syncGutter() {
            const ta = document.getElementById('editorTa');
            const g = document.getElementById('editorGutter');
            if (g) g.scrollTop = ta.scrollTop;
        }

        function doFind() {
            const q = document.getElementById('findInput').value;
            const ta = document.getElementById('editorTa');
            const cnt = document.getElementById('findCount');
            if (!q) {
                cnt.textContent = '';
                return;
            }
            const matches = ta.value.split(q).length - 1;
            cnt.textContent = matches + (matches === 1 ? ' match' : ' matches');
            if (matches) {
                const idx = ta.value.indexOf(q);
                ta.focus();
                ta.setSelectionRange(idx, idx + q.length);
            }
        }

        function replaceOne() {
            const q = document.getElementById('findInput').value;
            const r = document.getElementById('replInput').value;
            const ta = document.getElementById('editorTa');
            if (!q) return;
            const idx = ta.value.indexOf(q, ta.selectionStart);
            if (idx === -1) {
                toast('No more matches');
                return;
            }
            ta.value = ta.value.slice(0, idx) + r + ta.value.slice(idx + q.length);
            ta.setSelectionRange(idx, idx + r.length);
            onEditorInput();
            doFind();
        }

        function replaceAll() {
            const q = document.getElementById('findInput').value;
            const r = document.getElementById('replInput').value;
            const ta = document.getElementById('editorTa');
            if (!q) return;
            const count = ta.value.split(q).length - 1;
            ta.value = ta.value.split(q).join(r);
            onEditorInput();
            doFind();
            toast('Replaced ' + count + ' match' + (count === 1 ? '' : 'es'));
        }

        function saveEditorFile() {
            const f = state.editingFile;
            const ta = document.getElementById('editorTa');
            f.content = ta.value;
            openModal('Commit changes',
                '<div class="field" style="margin-bottom:4px"><label>Commit message</label><input type="text" id="fileCommitMsg" placeholder="' + (f.isNew ? 'Create ' : 'Update ') + esc(f.path.split('/').pop()) + '"></div>',

        function confirmSaveFile() {
            const f = state.editingFile;
            const msgInput = document.getElementById('fileCommitMsg');
            const msg = (msgInput && msgInput.value.trim()) || ((f.isNew ? 'Create ' : 'Update ') + f.path.split('/').pop());

                path: f.path,
                content: f.content,
                sha: f.sha,
                binary: false,
                message: msg
            });
            toast('Change queued — push to publish');
            goTo('repo');
        }

        /* ---------------------------- Workflow templates (with dependency caching) ----------------------------
           Caching is scoped per repository via ${{ github.repository }} so different apps
           never share or collide on a cache key. Restore/save is automatic — no user action. */
        function defaultWorkflowYaml() {
            return [
                'name: Tuik Build',
                '',
                'on:',
                '  workflow_dispatch:',
                '',
                'jobs:',
                '  build:',
                '    runs-on: ubuntu-latest',
                '    steps:',
                '      - uses: actions/checkout@v4',
                '',
                '      # ---- Node / npm cache (scoped per repo) ----',
                '      - name: Detect lockfile',
                '        id: lock',
                '        run: |',
                '          if [ -f package-lock.json ]; then echo "has_lock=true" >> $GITHUB_OUTPUT; else echo "has_lock=false" >> $GITHUB_OUTPUT; fi',
                '',
                '      - name: Setup Node (npm cache)',
                '        if: steps.lock.outputs.has_lock == \'true\'',
                '        uses: actions/setup-node@v4',
                '        with:',
                '          node-version: 20',
                '          cache: \'npm\'',
                '',
                '      - name: Setup Node (no lockfile)',
                '        if: steps.lock.outputs.has_lock != \'true\'',
                '        uses: actions/setup-node@v4',
                '        with:',
                '          node-version: 20',
                '',
                '      - name: Cache node_modules (fallback)',
                '        if: steps.lock.outputs.has_lock != \'true\'',
                '        uses: actions/cache@v4',
                '        with:',
                '          path: node_modules',
                '          key: ${{ runner.os }}-${{ github.repository }}-nodemodules-${{ hashFiles(\'package.json\') }}',
                '          restore-keys: |',
                '            ${{ runner.os }}-${{ github.repository }}-nodemodules-',
                '',
                '      # ---- Gradle cache (deps + wrapper, scoped per repo) ----',
                '      - name: Cache Gradle',
                '        uses: actions/cache@v4',
                '        with:',
                '          path: |',
                '            ~/.gradle/caches',
                '            ~/.gradle/wrapper',
                '          key: ${{ runner.os }}-${{ github.repository }}-gradle-${{ hashFiles(\'**/*.gradle*\', \'**/gradle-wrapper.properties\', \'**/gradle/libs.versions.toml\') }}',
                '          restore-keys: |',
                '            ${{ runner.os }}-${{ github.repository }}-gradle-',
                '',
                '      - name: Build',
                '        run: echo "Add build steps here"',
                ''
            ].join('\n');
        }

        function androidApkWorkflowYaml() {

        async function viewJobLog(jobId, jobName) {
            openModal('Loading log…', '<p>Fetching log for ' + esc(jobName) + '…</p>', '');
            try {
                const res = await fetch('https://api.github.com/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/actions/jobs/' + jobId + '/logs', {
                    headers: ghHeaders()
                });
                if (!res.ok) throw new Error('log fetch failed');
                const text = await res.text();
                state.lastLogText = text;
                state.logSteps = parseJobLog(text);
                openSheet(jobName, renderLogSteps());
            } catch (e) {
                const runUrl = state.currentRun && state.currentRun.run ? state.currentRun.run.html_url : null;
                openModal('Log unavailable here',
                    '<p>The raw log couldn\'t be loaded in-app' + (runUrl ? ' — open it on GitHub instead.' : '.') + '</p>',
                    (runUrl ? '<button class="btn ghost" onclick="closeAllOverlays()">Close</button><button class="btn primary" onclick="window.open(\'' + esc(runUrl) + '\',\'_blank\')">Open on GitHub</button>' : '<button class="btn primary" onclick="closeAllOverlays()">Close</button>')
                );
            }
        }
        /* Turn a raw GitHub Actions job log into labelled step blocks.
           Strips ISO timestamps and ##[...] workflow commands. */
        function parseJobLog(raw) {
            const lines = String(raw || '').split(/\r?\n/);
            const steps = [];
            let cur = {
                name: 'Job output',
                lines: []
            };
            const push = () => {
                if (cur.lines.length || steps.length === 0) steps.push(cur);
            };
            for (const rawLine of lines) {
                let line = rawLine.replace(/^\d{4}-\d{2}-\d{2}T[\d:.]+Z\s?/, '');
                line = line.replace(/\u001b\[[0-9;]*m/g, '');
                const g = /^##\[group\](.*)$/.exec(line);
                if (g) {
                    push();
                    cur = {
                        name: (g[1] || 'Step').trim(),
                        lines: []
                    };
                    continue;
                }
                if (/^##\[endgroup\]/.test(line)) continue;
                const sec = /^##\[section\](.*)$/.exec(line);
                if (sec) {
                    push();
                    cur = {
                        name: (sec[1] || 'Step').trim(),
                        lines: []
                    };
                    continue;
                }
                line = line.replace(/^##\[(error|warning|notice|debug|command)\]/, (m, k) => k === 'error' ? 'ERROR: ' : k === 'warning' ? 'WARNING: ' : '');
                cur.lines.push(line);
            }
            push();
            return steps
                .map(st => ({
                    name: st.name,
                    lines: trimBlank(st.lines)
                }))
                .filter(st => st.lines.length);
        }

        function trimBlank(arr) {
            let a = 0,
                b = arr.length;
            while (a < b && !arr[a].trim()) a++;
            while (b > a && !arr[b - 1].trim()) b--;
            return arr.slice(a, b);
        }

            return st.name + '\n' + '-'.repeat(st.name.length) + '\n' + st.lines.join('\n');
