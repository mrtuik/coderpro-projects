        /* Reliable clipboard write: async API when allowed, hidden-textarea fallback otherwise. */
        async function copyPlainText(text, okMsg) {
            const txt = String(text == null ? '' : text);
            if (!txt.trim()) {
                toast('Nothing to copy', 'error');
                return false;
            }
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(txt);
                    toast(okMsg || 'Copied to clipboard', 'success');
                    return true;
                }
            } catch (e) {
                /* fall through to legacy path */ }
            try {
                const ta = document.createElement('textarea');
                ta.value = txt;
                ta.setAttribute('readonly', '');
                ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, txt.length);
                const ok = document.execCommand('copy');
                ta.remove();
                if (ok) {
                    toast(okMsg || 'Copied to clipboard', 'success');
                    return true;
                }
            } catch (e) {}
            toast('Unable to copy — select the text manually', 'error');
            return false;
        }

        async function dispatchWorkflowRun(workflowFilename) {
            const owner = state.currentRepo.owner,
                name = state.currentRepo.name;
            const ref = state.currentRepo.default_branch || 'main';
            const since = Date.now() - 5000;
            try {
                await ghApi('/repos/' + owner + '/' + name + '/actions/workflows/' + workflowFilename + '/dispatches', {
                    method: 'POST',
                    body: {
                        ref: ref
                    }
                });
            } catch (e) {
                toast('Unable to start workflow run', 'error');
                return;
            }
            state.currentRun = {
                run: null,
                jobs: 'loading',
                starting: true
            };
            goTo('runLogs');
            for (let i = 0; i < 8; i++) {
                await new Promise(r => setTimeout(r, 1500));
                try {
                    const data = await ghApi('/repos/' + owner + '/' + name + '/actions/workflows/' + workflowFilename + '/runs?per_page=1');
                    const run = data && data.workflow_runs && data.workflow_runs[0];
                    if (run && new Date(run.created_at).getTime() >= since) {
                        openRunDetail(run.id);
                        return;
                    }
                } catch (e) {}
            }
            toast('Run not detected yet — check Runs & Logs', 'error');
        }

        async function downloadReleaseAsset(assetId, name) {
            try {
                const res = await fetch('https://api.github.com/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/releases/assets/' + assetId, {
                    headers: Object.assign(ghHeaders(), {
                        'Accept': 'application/octet-stream'
                    })
                });
                if (!res.ok) throw new Error('asset fetch failed');
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 4000);
            } catch (e) {
                toast('Unable to download asset', 'error');
            }
        }
        async function downloadArtifact(id, name) {
            try {
                const res = await fetch('https://api.github.com/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/actions/artifacts/' + id + '/zip', {
                    headers: ghHeaders()
                });
                if (!res.ok) throw new Error('artifact fetch failed');
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = name + '.zip';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 4000);
            } catch (e) {
                toast('Unable to download artifact', 'error');
            }
        }

                ).join('') +
                '</div>' +
                (b.appType ? '<div class="run-meta" style="margin:2px">Generates ' + esc(GP_WORKFLOW_PATH) + ' • artifact ' + esc(safeName(builderAppName())) + '@gitpush/tuik.' + (APP_TYPES.find(t => t.id === b.appType).out === 'apk' ? 'apk' : 'zip') + '</div>' : '') +
                '<div style="margin-top:8px"><button class="btn sm" onclick="bOpenManualEditor()">' + icon('edit', 'icon-sm') + ' Manual workflow editor</button></div>' +

                '<div class="section-title">Repository &amp; branch</div>' +
                '<div class="card card-pad">' +

                (branches ?
                    '<select onchange="bSet(\'branch\', this.value)">' + branches.map(n => '<option value="' + esc(n) + '"' + (n === b.branch ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select>' :
                    '<div class="loadline"><span class="dots-loader spin"></span>Loading branches…</div>') +

                    '<span class="chkbox">' + ((b.permissions || []).includes(perm) ? icon('check', 'icon-sm') : '') + '</span>' +
                    '<span>' + esc(label) + '</span>' +
                    '</button>'
                ).join('') +
                '</div>' +

                '<div class="section-title">Environment variables</div>' +
                '<div class="card card-pad">' + kvRowsHtml('envVars') +
                '<button class="btn sm" onclick="bKvAdd(\'envVars\')">' + icon('plus', 'icon-sm') + ' Add variable</button>' +
                '</div>' +

                '<div class="section-title">GitHub secrets</div>' +
                '<div class="card card-pad">' + kvRowsHtml('secrets') +

                '<div class="run-meta" style="margin-top:8px">Secret values stay on this device. Add matching names under GitHub → Settings → Secrets; the generated workflow references them as ${{ secrets.NAME }}.</div>' +

                '<div class="section-title">Actions</div>' +
                '<div style="display:flex;gap:8px;margin-bottom:26px">' +

                '<button class="btn" style="flex:1" onclick="bCancelBuild()">' + icon('stop', 'icon-sm') + ' Cancel build</button>' +
                '</div>'
            );
        }

        function kvRowsHtml(kind) {
            const list = state.builder[kind] || [];
            return list.map((row, i) =>
                '<div class="kv-row">' +
                '<input type="text" placeholder="KEY" value="' + esc(row.key) + '" oninput="bKvUpdate(\'' + kind + '\',' + i + ',\'key\',this.value)">' +
                '<input type="' + (kind === 'secrets' ? 'password' : 'text') + '" placeholder="value" value="' + esc(row.value) + '" oninput="bKvUpdate(\'' + kind + '\',' + i + ',\'value\',this.value)">' +
                '<button class="kv-del" aria-label="Remove" onclick="bKvRemove(\'' + kind + '\',' + i + ')">' + icon('trash', 'icon-sm') + '</button>' +
                '</div>'
            ).join('');
        }

        /* ---------------------------- Build / cancel ---------------------------- */
        async function bBuildNow() {
            const b = state.builder;
            if (!b.appType) {
                toast('Pick an app type first', 'error');
                return;
            }
            toast('Generating workflow…');
            try {
                const yaml = generateWorkflowYaml(b.appType, b);
                await putRepoFile(GP_WORKFLOW_PATH, yaml, 'Configure GitPush build workflow');
                if (b.logoDataUrl) {
                    const b64 = b.logoDataUrl.split(',')[1];
                    const ext = (/^data:image\/([a-z]+)/.exec(b.logoDataUrl) || [])[1] || 'png';
                    await putRepoFile('gitpush/logo.' + ext, b64, 'Add app logo', true);
                }
                b.configured = true;
                saveBuilder();
            } catch (e) {
                toast('Unable to write workflow file', 'error');
                return;
            }
            await dispatchWorkflowRun('gitpush-tuik.yml');
        }
        async function bCancelBuild() {
            try {
                const data = await ghApi('/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/actions/runs?per_page=10');
                const active = (data.workflow_runs || []).find(r => r.status === 'in_progress' || r.status === 'queued');
                if (!active) {
                    toast('No running build to cancel', 'error');
                    return;
                }
                await ghApi('/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/actions/runs/' + active.id + '/cancel', {
                    method: 'POST'
                });
                toast('Build cancelled', 'success');
            } catch (e) {
                toast('Unable to cancel the run', 'error');
            }
        }
        async function putRepoFile(path, content, message, isBase64) {
            const base = '/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name + '/contents/' + encodeURI(path);
            let sha = null;
            try {
                const existing = await ghApi(base + '?ref=' + encodeURIComponent(state.builder.branch));
                sha = existing.sha;
            } catch (e) {}
            const body = {
                message,
                content: isBase64 ? content : b64EncodeUnicode(content),
                branch: state.builder.branch
            };
            if (sha) body.sha = sha;
            await ghApi(base, {
                method: 'PUT',
                body
            });
        }

        /* -----------------------------------------------------------------------------
           MANUAL SETUP BOTTOM SHEET (Fix 7)
           Header ▶ Run opens this: a direct, non-AI form (icon, name, app-type
           template, Android permissions, Build). Separate entry point from the AI
           chat — the ".tuik AI" pill beside "+" opens the chat instead.
        ----------------------------------------------------------------------------- */
        async function openManualBuildSheet() {
            if (!state.currentRepo) {
                toast('Open a repository first', 'error');
                return;
            }
            let saved = null;
            try {
                saved = await storeGet(builderKey());
            } catch (e) {}
            state.builder = Object.assign(defaultBuilder(), saved || {});
            state.builder.branches = state.builder.branches || null;
            state.builder.overwriteWorkflow = false;
            state.manualExistingWf = null;
            try {
                const wfs = await ghListWorkflowFiles();
                state.manualExistingWf = (wfs && wfs.length) ? wfs[0] : null;
            } catch (e) {}
            loadBuilderBranches();
            renderManualSheet();
        }

        function renderManualSheet() {
            openSheet('Manual setup', renderManualSheetBody());
        }

        function mNeedsPerms() {
            const t = APP_TYPES.find(x => x.id === (state.builder && state.builder.appType));
            return !!(t && t.out === 'apk');
        }

        function mToggleOverwrite() {
            if (!state.builder) return;
            state.builder.overwriteWorkflow = !state.builder.overwriteWorkflow;
            renderManualSheet();
        }

        function mPickLogo() {
            const inp = document.getElementById('mLogoInput');
            if (inp) inp.click();
        }

        function mLogoChosen(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                state.builder.logoDataUrl = reader.result;
                state.builder.logoName = file.name;
                if (state.setup) {
                    state.setup.iconDataUrl = reader.result;
                    state.setup.iconName = file.name;
                    saveSetup();
                }
                saveBuilder();
                renderManualSheet();
            };
            reader.readAsDataURL(file);
        }

        function renderManualSheetBody() {
            const b = state.builder;
            const hasWf = !!state.manualExistingWf;
            const overwrite = !!b.overwriteWorkflow;
            return ('<div class="field" style="margin-bottom:14px"><label>App icon &amp; name</label>' +
                '<div class="app-identity-card-black">' +
                '<div class="logo-prev" style="flex:none">' + (b.logoDataUrl ? '<img src="' + esc(b.logoDataUrl) + '" alt="App icon">' : icon('image')) + '</div>' +
                '<button class="app-upload-btn" aria-label="Upload app icon" title="Upload app icon" onclick="mPickLogo()">' + icon('upload', 'icon-sm') + '</button>' +
                '<input type="file" id="mLogoInput" accept="image/*" style="display:none" onchange="mLogoChosen(this)">' +
                '<input type="text" class="app-name-input" value="' + esc(b.appName) + '" oninput="bSet(\'appName\', this.value)" placeholder="App name">' +
                '</div>' +
                '</div>' +
                ((!hasWf || overwrite) ?
                    '<div class="field"><label>App type</label>' +
                    '<div class="wz-cards" style="overflow-x:auto;flex-wrap:nowrap">' +
                    '<button class="wz-card add" onclick="bSelectType(\'__custom__\')">' + icon('plus') + '<span>Custom</span></button>' +
                    APP_TYPES.filter(t => t.id !== 'custom').map(t =>
                        '<button class="wz-card ' + (b.appType === t.id ? 'sel' : '') + '" onclick="bSelectType(\'' + t.id + '\');renderManualSheet()">' + icon(t.ic) + '<span>' + esc(t.label) + '</span></button>'
                    ).join('') +
                    '</div>' +
                    '</div>' : '') +
                (hasWf ?
                    '<div class="field" style="margin-bottom:14px">' +
                    '<div class="row-between" style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px">' +
                    '<div><div style="font-weight:600;font-size:13px">Replace existing workflow</div><div class="run-meta">' + (overwrite ? 'Generates new template workflow' : 'Keep existing ' + esc(state.manualExistingWf.name || 'workflow') + ' as-is') + '</div></div>' +
                    '<button class="switch ' + (overwrite ? 'on' : '') + '" role="switch" aria-checked="' + (overwrite ? 'true' : 'false') + '" onclick="mToggleOverwrite()"></button>' +
                    '</div>' +
                    '</div>' : '') +
                (mNeedsPerms() && (overwrite || !hasWf) ?
                    '<div class="field"><label>Android permissions</label>' +
                    '<div class="perm-grid">' +
                    ANDROID_PERMISSIONS.map(([perm, label]) =>
                        '<button class="perm-chip ' + ((b.permissions || []).includes(perm) ? 'on' : '') + '" onclick="bTogglePermission(\'' + perm + '\');renderManualSheet()">' +
                        '<span class="chkbox">' + ((b.permissions || []).includes(perm) ? icon('check', 'icon-sm') : '') + '</span>' +
                        '<span>' + esc(label) + '</span>' +
                        '</button>'
                    ).join('') +
                    '</div>' +
                    '</div>' : '') +
                '<button class="btn primary" style="width:100%;margin-top:6px" onclick="mConfirmBuild()">' + icon('play', 'icon-sm') + ' Build</button>'
            );
        }
        /* Applies the matching template (Fix 2), replaces any existing workflow file
           with an explicit heads-up (Fix 3), then requires this separate Build tap
           before ever dispatching a real run (Fix 3.3 — no silent auto-build). */
        async function mConfirmBuild() {
            const b = state.builder;
            const hasWf = !!state.manualExistingWf;
            const overwrite = !!b.overwriteWorkflow;
            if (overwrite || !hasWf) {
                if (!b.appType) {
                    toast('Pick an app type first', 'error');
                    return;
                }
            }
            if (!b.appName || !b.appName.trim()) {
                toast('Enter an app name first', 'error');
                return;
            }
            const btn = document.querySelector('.sheet-body .btn.primary');
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Setting up…';
            }
            try {
                let targetWfFilename = 'gitpush-tuik.yml';
                if (!overwrite && hasWf) {
                    targetWfFilename = state.manualExistingWf.name;
                    if (b.logoDataUrl) {
                        try {
                            const b64 = b.logoDataUrl.split(',')[1];
                            const ext = (/^data:image\/([a-z]+)/.exec(b.logoDataUrl) || [])[1] || 'png';
                            await putRepoFile('gitpush/logo.' + ext, b64, 'Add app logo', true);
                        } catch (e) {}
                    }
                } else {
                    const existing = await ghListWorkflowFiles();
                    const gp = existing.find(w => w.name === 'gitpush-tuik.yml') || existing[0];
                    if (gp) toast('Replacing existing workflow (' + gp.name + ') with the ' + APP_TYPES.find(t => t.id === b.appType).label + ' template');
                    const yaml = generateWorkflowYaml(b.appType, b);
                    await putRepoFile(GP_WORKFLOW_PATH, yaml, gp ? 'GitPush: replace workflow with ' + b.appType + ' template' : 'GitPush: configure build workflow');
                    for (const w of existing) {
                        if (w.name !== 'gitpush-tuik.yml' && w.path) await gpDeleteFile(w.path);
                    }
                    if (b.logoDataUrl) {
                        const b64 = b.logoDataUrl.split(',')[1];
                        const ext = (/^data:image\/([a-z]+)/.exec(b.logoDataUrl) || [])[1] || 'png';
                        await putRepoFile('gitpush/logo.' + ext, b64, 'Add app logo', true);
                    }
                    b.configured = true;
                    await saveBuilder();
                }
                state.setup = Object.assign(defaultSetup(), (await storeGet(setupKey())) || {}, {
                    appName: b.appName,
                    appType: b.appType,
                    iconDataUrl: b.logoDataUrl,
                    iconName: b.logoName,
                    permissions: b.permissions,
                    branch: b.branch,
                    complete: true
                });
                await saveSetup();
                closeAllOverlays();
                await mDispatchAndTrack(targetWfFilename);
            } catch (e) {
                toast('Unable to set up the workflow — check your connection and try again', 'error');
            }
        }
        /* Explicit, user-confirmed dispatch — reuses the same live-step pipeline the
           AI chat uses (Fix 1) so both entry points show real, incremental progress. */
        async function mDispatchAndTrack(wfFilename) {
            const targetFile = wfFilename || 'gitpush-tuik.yml';
            const branch = (state.setup && state.setup.branch) || state.currentRepo.default_branch || 'main';
            try {
                await ghApi(gpRepoBase() + '/actions/workflows/' + encodeURIComponent(targetFile) + '/dispatches', {
                    method: 'POST',
                    body: {
                        ref: branch
                    }
                });
            } catch (e) {
                toast('Unable to start the build', 'error');
                return;
            }
            state.build = {
                runId: null,
                status: 'queued',
                conclusion: null,
                since: Date.now() - 5000,
                appName: (state.setup && state.setup.appName) || state.currentRepo.name,
                type: (APP_TYPES.find(t => t.id === (state.setup && state.setup.appType)) || {}).out || 'apk',
                notified: false,
                stepMsgId: null,
                revealed: [],
                narratedCount: 0,
                failedHandled: false
            };
            await storeSet(buildKey(), state.build);
            await chatAppendDetached({
                role: 'assistant',
                kind: 'text',
                content: 'Build started from manual setup. It keeps running even if you leave this screen — come back any time for the status.'
            });
            toast('Build started');
            state.wfTab = 'runs';
            goTo('workflows');
            loadWorkflowRuns(true);
            gpPollBuild();
        }

        /* ---------------------------- Workflow templates ----------------------------
           Every template below is per-app-type, syntactically valid, and includes the
           npm + Gradle caching layers so repeat builds restore instead of re-download. */
        function yamlEnvBlock(b, indent) {
            const rows = (b.envVars || []).filter(r => r.key.trim());
            if (!rows.length) return '';
            return indent + 'env:\n' + rows.map(r => indent + '  ' + r.key.trim() + ': ' + JSON.stringify(String(r.value))).join('\n') + '\n';
        }

        function cacheSteps() {
            return [
                '      - name: Detect lockfile',
                '        id: lock',
                '        run: |',
                '          if [ -f package-lock.json ]; then echo "has_lock=true" >> $GITHUB_OUTPUT; else echo "has_lock=false" >> $GITHUB_OUTPUT; fi',
                '',
                '      - name: Setup Node (npm cache)',
                "        if: steps.lock.outputs.has_lock == 'true'",
                '        uses: actions/setup-node@v4',
                '        with:',
                '          node-version: 20',
                "          cache: 'npm'",
                '',
                '      - name: Setup Node (no lockfile)',
                "        if: steps.lock.outputs.has_lock != 'true'",
                '        uses: actions/setup-node@v4',
                '        with:',
                '          node-version: 20',
                '',
                '      - name: Cache node_modules (fallback)',
                "        if: steps.lock.outputs.has_lock != 'true'",
                '        uses: actions/cache@v4',
                '        with:',
                '          path: node_modules',
                "          key: ${{ runner.os }}-${{ github.repository }}-nodemodules-${{ hashFiles('package.json') }}",
                '          restore-keys: |',
                '            ${{ runner.os }}-${{ github.repository }}-nodemodules-',
                ''
            ].join('\n');
        }

        function gradleCacheSteps() {
            return [
                '      - name: Set up JDK 17',
                '        uses: actions/setup-java@v4',
                '        with:',
                "          distribution: 'temurin'",
                "          java-version: '17'",
                '',
                '      - name: Cache Gradle',
                '        uses: actions/cache@v4',
                '        with:',
                '          path: |',
                '            ~/.gradle/caches',
                '            ~/.gradle/wrapper',
                "          key: ${{ runner.os }}-${{ github.repository }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}",
                '          restore-keys: |',
                '            ${{ runner.os }}-${{ github.repository }}-gradle-',
                ''
            ].join('\n');
        }

        function permissionsStep(b) {
            const perms = (b.permissions || []);
            if (!perms.length) return '';
            return [
                '      - name: Inject Android permissions',
                '        run: |',
                '          MANIFEST=$(find . -path ./node_modules -prune -o -name AndroidManifest.xml -print | head -n 1)',
                '          if [ -n "$MANIFEST" ]; then',
                '            for PERM in ' + perms.join(' ') + '; do',
                '              grep -q "android.permission.$PERM" "$MANIFEST" || \\',
                '                sed -i "0,/<application/s//<uses-permission android:name=\\"android.permission.$PERM\\" \\/>\\n    <application/" "$MANIFEST"',
                '            done',
                '            echo "Permissions applied to $MANIFEST"',
                '          else',
                '            echo "No AndroidManifest.xml found — skipping permission injection"',
                '          fi',
                ''
            ].join('\n');
        }

        function iconInjectStep() {
            return [
                '      - name: Apply custom app icon',
                '        run: |',
                '          LOGO=$(ls gitpush/logo.* 2>/dev/null | head -n 1)',
                '          if [ -n "$LOGO" ]; then',
                '            for D in android/app/src/main/res/mipmap-*; do',
                '              [ -d "$D" ] && cp "$LOGO" "$D/ic_launcher.png" && cp "$LOGO" "$D/ic_launcher_round.png"',
                '            done',
                '          fi',
                ''
            ].join('\n');
        }

        function header(name, b) {
            return [
                'name: ' + name,
                '',
                'on:',
                '  workflow_dispatch:',
                '  push:',
                '    branches: [ ' + (b.branch || 'main') + ' ]',
                '',
                'concurrency:',
                '  group: gitpush-${{ github.ref }}',
                '  cancel-in-progress: true',
                ''
            ].join('\n');
        }

        function uploadStep(artifactName, fileName, srcGlob) {
            return [
                '      - name: Rename output',
                '        run: |',
                '          mkdir -p gitpush-out',
                '          FILE=$(ls -1 ' + srcGlob + ' 2>/dev/null | head -n 1)',
                '          if [ -z "$FILE" ]; then echo "No build output matched ' + srcGlob + '" && exit 1; fi',
                '          cp "$FILE" "gitpush-out/' + fileName + '"',
                '',
                '      - name: Upload build output',
                '        uses: actions/upload-artifact@v4',
                '        with:',
                '          name: ' + artifactName,
                '          path: gitpush-out/' + fileName,
                '          if-no-files-found: error',
                ''
            ].join('\n');
        }

        function generateWorkflowYaml(type, b) {
            const app = safeName(builderAppName());
            const envBlock = yamlEnvBlock(b, '');
            const splash = b.splash ? 'true' : 'false';
            const artifact = app + '@gitpush'; // downloaded as "<AppName>@gitpush/tuik.apk"
            const secretRows = (b.secrets || []).filter(r => r.key.trim())
                .map(r => '      ' + r.key.trim() + ': ${{ secrets.' + r.key.trim() + ' }}').join('\n');
            const common = header('GitPush • ' + builderAppName(), b) + envBlock +
                'jobs:\n  build:\n    runs-on: ubuntu-latest\n    env:\n      GITPUSH_APP_NAME: ' + JSON.stringify(builderAppName()) + '\n      GITPUSH_SPLASH: "' + splash + '"\n' + (secretRows ? secretRows + '\n' : '') + '    steps:\n      - uses: actions/checkout@v4\n\n';

            if (type === 'rn-web') {
                return common + cacheSteps() + [
                    '      - name: Install dependencies',
                    '        run: npm ci || npm install',
                    '',
                    '      - name: Build React Native Web bundle',
                    '        run: npm run build --if-present || npx expo export --platform web',
                    '',
                    '      - name: Package web build',
                    '        run: |',
                    '          OUT=$( [ -d dist ] && echo dist || ([ -d build ] && echo build || echo web-build) )',
                    '          mkdir -p gitpush-src && cp -r "$OUT"/. gitpush-src/',
                    '          (cd gitpush-src && zip -qr ../tuik-web.zip .)',
                    ''
                ].join('\n') + uploadStep(artifact, 'tuik.zip', 'tuik-web.zip');
            }
            if (type === 'rn-apk') {
                return common + cacheSteps() + gradleCacheSteps() + [
                    '      - name: Install dependencies',
                    '        run: npm ci || npm install',
                    '',
                    '      - name: Ensure native Android project',
                    '        run: |',
                    '          if [ ! -d android ]; then npx expo prebuild --platform android --no-install || npx react-native eject || true; fi',
                    ''
                ].join('\n') + permissionsStep(b) + iconInjectStep() + [
                    '      - name: Build release APK',
                    '        run: |',
                    '          chmod +x android/gradlew',
                    '          cd android && ./gradlew assembleRelease --build-cache --no-daemon',
                    ''
                ].join('\n') + uploadStep(artifact, 'tuik.apk', 'android/app/build/outputs/apk/release/*.apk');
            }
            if (type === 'html-web') {
                return common + cacheSteps() + [
                    '      - name: Install dependencies (if any)',
                    '        run: |',
                    '          if [ -f package.json ]; then npm ci || npm install; fi',
                    '',
                    '      - name: Build static site',
                    '        run: |',
                    '          if [ -f package.json ] && npm run | grep -q " build"; then npm run build; fi',
                    '',
                    '      - name: Package site',
                    '        run: |',
                    '          OUT=$( [ -d dist ] && echo dist || ([ -d build ] && echo build || echo . ) )',
                    '          zip -qr tuik-web.zip "$OUT" -x "*.git*" "node_modules/*"',
                    ''
                ].join('\n') + uploadStep(artifact, 'tuik.zip', 'tuik-web.zip');
            }
            if (type === 'html-apk') {
                return common + cacheSteps() + gradleCacheSteps() + [
                    '      - name: Install Capacitor toolchain',
                    '        run: |',
                    '          if [ ! -f package.json ]; then npm init -y; fi',
                    '          npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android',
                    '',
                    '      - name: Prepare web assets',
                    '        run: |',
                    '          WEBDIR=$( [ -d dist ] && echo dist || ([ -d build ] && echo build || ([ -d public ] && echo public || echo www)) )',
                    '          mkdir -p "$WEBDIR"',
                    '          if [ ! -f "$WEBDIR/index.html" ] && [ -f index.html ]; then cp index.html "$WEBDIR"/; fi',
                    '          echo "WEBDIR=$WEBDIR" >> $GITHUB_ENV',
                    '',
                    '      - name: Create Android shell',
                    '        run: |',
                    '          if [ ! -f capacitor.config.json ]; then',
                    '            npx cap init "$GITPUSH_APP_NAME" "com.gitpush.' + app.toLowerCase().replace(/[^a-z0-9]/g, '') + '" --web-dir "$WEBDIR"',
                    '          fi',
                    '          if [ ! -d android ]; then npx cap add android; fi',
                    '          npx cap sync android',
                    ''
                ].join('\n') + permissionsStep(b) + iconInjectStep() + [
                    '      - name: Build release APK',
                    '        run: |',
                    '          chmod +x android/gradlew',
                    '          cd android && ./gradlew assembleRelease --build-cache --no-daemon',
                    ''
                ].join('\n') + uploadStep(artifact, 'tuik.apk', 'android/app/build/outputs/apk/release/*.apk');
            }
            if (type === 'native-android') {
                return common + gradleCacheSteps() + permissionsStep(b) + [
                    '      - name: Build release APK',
                    '        run: |',
                    '          GRADLE_DIR=$( [ -f gradlew ] && echo . || echo android )',
                    '          chmod +x "$GRADLE_DIR/gradlew"',
                    '          cd "$GRADLE_DIR" && ./gradlew assembleRelease --build-cache --no-daemon',
                    ''
                ].join('\n') + uploadStep(artifact, 'tuik.apk', '**/build/outputs/apk/release/*.apk');
            }
            return customStarterYaml(builderAppName(), b);
        }

        function customStarterYaml(appName, b) {
            const cfg = b || state.builder || defaultBuilder();
            return header('GitPush • ' + appName + ' (custom)', cfg) +
                'jobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n' +
                cacheSteps() + gradleCacheSteps() + [
                    '      # Add your own build steps below.',
                    '      - name: Build',
                    '        run: echo "Add build steps for ' + appName + ' here"',
                    ''
                ].join('\n') +
                uploadStep(safeName(appName) + '@gitpush', 'tuik.apk', '**/*.apk');
        }

        /* =============================================================================
           ===== GITPUSH AI CHAT MODULE START =====
           A fully client-side AI build assistant for the currently open repository.
           No server, no build step: the browser talks directly to the AI provider's
           chat-completions API (function calling) and to the GitHub REST API.

           SECTION 1  — Provider configuration & key storage
           SECTION 2  — Conversation state + IndexedDB persistence (per repo)
           SECTION 3  — System prompt template
           SECTION 4  — Tool definitions + real GitHub API tool executors
           SECTION 5  — The tool-calling loop + structured JSON response handling
           SECTION 6  — Live step rendering & real GitHub Actions polling (background)
           SECTION 7  — Build dispatch (workflow_dispatch)
           SECTION 8  — Diagnose → confirm → apply flow (no auto-commits)
           SECTION 9  — Option picker, composer, edit/delete wiring
           SECTION 10 — Rendering (A.html design port)
           ============================================================================= */

        /* -----------------------------------------------------------------------------
           SECTION 1 — PROVIDER CONFIGURATION
           Keys live in IndexedDB on this device only and are sent straight to the
           provider from the browser.
        ----------------------------------------------------------------------------- */
        const AI_PROVIDERS = [{
                id: 'groq',
                label: 'Groq',
                url: 'https://api.groq.com/openai/v1/chat/completions',
                model: 'llama-3.3-70b-versatile'
            },
            {
                id: 'openai',
                label: 'OpenAI',
                url: 'https://api.openai.com/v1/chat/completions',
                model: 'gpt-4o-mini'
            },
            {
                id: 'openrouter',
                label: 'OpenRouter',
                url: 'https://openrouter.ai/api/v1/chat/completions',
                model: 'openai/gpt-4o-mini'
            },
            {
                id: 'cerebras',
                label: 'Cerebras',
                url: 'https://api.cerebras.ai/v1/chat/completions',
                model: 'llama-3.3-70b'
            }
        ];
        const SETUP_STEPS = ['appName', 'analyze', 'appType', 'icon', 'perms', 'ready'];

        let aiCfg = null; // { provider, keys:{}, models:{} }
        state.chat = null; // see SECTION 2
        state.setup = null; // per-repo collected app configuration
        state.patchHist = null; // { undo:[], redo:[] }
        state.build = null; // { runId, status, conclusion, type, appName }

        async function loadAiCfg() {
            if (aiCfg) return aiCfg;
            aiCfg = (await storeGet('gp-ai-config')) || {
                provider: 'groq',
                keys: {},
                models: {}
            };
            if (!aiCfg.keys) aiCfg.keys = {};
            if (!aiCfg.models) aiCfg.models = {};
            return aiCfg;
        }

        function aiProvider() {
            return AI_PROVIDERS.find(p => p.id === (aiCfg && aiCfg.provider)) || AI_PROVIDERS[0];
        }

        function aiKey() {
            return (aiCfg && aiCfg.keys[aiProvider().id]) || '';
        }

        function aiModel() {
            const p = aiProvider();
            return ((aiCfg && aiCfg.models[p.id]) || '').trim() || p.model;
        }

        /* -----------------------------------------------------------------------------
           SECTION 2 — CONVERSATION STATE + PERSISTENCE (IndexedDB, scoped per repo)
           state.chat = {
             msgs:  [ UI messages ]          // what the screen renders
             turns: [ provider messages ]    // raw role/tool_calls/tool history for the model
             draft, busy, mode, panelOpen
           }
           Message kinds: 'text' | 'steps' | 'files' | 'options' | 'error' | 'image'
        ----------------------------------------------------------------------------- */
        function chatKey() {
            const r = state.currentRepo;
            return 'gp-chat-' + r.owner + '/' + r.name;
        }

        function setupKey() {
            const r = state.currentRepo;
            return 'gp-setup-' + r.owner + '/' + r.name;
        }

        function buildKey() {
            const r = state.currentRepo;
            return 'gp-build-' + r.owner + '/' + r.name;
        }

        function defaultSetup() {
            return {
                appName: (state.currentRepo && state.currentRepo.name) || 'MyApp',
                appType: null,
                iconDataUrl: null,
                iconName: null,
                permissions: ['INTERNET'],
                branch: (state.currentRepo && state.currentRepo.default_branch) || 'main',
                step: 'appName',
                complete: false
            };
        }

        function setupToBuilder() {
            const s = state.setup || defaultSetup();
            return {
                appName: s.appName,
                logoDataUrl: s.iconDataUrl,
                logoName: s.iconName,
                splash: true,
                appType: s.appType || 'rn-web',
                branch: s.branch,
                branches: null,
                permissions: s.permissions || ['INTERNET'],
                envVars: [{
                    key: '',
                    value: ''
                }],
                secrets: [{
                    key: '',
                    value: ''
                }],
                configured: true
            };
        }
        async function saveSetup() {
            try {
                await storeSet(setupKey(), state.setup);
            } catch (e) {}
        }

        /* Persist the whole conversation: UI messages + raw tool-calling history +
           any pending (unapplied) file proposals. */
        async function saveChat() {
            try {
                if (!state.chat) return;
                if (!state.chat.msgs.length) {
                    await storeDel(chatKey());
                    return;
                }
                await storeSet(chatKey(), {
                    msgs: state.chat.msgs,
                    turns: state.chat.turns,
                    updated: Date.now()
                });
            } catch (e) {}
        }
        /* Append a message even when the chat screen is closed (background build events). */
        async function chatAppendDetached(msg) {
            const rec = (await storeGet(chatKey())) || {
                msgs: [],
                turns: []
            };
            rec.msgs.push(Object.assign({
                id: uid(),
                ts: Date.now()
            }, msg));
            await storeSet(chatKey(), rec);
        }

        async function openChat() {
            if (!state.currentRepo) {
                toast('Open a repository first', 'error');
                return;
            }
            await loadAiCfg();
            let rec = await storeGet(chatKey());
            if (Array.isArray(rec)) rec = {
                msgs: rec,
                turns: []
            }; // migrate old format
            rec = rec || {
                msgs: [],
                turns: []
            };
            state.setup = Object.assign(defaultSetup(), (await storeGet(setupKey())) || {});
            state.patchHist = (await storeGet('gp-patch-' + state.currentRepo.owner + '/' + state.currentRepo.name)) || {
                undo: [],
                redo: []
            };
            state.build = (await storeGet(buildKey())) || null;
            state.chat = {
                msgs: rec.msgs || [],
                turns: rec.turns || [],
                busy: false,
                draft: '',
                mode: 'build',
                panelOpen: false
            };
            goTo('chat');
            // Resume live polling if a build was still running when the user left.
            if (state.build && state.build.status && state.build.status !== 'completed') gpPollBuild();
            if (!state.chat.msgs.length) gpKickoff();
        }

        function exitChat() {
            state.chat = null;
            goTo('repo');
        }

        function pushMsg(m) {
            const msg = Object.assign({
                id: uid(),
                ts: Date.now()
            }, m);
            state.chat.msgs.push(msg);
            saveChat();
            render();
            return msg;
        }

        function aiSay(content, extra) {
            return pushMsg(Object.assign({
                role: 'assistant',
                kind: 'text',
                content
            }, extra || {}));
        }

        function meSay(content) {
            return pushMsg({
                role: 'user',
                kind: 'text',
                content
            });
        }

        function chatBusy(on) {
            if (state.chat) {
                state.chat.busy = on;
                render();
            }
        }

        function gpKickoff() {
            aiSay('Hi — I\'m the GitPush build assistant for **' + state.currentRepo.name + '**.\n\nTell me what you want to do, or just say "fix the workflow and build the app" and I\'ll read the repository, check the last runs, and propose a fix.');
        }

        /* -----------------------------------------------------------------------------
           SECTION 3 — SYSTEM PROMPT TEMPLATE
        ----------------------------------------------------------------------------- */
        function GP_SYSTEM_PROMPT() {
            const r = state.currentRepo,
                s = state.setup || defaultSetup();
            return [
                'You are the GitPush build assistant for the repository \'' + r.owner + '/' + r.name + '\'.',
                'You help the user set up, diagnose, and fix their GitHub Actions build workflow.',
                'You have access to tools to read files, write/patch files, and inspect workflow run logs.',
                'Always explain findings in plain, simple language before proposing changes.',
                'Always ask for explicit confirmation before applying any file change.',
                'You never trigger a real build yourself — you have no build-dispatch tool. A build only ever starts when the',
                'user taps a distinct Build control (the header button, the manual setup sheet, or the "Yes, start the build"',
                'option). Never say a build "has started", "is running", or "is building" — only the app posts that message,',
                'once, after a real dispatch. If the user asks to build, confirm you\'ve prepared everything and tell them to',
                'tap Build, or offer the "Yes, start the build" option — do not describe the build as already underway.',
                '',
                'If the app type is not yet chosen (App type below says "not chosen yet") and the user\'s request depends on it',
                '(setting up or fixing the workflow), ask which app type it is before writing any workflow file: React Native',
                'Web, React Native APK, HTML SaaS Web APK (Beta), Native Android, or Custom — offer these as',
                '"options" in your JSON reply. Once known, write_or_patch_file for ' + GP_WORKFLOW_PATH + ' is automatically filled',
                'in from that app type\'s fixed template (with caching already included) rather than freehand-generated —',
                'just tell the user what you changed and why; you do not need to author the YAML yourself for that path.',
                'If a workflow file already exists at that path, say so in plain language ("There\'s already a workflow file',
                '({filename}) — I\'ll replace it with the correct template for {app type}.") before proposing the replacement.',
                '',
                'Context:',
                '- Branch: ' + (s.branch || r.default_branch || 'main'),
                '- App name: ' + (s.appName || r.name),
                '- App type: ' + (s.appType || 'not chosen yet'),
                '- Android permissions already selected: ' + ((s.permissions || []).join(', ') || 'none'),
                '- GitPush workflows live at ' + GP_WORKFLOW_PATH + ' and upload the build output as an artifact named "<AppName>@gitpush".',
                '',
                'The user is on a phone: short sentences, no raw logs, no stack traces.',
                'Use the tools to read real files, real runs and real logs. Never invent file contents.',
                '',
                'When you are done investigating, your FINAL message must be JSON ONLY (no prose, no code fence) in this exact shape:',
                '{"message":"plain language explanation for the user",',
                ' "plan_steps":[{"label":"Setting up job","status":"pending|running|done"}],',
                ' "files":[{"path":"...","content":"full new file content","action":"create|update"}],',
                ' "options":["choice one","choice two"]}',
                'plan_steps, files and options are optional — include only what applies.',
                'Never put file contents inside "message". Never commit anything yourself: the user taps Apply.'
            ].join('\n');
        }

        /* -----------------------------------------------------------------------------
           SECTION 4 — TOOL DEFINITIONS + REAL GITHUB API EXECUTORS
           read_file            GET  /repos/{o}/{r}/contents/{path}         (base64 decode)
           write_or_patch_file  PUT  /repos/{o}/{r}/contents/{path}         (staged, see §8)
           list_workflow_runs   GET  /repos/{o}/{r}/actions/runs
           get_workflow_logs    GET  /repos/{o}/{r}/actions/runs/{id}/jobs  (+ job log text)
        ----------------------------------------------------------------------------- */
        const AI_TOOLS = [{
                type: 'function',
                function: {
                    name: 'read_file',
                    description: 'Read a file (or list a folder) from the repository.',
                    parameters: {
                        type: 'object',
                        properties: {
                            path: {
                                type: 'string',
                                description: 'Repo-relative path, e.g. .github/workflows/build.yml'
                            }
                        },
                        required: ['path']
                    }
                }
            },
            {
                type: 'function',
                function: {
                    name: 'write_or_patch_file',
                    description: 'Stage a proposed file change for the user to approve. Does NOT commit.',
                    parameters: {
                        type: 'object',
                        properties: {
                            path: {
                                type: 'string'
                            },
                            content: {
                                type: 'string',
                                description: 'Full new file content'
                            }
                        },
                        required: ['path', 'content']
                    }
                }
            },
            {
                type: 'function',
                function: {
                    name: 'list_workflow_runs',
                    description: 'List the most recent GitHub Actions runs for this repository.',
                    parameters: {
                        type: 'object',
                        properties: {}
                    }
                }
            },
            {
                type: 'function',
                function: {
                    name: 'get_workflow_logs',
                    description: 'Get jobs, steps and log output for one workflow run.',
                    parameters: {
                        type: 'object',
                        properties: {
                            run_id: {
                                type: 'string'
                            }
                        },
                        required: ['run_id']
                    }
                }
            }
        ];

        function gpRepoBase() {
            return '/repos/' + state.currentRepo.owner + '/' + state.currentRepo.name;
        }

        async function ghReadFile(path) {
            const data = await ghApi(gpRepoBase() + '/contents/' + encodeURI(path));
            if (Array.isArray(data)) return data.map(d => d.type + ' ' + d.path).join('\n');
            return b64DecodeUnicode((data.content || '').replace(/\n/g, ''));
        }
        async function ghListWorkflowFiles() {
            try {
                const data = await ghApi(gpRepoBase() + '/contents/.github/workflows');
                return Array.isArray(data) ? data.filter(f => f.type === 'file') : [];
            } catch (e) {
                return [];
            }
        }
        async function ghListRuns() {
            const d = await ghApi(gpRepoBase() + '/actions/runs?per_page=10');
            return (d.workflow_runs || []).map(r => ({
                id: r.id,
                name: r.name,
                status: r.status,
                conclusion: r.conclusion,
                created_at: r.created_at,
                head_branch: r.head_branch
            }));
        }
        async function ghRunJobs(runId) {
            const jobs = await ghApi(gpRepoBase() + '/actions/runs/' + runId + '/jobs');
            return jobs.jobs || [];
        }
        async function ghRunLogs(runId) {
            const jobs = await ghRunJobs(runId);
            let out = '';
            for (const j of jobs) {
                out += 'JOB ' + j.name + ' [' + (j.conclusion || j.status) + ']\n';
                const failed = (j.steps || []).filter(s => s.conclusion === 'failure').map(s => s.name);
                if (failed.length) out += 'failed steps: ' + failed.join(', ') + '\n';
                try {
                    // The log download URL is returned as a redirect from the Actions API.
                    const res = await fetch('https://api.github.com' + gpRepoBase() + '/actions/jobs/' + j.id + '/logs', {
                        headers: ghHeaders()
                    });
                    if (res.ok) {
                        out += (await res.text()).slice(-6000) + '\n';
                    }
                } catch (e) {}
            }
            return out || 'No logs available.';
        }

        /* Turn a GitHub / network failure into plain language for the assistant bubble. */
        function gpPlainGhError(e, what) {
            const s = e && e.status;
            if (s === 401) return 'I couldn\'t ' + what + ' — your GitHub token looks invalid or expired. Reconnect GitHub from the key icon.';
            if (s === 403) return 'I couldn\'t ' + what + ' — GitHub refused the request (token permissions or rate limit).';
            if (s === 404) return 'I couldn\'t ' + what + ' — GitHub says it doesn\'t exist, or your token has no access to this repository.';
            if (s === 422) return 'I couldn\'t ' + what + ' — GitHub rejected the request as invalid.';
            return 'I couldn\'t ' + what + ' — ' + ((e && e.message) || 'network error') + '.';
        }

        /* Execute one tool call for real. Errors are returned to the model as text so
           it can explain them, and are also surfaced in the UI by the caller. */
        async function runAiTool(name, args) {
            try {
                if (name === 'read_file') return (await ghReadFile(args.path)).slice(0, 14000);
                if (name === 'list_workflow_runs') return JSON.stringify(await ghListRuns());
                if (name === 'get_workflow_logs') return (await ghRunLogs(args.run_id)).slice(-8000);
                if (name === 'write_or_patch_file') {
                    state.chat.proposed = state.chat.proposed || [];
                    const path = args.path;
                    let content = args.content || args.content_or_diff || '';
                    let existedBefore = false;
                    try {
                        await ghReadFile(path);
                        existedBefore = true;
                    } catch (e) {}
                    // The GitPush build workflow is always sourced from the fixed per-app-type
                    // template (Fix 2), not freehand model output, so generated workflows stay
                    // reliable/consistent — and any existing file at this path is fully
                    // replaced (Fix 3), never left to coexist with the new one.
                    if (path === GP_WORKFLOW_PATH && state.setup && state.setup.appType) {
                        content = generateWorkflowYaml(state.setup.appType, setupToBuilder());
                    }
                    state.chat.proposed.push({
                        path,
                        content,
                        action: existedBefore ? 'update' : 'create'
                    });
                    return existedBefore ?
                        'Change staged for ' + path + ' — this will replace the existing file entirely. Shown to the user with an Apply button; nothing is committed yet.' :
                        'Change staged for ' + path + '. Shown to the user with an Apply button; nothing is committed yet.';
                }
            } catch (e) {
                return 'TOOL_ERROR: ' + gpPlainGhError(e, 'run ' + name);
            }
            return 'Unknown tool: ' + name;
        }

        /* -----------------------------------------------------------------------------
           SECTION 5 — THE TOOL-CALLING LOOP
           1. user message + system prompt + tool definitions -> provider
           2. tool call -> execute real GitHub API call -> push tool result back
           3. repeat for as many rounds as the model needs
           4. final answer parsed as structured JSON
           5. rendered as narration / step rows / file card / option picker
        ----------------------------------------------------------------------------- */
        const GP_MAX_TOOL_ROUNDS = 8;

        async function gpProviderCall(messages) {
            const p = aiProvider();
            let res;
            try {
                res = await fetch(p.url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + aiKey()
                    },
                    body: JSON.stringify({
                        model: aiModel(),
                        messages,
                        tools: AI_TOOLS,
                        tool_choice: 'auto',
                        temperature: 0.2
                    })
                });
            } catch (e) {
                throw new Error('I couldn\'t reach ' + p.label + '. Check your internet connection and try again.');
            }
            let data = null;
            try {
                data = await res.json();
            } catch (e) {}
            if (!res.ok) {
                const m = (data && data.error && data.error.message) || ('HTTP ' + res.status);
                if (res.status === 401) throw new Error('Your ' + p.label + ' API key was rejected. Open the settings icon and paste a valid key.');
                if (res.status === 429) throw new Error(p.label + ' is rate limiting this key right now. Wait a moment and retry.');
                throw new Error(p.label + ' returned an error: ' + m);
            }
            const msg = data && data.choices && data.choices[0] && data.choices[0].message;
            if (!msg) throw new Error(p.label + ' sent back an empty reply. Try again.');
            return msg;
        }

        /* Runs the loop and returns the model's final (structured) content string. */
        async function gpToolLoop() {
            const convo = [{
                role: 'system',
                content: GP_SYSTEM_PROMPT()
            }].concat(gpTrimTurns(state.chat.turns));
            for (let round = 0; round < GP_MAX_TOOL_ROUNDS; round++) {
                const m = await gpProviderCall(convo);
                const calls = m.tool_calls || [];
                if (!calls.length) {
                    state.chat.turns.push({
                        role: 'assistant',
                        content: m.content || ''
                    });
                    return (m.content || '').trim();
                }
                const assistantTurn = {
                    role: 'assistant',
                    content: m.content || '',
                    tool_calls: calls
                };
                convo.push(assistantTurn);
                state.chat.turns.push(assistantTurn);
                for (const c of calls) {
                    let args = {};
                    try {
                        args = JSON.parse((c.function && c.function.arguments) || '{}');
                    } catch (e) {}
                    const out = await runAiTool(c.function.name, args);
                    const toolTurn = {
                        role: 'tool',
                        tool_call_id: c.id,
                        name: c.function.name,
                        content: String(out).slice(0, 12000)
                    };
                    convo.push(toolTurn);
                    state.chat.turns.push(toolTurn);
                }
                saveChat();
            }
            return JSON.stringify({
                message: 'I ran out of investigation steps. Ask me again with a narrower question.'
            });
        }

        /* Keep the raw history bounded so the request stays small, without ever
           splitting a tool_calls turn from its tool results. */
        function gpTrimTurns(turns) {
            if (turns.length <= 40) return turns;
            let i = turns.length - 40;
            while (i < turns.length && turns[i].role === 'tool') i++;
            return turns.slice(i);
        }

        /* Parse the model's final answer. Tolerates fences and plain prose. */
        function gpParseStructured(text) {
            const empty = {
                message: '',
                plan_steps: [],
                files: [],
                options: []
            };
            if (!text) return Object.assign({}, empty, {
                message: 'I didn\'t get a reply back. Try again.'
            });
            let t = String(text).trim();
            const fence = /```(?:json)?\s*([\s\S]*?)```/.exec(t);
            if (fence) t = fence[1].trim();
            const s = t.indexOf('{'),
                e = t.lastIndexOf('}');
            if (s >= 0 && e > s) {
                try {
                    const o = JSON.parse(t.slice(s, e + 1));
                    if (o && (o.message || o.files || o.plan_steps || o.options)) {
                        return {
                            message: String(o.message || ''),
                            plan_steps: (o.plan_steps || []).map(st => typeof st === 'string' ? {
                                    label: st,
                                    status: 'done'
                                } :
                                {
                                    label: String(st.label || ''),
                                    status: st.status || 'done'
                                }).filter(st => st.label),
                            files: (o.files || []).filter(f => f && f.path).map(f => ({
                                path: f.path,
                                content: String(f.content || ''),
                                action: f.action || 'update'
                            })),
                            options: (o.options || []).map(x => typeof x === 'string' ? x : String(x.label || x.value || '')).filter(Boolean)
                        };
                    }
                } catch (e2) {}
            }
            return Object.assign({}, empty, {
                message: String(text).trim()
            }); // plain prose fallback
        }

        /* Render one structured response into the A.html rhythm:
           narration -> step group -> file card -> option picker. */
        function gpRenderStructured(res) {
            if (res.message) aiSay(res.message);
            if (res.plan_steps && res.plan_steps.length) pushMsg({
                role: 'assistant',
                kind: 'steps',
                steps: res.plan_steps
            });
            const files = (res.files && res.files.length) ? res.files : (state.chat.proposed || []);
            if (files && files.length) pushMsg({
                role: 'assistant',
                kind: 'files',
                files: files,
                applied: false
            });
            if (res.options && res.options.length) pushMsg({
                role: 'assistant',
                kind: 'options',
                options: res.options,
                answered: null
            });
        }

        /* One full user turn: send, loop over tools, render the structured result. */
        async function gpRunAgent(userContent, opts) {
            opts = opts || {};
            await loadAiCfg();
            if (!aiKey()) {
                pushMsg({
                    role: 'assistant',
                    kind: 'error',
                    content: 'I need an AI provider key first. Tap the settings icon at the top right and paste your ' + aiProvider().label + ' key — it stays on this device.'
                });
                return;
            }
            state.chat.proposed = [];
            state.chat.turns.push({
                role: 'user',
                content: userContent
            });
            chatBusy(true);
            try {
                const final = await gpToolLoop();
                chatBusy(false);
                gpRenderStructured(gpParseStructured(final));
            } catch (e) {
                chatBusy(false);
                pushMsg({
                    role: 'assistant',
                    kind: 'error',
                    content: (e && e.message) || 'Something went wrong.',
                    retry: userContent
                });
            }
            saveChat();
        }

        function gpRetry(id) {
            const m = state.chat.msgs.find(x => x.id === id);
            if (!m) return;
            const text = m.retry;
            state.chat.msgs = state.chat.msgs.filter(x => x.id !== id);
            // drop the failed user turn so it isn't duplicated in the raw history
            if (state.chat.turns.length && state.chat.turns[state.chat.turns.length - 1].role === 'user') state.chat.turns.pop();
            render();
            if (text) gpRunAgent(text);
        }

        /* -----------------------------------------------------------------------------
           SECTION 6 — LIVE STEP RENDERING FROM THE REAL ACTIONS RUN (background)
           The interval lives on window, not on the chat screen, so polling continues
           when the user navigates to another screen mid-build.
        ----------------------------------------------------------------------------- */
        let gpBuildTimer = null;

        function gpPollBuild() {
            if (gpBuildTimer) clearInterval(gpBuildTimer);
            const repo = state.currentRepo;
            const tick = async () => {
                if (!state.build) {
                    clearInterval(gpBuildTimer);
                    gpBuildTimer = null;
                    return;
                }
                try {
                    const d = await ghApi('/repos/' + repo.owner + '/' + repo.name + '/actions/runs?per_page=5');
                    const runs = d.workflow_runs || [];
                    const run = state.build.runId ? runs.find(r => r.id === state.build.runId) :
                        runs.find(r => new Date(r.created_at).getTime() >= (state.build.since || 0));
                    if (!run) return;
                    state.build.runId = run.id;
                    state.build.status = run.status;
                    state.build.conclusion = run.conclusion;
                    await storeSet(buildKey(), state.build);

                    // Real step statuses straight from the run's jobs.
                    let steps = [];
                    try {
                        const jobs = await ghRunJobs(run.id);
                        jobs.forEach(j => (j.steps || []).forEach(s => steps.push({
                            label: s.name,
                            status: s.status === 'completed' ? (s.conclusion === 'failure' ? 'failed' : 'done') :
                                s.status === 'in_progress' ? 'running' : 'pending'
                        })));
                    } catch (e) {}
                    if (steps.length) gpUpdateBuildSteps(steps);

                    if (run.status === 'completed') {
                        clearInterval(gpBuildTimer);
                        gpBuildTimer = null;
                        if (!state.build.notified) {
                            state.build.notified = true;
                            await storeSet(buildKey(), state.build);
                            if (state.chat) await gpPostBuildResult(run);
                            else await chatAppendDetached({
                                role: 'assistant',
                                kind: 'text',
                                content: 'Build ' + (run.conclusion === 'success' ? 'finished successfully' : 'failed') + '.'
                            });
                            toast('Build ' + (run.conclusion || 'finished'), run.conclusion === 'success' ? 'success' : 'error');
                        }
                    }
                } catch (e) {
                    /* transient network/API issues just retry on the next tick */ }
            };
            gpBuildTimer = setInterval(tick, 8000);
            tick();
        }

        /* Live-update the step group belonging to the running build. Steps reveal one
           at a time in the order GitHub actually ran them (Fix 1.2), a short plain-
           language summary is inserted after every couple of completed steps
           (Fix 1.3), and a failure halts the "everything auto-completes" assumption:
           nothing past the failed step is shown as if it ran, and the assistant
           follows up immediately with what happened (Fix 1.4). */
        function gpUpdateBuildSteps(steps) {
            if (!state.chat || !state.build) return;
            const b = state.build;
            b.revealed = b.revealed || [];
            b.narratedCount = b.narratedCount || 0;

            // A step becomes visible once GitHub has actually started it.
            let frontier = steps.findIndex(s => s.status === 'pending');
            if (frontier === -1) frontier = steps.length;
            const failIdx = steps.findIndex(s => s.status === 'failed');
            if (failIdx !== -1 && failIdx + 1 < frontier) frontier = failIdx + 1;
            const target = steps.slice(0, frontier);

            let msg = b.stepMsgId ? state.chat.msgs.find(m => m.id === b.stepMsgId) : null;
            if (!msg) {
                msg = pushMsg({
                    role: 'assistant',
                    kind: 'steps',
                    steps: [],
                    live: true
                });
                b.stepMsgId = msg.id;
            }
            const unchanged = msg.steps.length === target.length &&
                msg.steps.every((s, i) => target[i] && s.label === target[i].label && s.status === target[i].status);
            if (unchanged) return;

            const revealNext = () => {
                const i = msg.steps.length;
                if (i >= target.length) {
                    afterReveal();
                    return;
                }
                msg.steps = target.slice(0, i + 1).map(s => Object.assign({}, s));
                saveChat();
                if (state.screen === 'chat') render();
                setTimeout(revealNext, 320);
            };
            const afterReveal = () => {
                msg.steps = target.map(s => Object.assign({}, s)); // keep visible rows' statuses fresh
                b.revealed = msg.steps;
                saveChat();
                storeSet(buildKey(), b);
                if (state.screen === 'chat') render();

                const doneSoFar = target.filter(s => s.status === 'done').length;
                const newlyDone = doneSoFar - b.narratedCount;
                const groupComplete = newlyDone >= 3 || (newlyDone >= 2 && (frontier >= steps.length || failIdx !== -1));
                if (newlyDone > 0 && groupComplete) {
                    const justFinished = target.filter(s => s.status === 'done').slice(b.narratedCount, doneSoFar);
                    b.narratedCount = doneSoFar;
                    storeSet(buildKey(), b);
                    if (justFinished.length) aiSay(gpStepGroupSummary(justFinished));
                }
                if (failIdx !== -1 && !b.failedHandled) {
                    b.failedHandled = true;
                    storeSet(buildKey(), b);
                    gpHandleStepFailure(target[failIdx]);
                }
            };
            revealNext();
        }

        /* Short plain-language narration between step groups (Fix 1.3). */
        function gpStepGroupSummary(justFinished) {
            const names = justFinished.map(s => s.label);
            if (names.length === 1) return 'Finished: ' + names[0] + '.';
            return 'Finished ' + names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] + ' — moving on.';
        }

        /* Fires the moment a real step fails — doesn't wait for the whole run to
           finish (Fix 1.4). */
        function gpHandleStepFailure(step) {
            aiSay('**' + step.label + '** failed, so I stopped there instead of continuing through the rest of the job.');
            aiSay('Want me to read the logs for that step and propose a fix?');
            pushMsg({
                role: 'assistant',
                kind: 'options',
                options: ['Yes, read the logs and fix it', 'Not now'],
                answered: null
            });
        }

        async function gpPostBuildResult(run) {
            if (run.conclusion !== 'success') {
                // Already explained per-step the moment it failed (gpHandleStepFailure) —
                // avoid saying it twice.
                if (!(state.build && state.build.failedHandled)) {
                    aiSay('The build failed. Want me to read the logs and fix it?');
                    pushMsg({
                        role: 'assistant',
                        kind: 'options',
                        options: ['Yes, read the logs and fix it', 'Not now'],
                        answered: null
                    });
                }
                return;
            }
            const appName = safeName((state.build && state.build.appName) || state.currentRepo.name);
            if (state.build && state.build.type === 'web') {
                let url = 'https://' + state.currentRepo.owner + '.github.io/' + state.currentRepo.name + '/';
                try {
                    const pg = await ghApi(gpRepoBase() + '/pages');
                    if (pg && pg.html_url) url = pg.html_url;
                } catch (e) {}
                aiSay('Build finished successfully — your web app is live at ' + url);
            } else {
                let artifact = null;
                try {
                    const d = await ghApi(gpRepoBase() + '/actions/runs/' + run.id + '/artifacts');
                    artifact = (d.artifacts || [])[0] || null;
                } catch (e) {}
                aiSay('Build finished successfully — your app package is ready.', {
                    kind: 'text'
                });
                pushMsg({
                    role: 'assistant',
                    kind: 'result',
                    data: {
                        artifactId: artifact && artifact.id,
                        filename: appName + '@gitpush'
                    }
                });
            }
        }

        function buildStatusLabel() {
            if (!state.build) return null;
            if (state.build.status !== 'completed') return {
                cls: 'running',
                txt: 'Building…'
            };
            return state.build.conclusion === 'success' ? {
                cls: 'success',
                txt: 'Build succeeded'
            } : {
                cls: 'failure',
                txt: 'Build failed'
            };
        }

        /* -----------------------------------------------------------------------------
           SECTION 7 — TRIGGERING A REAL BUILD (workflow_dispatch)
        ----------------------------------------------------------------------------- */
        let gpBuildStarting = false;
        async function chatRunBuild() {
            if (!state.currentRepo) return;
            // Guards against a double dispatch (and therefore a duplicate "Build
            // started" message) if this gets triggered from two places in the same tick
            // — e.g. the header button and an option answer (Fix 1.1).
            if (gpBuildStarting || (state.build && state.build.status && state.build.status !== 'completed')) {
                toast('A build is already running');
                return;
            }
            gpBuildStarting = true;
            if (state.chat) chatBusy(true);
            try {
                state.builder = setupToBuilder();
                const wfs = await ghListWorkflowFiles();
                const existing = wfs.find(w => w.name === 'gitpush-tuik.yml') || wfs[0];
                const appTypeLabel = (APP_TYPES.find(t => t.id === state.builder.appType) || {}).label || (state.builder.appType || 'this app');
                if (existing) {
                    // Fix 3.1/3.2 — never let an old workflow silently coexist or get used
                    // as-is; always tell the user first, then replace it with the matching
                    // template.
                    aiSay('There\'s already a workflow file (' + existing.name + ') in this repo. I\'ll replace it with the correct template for ' + appTypeLabel + '.');
                }
                const yaml = generateWorkflowYaml(state.builder.appType, state.builder);
                await gpCommitFile(GP_WORKFLOW_PATH, yaml, existing ? 'GitPush: replace workflow with ' + appTypeLabel + ' template' : 'Configure GitPush build workflow');
                if (existing && existing.path && existing.path !== GP_WORKFLOW_PATH) {
                    // A stale workflow under a different filename — delete it so only the
                    // canonical gitpush-tuik.yml remains (Fix 3.1: delete + recreate, never
                    // both).
                    await gpDeleteFile(existing.path);
                }
                if (state.setup && state.setup.iconDataUrl) {
                    const b64 = state.setup.iconDataUrl.split(',')[1];
                    const ext = (/^data:image\/([a-z]+)/.exec(state.setup.iconDataUrl) || [])[1] || 'png';
                    await gpCommitFile('gitpush/logo.' + ext, b64, 'Add app logo', true);
                }
                if (!existing) {
                    aiSay('Created ' + GP_WORKFLOW_PATH + ' for this build.');
                }
                const file = {
                    name: 'gitpush-tuik.yml'
                };
                await new Promise(r => setTimeout(r, 2500));
                const branch = (state.setup && state.setup.branch) || state.currentRepo.default_branch || 'main';
                await ghApi(gpRepoBase() + '/actions/workflows/' + encodeURIComponent(file.name) + '/dispatches', {
                    method: 'POST',
                    body: {
                        ref: branch
                    }
                });
                state.build = {
                    runId: null,
                    status: 'queued',
                    conclusion: null,
                    since: Date.now() - 5000,
                    appName: (state.setup && state.setup.appName) || state.currentRepo.name,
                    type: (APP_TYPES.find(t => t.id === (state.setup && state.setup.appType)) || {}).out || 'apk',
                    notified: false,
                    stepMsgId: null,
                    revealed: [],
                    narratedCount: 0,
                    failedHandled: false
                };
                await storeSet(buildKey(), state.build);
                chatBusy(false);
                // Exactly one "Build started" message per real dispatch — this is the only
