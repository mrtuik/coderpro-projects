<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>GitPush</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --surface-2: #F5F5F6;
            --surface-3: #EFEFF1;
            --text: #18181B;
            --text-2: #71717A;
            --text-3: #A1A1AA;
            --border: #E4E4E7;
            --border-strong: #D4D4D8;
            --accent: #4338CA;
            --accent-soft: #EEF0FF;
            --success: #15803D;
            --success-bg: #F0FDF4;
            --success-border: #BBF7D0;
            --error: #DC2626;
            --error-bg: #FEF2F2;
            --error-border: #FECACA;
            --warning: #B45309;
            --warning-bg: #FFFBEB;
            --warning-border: #FDE68A;
            --radius-sm: 6px;
            --radius-md: 9px;
            --radius-lg: 14px;
            --radius-pill: 999px;
            --shadow-sm: 0 1px 2px rgba(24, 24, 27, 0.05);
            --shadow-md: 0 6px 20px rgba(24, 24, 27, 0.10);
            --shadow-lg: 0 12px 32px rgba(24, 24, 27, 0.14);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            --header-h: 56px;
            --nav-h: 58px;
            --safe-b: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
            font-size: 14.5px;
            line-height: 1.45;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            background: none;
            border: none;
            margin: 0;
            padding: 0;
            text-align: inherit;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        ::selection {
            background: var(--accent-soft);
        }

        a {
            color: inherit;
        }

        .hidden {
            display: none !important;
        }

        .icon {
            width: 18px;
            height: 18px;
            flex: none;
            display: block;
        }

        .icon-sm {
            width: 15px;
            height: 15px;
        }

        .spin {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.97) translateY(6px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes sheetUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        @keyframes overlayIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* ---------- App shell ---------- */
        #app {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        header.topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            height: var(--header-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 0 rgba(24, 24, 27, 0.04), 0 8px 20px -12px rgba(24, 24, 27, 0.10);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: -0.02em;
        }

        .brand-mark {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            color: #fff;
            background: linear-gradient(150deg, #3f3f46, #0a0a0b 65%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 1px rgba(255, 255, 255, 0.08) inset, 0 3px 8px -2px rgba(24, 24, 27, 0.45);
        }

        .brand-mark .icon {
            width: 15.5px;
            height: 15.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            position: relative;
        }

        .icon-btn:active {
            background: var(--surface-2);
        }

        .status-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-3);
            border: 1.5px solid #fff;
        }

        .status-dot.on {
            background: var(--success);
        }

        main.content {
            flex: 1;
            padding: 14px 14px calc(var(--nav-h) + 28px + var(--safe-b)) 14px;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.18s ease both;
        }

        main.content.no-nav-pad {
            padding-bottom: 22px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 22px 2px 10px;
        }

        .section-title:first-child {
            margin-top: 2px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 4px 2px 4px;
        }

        .page-sub {
            font-size: 13px;
            color: var(--text-2);
            margin: 0 2px 18px;
        }

        /* ---------- Floating nav ---------- */
        nav.floatnav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(14px + var(--safe-b));
            z-index: 50;
            display: flex;
            justify-content: center;
            gap: 8px;
            pointer-events: none;
        }

        .floatnav-inner {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 2px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            padding: 5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 6px;
            border: none;
            background: transparent;
            padding: 9px 13px;
            border-radius: 10px;
            color: var(--text-2);
            font-weight: 600;
            font-size: 13px;
            transition: background .22s cubic-bezier(.2, .8, .2, 1), color .22s, padding .22s cubic-bezier(.2, .8, .2, 1);
        }

        .nav-item .icon {
            width: 16px;
            height: 16px;
            transition: transform .22s cubic-bezier(.2, .8, .2, 1);
        }

        .nav-item .nav-label {
            display: inline-block;
            max-width: 0;
            opacity: 0;
            transform: scale(.86);
            overflow: hidden;
            white-space: nowrap;
            margin-left: 0;
            transition: max-width .24s cubic-bezier(.2, .8, .2, 1), opacity .18s ease, transform .24s cubic-bezier(.2, .8, .2, 1), margin-left .24s;
        }

        .nav-item.active .nav-label {
            max-width: 90px;
            opacity: 1;
            transform: scale(1);
            margin-left: 6px;
        }

        .nav-item.active .icon {
            transform: scale(1.06);
        }

        .nav-item.active {
            background: var(--text);
            color: #fff;
        }

        .nav-item:not(.active):active {
            background: var(--surface-2);
        }

        .navplus-card {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navplus-card {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 3px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            padding: 5px;
        }

        .navplus-card .navplus-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text);
            border: none;
            background: transparent;
        }

        .navplus-card .navplus-pill:active {
            background: var(--surface-2);
        }

        .navplus-card .navplus-pill .icon {
            width: 16px;
            height: 16px;
            color: var(--accent);
        }

        .navplus-card .navplus-add {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--text);
            color: #fff;
            border: none;
            padding: 0;
        }

        .navplus-card .navplus-add:active {
            background: #000;
        }


        /* ---------- Cards / buttons / inputs ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .card-pad {
            padding: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong);
            background: #fff;
            color: var(--text);
            padding: 10px 16px;
            font-weight: 600;
            font-size: 13.5px;
            width: 100%;
        }

        .btn:active {
            background: var(--surface-2);
        }

        .btn.primary {
            background: var(--text);
            border-color: var(--text);
            color: #fff;
        }

        .btn.primary:active {
            background: #000;
        }

        .btn.primary:disabled {
            background: var(--text-3);
            border-color: var(--text-3);
            color: #fff;
            opacity: .7;
        }

        .btn.danger {
            background: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error);
        }

        .btn.ghost {
            border-color: transparent;
            background: transparent;
        }

        .btn.ghost:active {
            background: var(--surface-2);
        }

        .btn.sm {
            padding: 7px 12px;
            font-size: 12.5px;
            width: auto;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn-row .btn {
            flex: 1;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 6px;
        }

        .field input[type=text],
        .field input[type=password],
        .field textarea {
            width: 100%;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            background: #fff;
            outline: none;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: var(--text);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .hint {
            font-size: 11.5px;
            color: var(--text-3);
            margin-top: 5px;
        }

        .radio-row {
            display: flex;
            gap: 8px;
        }

        .radio-opt {
            flex: 1;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 13px;
        }

        .radio-opt.sel {
            border-color: var(--text);
            background: var(--surface-2);
        }

        .radio-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 1.5px solid var(--border-strong);
            flex: none;
            position: relative;
        }

        .radio-opt.sel .radio-dot {
            border-color: var(--text);
        }

        .radio-opt.sel .radio-dot::after {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: var(--text);
        }

        /* ---------- Home ---------- */
        .create-card {
            border: 1.5px dashed var(--border-strong);
            border-radius: var(--radius-lg);
            background: var(--surface-2);
            padding: 30px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            border-style: solid;
            position: relative;
            overflow: hidden;
        }

        .create-card::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: .5;
            pointer-events: none;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 16px 16px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .5), transparent 70%);
        }

        .create-plus {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            background: var(--text);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            z-index: 1;
        }

        .create-card .create-label {
            font-weight: 700;
            font-size: 14.5px;
            z-index: 1;
        }

        .create-card .create-sub {
            font-size: 12px;
            color: var(--text-2);
            z-index: 1;
        }

        .repo-row {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 12px 13px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: #fff;
            margin-bottom: 8px;
        }

        .repo-row:active {
            background: var(--surface-2);
        }

        .repo-icon {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            color: var(--text-2);
        }

        .repo-meta {
            flex: 1;
            min-width: 0;
        }

        .repo-name {
            font-weight: 700;
            font-size: 13.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .repo-sub {
            font-size: 11.5px;
            color: var(--text-2);
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 1px;
        }

        .badge {
            font-size: 10.5px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-strong);
            color: var(--text-2);
        }

        .badge.priv {
            background: var(--warning-bg);
            border-color: var(--warning-border);
            color: var(--warning);
        }

        .badge.pub {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success);
        }

        .chevron {
            color: var(--text-3);
            flex: none;
        }

        .vis-ind {
            display: inline-flex;
            align-items: center;
            color: var(--text-2);
        }

        .vis-ind .icon {
            width: 14px;
            height: 14px;
        }

        .empty {
            text-align: center;
            padding: 34px 16px;
            color: var(--text-2);
            border: 1px dashed var(--border-strong);
            border-radius: var(--radius-lg);
            font-size: 13px;
        }

        .empty .icon {
            width: 26px;
            height: 26px;
            margin: 0 auto 8px;
            color: var(--text-3);
        }

        /* ---------- Search ---------- */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 9px 12px;
            background: var(--surface-2);
            margin-bottom: 14px;
        }

        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 13.5px;
        }

        .search-bar .icon {
            color: var(--text-3);
        }

        /* ---------- Popover / Sheet / Modal ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(24, 24, 27, 0.32);
            z-index: 100;
            animation: overlayIn .15s ease both;
        }

        .popover {
            position: fixed;
            top: calc(var(--header-h) + 6px);
            right: 12px;
            z-index: 101;
            width: min(320px, calc(100vw - 24px));
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 14px;
            animation: popIn .15s ease both;
        }

        .popover h3 {
            margin: 0 0 12px;
            font-size: 13.5px;
            font-weight: 700;
        }

        .sheet-wrap {
            position: fixed;
            inset: 0;
            z-index: 101;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .sheet {
            width: 100%;
            max-width: 640px;
            background: #fff;
            border-radius: 18px 18px 0 0;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            animation: sheetUp .2s cubic-bezier(.2, .8, .2, 1) both;
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            border-radius: 2px;
            background: var(--border-strong);
            margin: 9px auto 2px;
        }

        .sheet-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px 6px;
        }

        .sheet-head h3 {
            font-size: 15px;
            font-weight: 700;
            margin: 0;
        }

        .sheet-body {
            padding: 6px 16px 20px;
            overflow-y: auto;
        }

        .sheet-body.pad-safe {
            padding-bottom: calc(20px + var(--safe-b));
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 6px;
            border-radius: var(--radius-sm);
            border-bottom: 1px solid var(--surface-2);
            font-weight: 600;
            font-size: 13.5px;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:active {
            background: var(--surface-2);
        }

        .menu-item .icon {
            color: var(--text-2);
            flex: none;
        }

        .menu-item.danger {
            color: var(--error);
        }

        .menu-item.danger .icon {
            color: var(--error);
        }

        .menu-item .mi-sub {
            font-size: 11px;
            color: var(--text-3);
            font-weight: 500;
            margin-top: 1px;
        }

        .menu-item .mi-txt {
            flex: 1;
            text-align: left;
        }

        .menu-item:disabled {
            opacity: .45;
        }

        /* ---------- Select mode / logs / status ---------- */
        .select-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 8px 10px;
            margin-bottom: 10px;
        }

        .select-bar .sb-count {
            flex: 1;
            font-size: 12.5px;
            font-weight: 700;
        }

        .chk {
            width: 19px;
            height: 19px;
            border-radius: 6px;
            border: 1.5px solid var(--border-strong);
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .chk.on {
            background: var(--text);
            border-color: var(--text);
            color: #fff;
        }

        .chk .icon {
            width: 13px;
            height: 13px;
        }

        .bulk-actionbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(14px + var(--safe-b));
            z-index: 50;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .bulk-actionbar-inner {
            pointer-events: auto;
            display: flex;
            gap: 8px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-md);
            padding: 6px;
            max-width: 640px;
            width: calc(100% - 28px);
        }

        .bulk-actionbar-inner .btn {
            width: auto;
            flex: 1;
            padding: 9px 10px;
            font-size: 12.5px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-strong);
            color: var(--text-2);
        }

        .status-pill.success {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success);
        }

        .status-pill.failure {
            background: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error);
        }

        .status-pill.pending {
            background: var(--warning-bg);
            border-color: var(--warning-border);
            color: var(--warning);
        }

        .status-pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .run-row {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            cursor: pointer;
        }

        .run-row:active {
            background: var(--surface-2);
        }

        .run-name {
            font-weight: 700;
            font-size: 13.5px;
        }

        .run-meta {
            font-size: 11.5px;
            color: var(--text-3);
            margin-top: 2px;
        }

        .step-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 4px;
            border-bottom: 1px solid var(--surface-2);
            font-size: 13px;
        }

        .step-row:last-child {
            border-bottom: none;
        }

        /* ---------- Step-by-step log viewer (no raw terminal block) ---------- */
        .log-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .log-steps {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 58vh;
            overflow-y: auto;
            padding-right: 2px;
        }

        .log-step {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            overflow: hidden;
        }

        .log-step-head {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 11px;
            font-weight: 700;
            font-size: 12.5px;
            text-align: left;
            background: var(--surface-2);
        }

        .log-step-head .ls-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .log-step-head .ls-count {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--text-2);
        }

        .log-step-head .icon {
            color: var(--text-2);
            flex: none;
        }

        .log-step-body {
            padding: 10px 11px;
            font-family: var(--font-mono);
            font-size: 11.5px;
            line-height: 1.55;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
            border-top: 1px solid var(--border);
            max-height: 34vh;
            overflow: auto;
        }

        .log-step-body .ll {
            display: block;
        }

        .log-step-body .ll.err {
            color: var(--error);
        }

        .log-step-body .ll.warn {
            color: var(--warning);
        }

        .log-step-actions {
            display: flex;
            justify-content: flex-end;
            padding: 6px 8px;
            border-top: 1px solid var(--surface-2);
        }

        .asset-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 4px;
            border-bottom: 1px solid var(--surface-2);
        }

        .asset-row:last-child {
            border-bottom: none;
        }

        .asset-name {
            flex: 1;
            min-width: 0;
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .asset-meta {
            font-size: 11px;
            color: var(--text-3);
        }

        .rel-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 14px;
            margin-bottom: 12px;
        }

        .rel-tag {
            font-family: var(--font-mono);
            font-size: 11px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 2px 7px;
        }

        .tabs-row {
            display: flex;
            gap: 6px;
            background: var(--surface-2);
            border-radius: var(--radius-pill);
            padding: 3px;
            margin-bottom: 14px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 10px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 12.5px;
            color: var(--text-2);
            text-align: center;
        }

        .tab-btn.active {
            background: #fff;
            color: var(--text);
            box-shadow: var(--shadow-sm);
        }

        .modal-wrap {
            position: fixed;
            inset: 0;
            z-index: 102;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            padding: 18px;
            animation: popIn .16s ease both;
        }

        .modal h3 {
            margin: 0 0 8px;
            font-size: 15.5px;
            font-weight: 700;
        }

        .modal p {
            margin: 0 0 16px;
            font-size: 13.5px;
            color: var(--text-2);
            line-height: 1.5;
        }

        .modal p code,
        .inline-code {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text);
        }

        .toast-stack {
            position: fixed;
            top: calc(var(--header-h) + 8px);
            left: 0;
            right: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            max-width: 88vw;
            background: var(--text);
            color: #fff;
            padding: 10px 16px;
            border-radius: var(--radius-pill);
            font-size: 12.5px;
            font-weight: 600;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: popIn .15s ease both;
        }

        .toast.error {
            background: var(--error);
        }

        .toast.success {
            background: var(--success);
        }

        /* ---------- Keys popover ---------- */
        .conn-status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12.5px;
            font-weight: 700;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            margin-top: 12px;
        }

        .conn-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-3);
        }

        .conn-status.on {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success);
        }

        .conn-status.on .dot {
            background: var(--success);
        }

        .conn-status.off {
            background: var(--surface-2);
            color: var(--text-2);
        }

        /* ---------- Repo manager ---------- */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text-2);
            margin-bottom: 12px;
            font-family: var(--font-mono);
        }

        .breadcrumb button {
            background: none;
            border: none;
            color: var(--text-2);
            font: inherit;
            padding: 2px 3px;
            border-radius: 4px;
        }

        .breadcrumb button.cur {
            color: var(--text);
            font-weight: 700;
        }

        .breadcrumb button:active {
            background: var(--surface-2);
        }

        .breadcrumb .sep {
            color: var(--text-3);
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 8px;
            border-bottom: 1px solid var(--surface-2);
            position: relative;
        }

        .file-row:last-child {
            border-bottom: none;
        }

        .file-row:active {
            background: var(--surface-2);
        }

        .file-row .fr-icon {
            color: var(--text-2);
            flex: none;
            width: 18px;
            display: flex;
            justify-content: center;
        }

        .file-row .fr-name {
            flex: 1;
            min-width: 0;
            font-size: 13.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-row .fr-meta {
            font-size: 11px;
            color: var(--text-3);
        }

        .file-row .fr-kebab {
            flex: none;
            padding: 6px;
            color: var(--text-3);
            border: none;
            background: none;
            border-radius: 6px;
        }

        .file-row .fr-kebab:active {
            background: var(--border);
        }

        .tree-guide {
            font-family: var(--font-mono);
            color: var(--border-strong);
            flex: none;
            font-size: 13px;
            letter-spacing: -1px;
            user-select: none;
        }

        .fab-stack {
            position: fixed;
            right: calc(50% - 300px);
            bottom: calc(var(--nav-h) + 28px + var(--safe-b));
            z-index: 45;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 6px;
        }

        @media (max-width:660px) {
            .fab-stack {
                right: 16px;
            }
        }

        .fab-sq {
            width: 46px;
            height: 46px;
            border-radius: var(--radius-md);
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .15s ease, background .15s ease;
        }

        .fab-sq.primary {
            background: var(--text);
            color: #fff;
            border-color: var(--text);
        }

        .fab-sq:active {
            transform: scale(.94);
        }

        .fab-add {
            position: fixed;
            right: calc(50% - 300px);
            bottom: calc(var(--nav-h) + 28px + var(--safe-b));
            z-index: 45;
            width: 50px;
            height: 50px;
            border-radius: var(--radius-md);
            background: var(--text);
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
        }

        @media (max-width:660px) {
            .fab-add {
                right: 16px;
            }
        }

        .fab-add:active {
            background: #000;
        }

        .fab-delete {
            position: fixed;
            right: calc(50% - 300px);
            bottom: calc(var(--nav-h) + 28px + var(--safe-b));
            z-index: 45;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--text);
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
        }

        @media (max-width:660px) {
            .fab-delete {
                right: 16px;
            }
        }

        .fab-delete:active {
            background: #000;
        }

        .fab-cluster {
            position: fixed;
            right: calc(50% - 300px);
            bottom: calc(var(--nav-h) + 28px + var(--safe-b));
            z-index: 45;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width:660px) {
            .fab-cluster {
                right: 16px;
            }
        }

        .fab-mini {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--text);
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
        }

        .fab-mini:active {
            background: #000;
        }

        .fab-mini:disabled {
            opacity: .4;
        }

        .pending-bar {
            position: fixed;
            left: 14px;
            right: 14px;
            bottom: calc(var(--nav-h) + 78px + var(--safe-b));
            z-index: 44;
            max-width: 612px;
            margin: 0 auto;
            background: var(--text);
            color: #fff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 11px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            animation: popIn .15s ease both;
        }

        .pending-bar .pb-txt {
            font-size: 12.5px;
            font-weight: 700;
        }

        .pending-bar button {
            background: #fff;
            color: var(--text);
            border: none;
            border-radius: var(--radius-pill);
            padding: 7px 13px;
            font-weight: 700;
            font-size: 12px;
        }

        .diff-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 4px;
            border-bottom: 1px solid var(--surface-2);
            font-family: var(--font-mono);
            font-size: 12.5px;
        }

        .diff-row:last-child {
            border-bottom: none;
        }

        .diff-tag {
            width: 16px;
            text-align: center;
            font-weight: 800;
            flex: none;
            border-radius: 3px;
        }

        .diff-tag.add {
            color: var(--success);
        }

        .diff-tag.mod {
            color: var(--warning);
        }

        .diff-tag.del {
            color: var(--error);
        }

        .diff-path {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .diff-x {
            flex: none;
            border: none;
            background: none;
            color: var(--text-3);
            padding: 4px;
        }

        /* ---------- Editor ---------- */
        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 4px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0;
            overflow-x: auto;
        }

        .editor-toolbar .fname {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 12.5px;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .editor-wrap {
            display: flex;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #fff;
            margin-top: 10px;
        }

        .editor-gutter {
            background: var(--surface-2);
            color: var(--text-3);
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 20px;
            padding: 12px 8px;
            text-align: right;
            user-select: none;
            border-right: 1px solid var(--border);
            white-space: pre;
            overflow: hidden;
        }

        .editor-textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 20px;
            padding: 12px 10px;
            white-space: pre;
            overflow: auto;
            min-height: 46vh;
            tab-size: 2;
        }

        /* ---------- Editor: one fixed header, only the code scrolls ---------- */
        main.content.editor-mode {
            padding: 0 14px 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: none;
            height: calc(100dvh - var(--header-h));
            max-height: calc(100dvh - var(--header-h));
        }

        .editor-page {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .editor-page .editor-toolbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #fff;
            flex: none;
        }

        .editor-page .find-bar.show {
            position: sticky;
            top: 44px;
            z-index: 19;
            background: #fff;
            flex: none;
        }

        .editor-page .editor-wrap {
            flex: 1;
            min-height: 0;
            margin-bottom: 12px;
        }

        .editor-page .editor-textarea {
            min-height: 0;
            height: 100%;
        }

        .editor-page .editor-gutter {
            overflow: hidden;
        }

        /* ---------- App Builder wizard ---------- */
        .wz-section {
            margin-top: 18px;
        }

        .wz-cards {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px 8px;
            scroll-snap-type: x mandatory;
        }

        .wz-card {
            scroll-snap-align: start;
            flex: none;
            width: 118px;
            height: 118px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            text-align: center;
            font-size: 11.5px;
            font-weight: 700;
            line-height: 1.25;
            color: var(--text-2);
            transition: border-color .15s, background .15s, transform .15s;
        }

        .wz-card .icon {
            width: 22px;
            height: 22px;
        }

        .wz-card:active {
            transform: scale(.97);
        }

        .wz-card.sel {
            border-color: var(--text);
            background: var(--surface-2);
            color: var(--text);
        }

        .wz-card.add {
            border-style: dashed;
        }

        .perm-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .perm-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 10px;
            font-size: 12.5px;
            font-weight: 600;
            background: var(--surface);
        }

        .perm-chip.on {
            border-color: var(--text);
            background: var(--surface-2);
        }

        .perm-chip .chkbox {
            width: 15px;
            height: 15px;
            border-radius: 4px;
            border: 1.5px solid var(--border-strong);
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .perm-chip.on .chkbox {
            background: var(--text);
            border-color: var(--text);
            color: #fff;
        }

        .kv-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 7px;
        }

        .kv-row input {
            flex: 1;
            min-width: 0;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 8px 9px;
            font-size: 12.5px;
            font-family: var(--font-mono);
        }

        .kv-row .kv-del {
            flex: none;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-3);
            border: 1px solid var(--border);
        }

        .logo-pick {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo-prev {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text-3);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .logo-prev img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-identity-card-black {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        }

        .app-identity-card-black .logo-prev {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 1px solid #3f3f46;
            background: #18181b;
            color: #a1a1aa;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .app-identity-card-black .logo-prev img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-identity-card-black .app-upload-btn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            border: 1px solid #3f3f46;
            background: #18181b;
            color: #f4f4f5;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            transition: background .15s, border-color .15s;
        }

        .app-identity-card-black .app-upload-btn:active {
            background: #27272a;
            border-color: #52525b;
        }

        .app-identity-card-black .app-name-input {
            flex: 1;
            min-width: 0;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 8px 11px;
            font-size: 13.5px;
            font-weight: 600;
            background: #ffffff;
            color: #18181b !important;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .app-identity-card-black .app-name-input::placeholder {
            color: #71717a;
        }

        .app-identity-card-black .app-name-input:focus {
            border-color: #18181b;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
        }

        .switch {
            width: 44px;
            height: 26px;
            border-radius: var(--radius-pill);
            background: var(--border-strong);
            position: relative;
            transition: background .18s;
            flex: none;
        }

        .switch.on {
            background: var(--text);
        }

        .switch::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: transform .18s cubic-bezier(.2, .8, .2, 1);
        }

        .switch.on::after {
            transform: translateX(18px);
        }

        .row-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .find-bar {
            display: none;
            gap: 6px;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .find-bar.show {
            display: flex;
        }

        .find-bar input {
            flex: 1;
            min-width: 110px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 7px 9px;
            font-size: 12.5px;
        }

        .find-bar .fcount {
            font-size: 11px;
            color: var(--text-2);
        }

        /* ---------- ZIP tree ---------- */
        .zip-node {
            font-family: var(--font-mono);
            font-size: 12.5px;
        }

        .zip-row {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 4px;
            border-radius: 6px;
        }

        .zip-row:active {
            background: var(--surface-2);
        }

        .zip-check {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1.5px solid var(--border-strong);
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .zip-check.on {
            background: var(--text);
            border-color: var(--text);
            color: #fff;
        }

        .zip-check.mixed {
            background: var(--surface-3);
            border-color: var(--border-strong);
        }

        .zip-check.mixed::after {
            content: "";
            width: 7px;
            height: 1.5px;
            background: var(--text-2);
        }

        .zip-label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .zip-excluded {
            color: var(--text-3);
        }

        .zip-toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        /* ---------- Loading / connecting states ---------- */
        .loadline {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 14px 4px;
            color: var(--text-2);
            font-size: 13px;
        }

        .dots-loader {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--border);
            border-top-color: var(--text);
            flex: none;
        }

        .workflow-row {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
        }

        .wf-icon {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-2);
            flex: none;
        }

        .wf-name {
            font-weight: 700;
            font-size: 13px;
            font-family: var(--font-mono);
        }

        .wf-status {
            font-size: 11px;
            color: var(--text-2);
        }

        .profile-hero {
            text-align: center;
            padding: 22px 10px 6px;
        }

        .profile-hero .pmark {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--text);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }

        .profile-hero h2 {
            margin: 0 0 3px;
            font-size: 19px;
            letter-spacing: -0.01em;
        }

        .profile-hero p {
            margin: 0;
            color: var(--text-2);
            font-size: 12.5px;
        }

        .link-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 4px;
            border-bottom: 1px solid var(--surface-2);
            font-size: 13.5px;
            font-weight: 600;
        }

        .link-row:last-child {
            border-bottom: none;
        }

        .link-row .lr-right {
            color: var(--text-3);
        }

        /* ---------- AI Workflow Assistant (chat) ---------- */
        .chat-screen {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        .chat-head {
            flex: none;
            height: var(--header-h);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: relative;
            z-index: 5;
        }

        .chat-title {
            flex: 1;
            min-width: 0;
        }

        .chat-title .ct-name {
            font-weight: 700;
            font-size: 14.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -.01em;
        }

        .chat-title .ct-sub {
            font-size: 11px;
            color: var(--text-3);
            font-weight: 600;
        }

        .chat-menu-wrap {
            position: relative;
        }

        .chat-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            width: 212px;
            z-index: 80;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .28);
            padding: 6px;
            animation: menuIn .16s cubic-bezier(.2, .8, .3, 1);
            transform-origin: top right;
        }

        @keyframes menuIn {
            from {
                opacity: 0;
                transform: scale(.94) translateY(-4px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .chat-menu button {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            text-align: left;
        }

        .chat-menu button:active {
            background: var(--surface-2);
        }

        .chat-menu button.danger {
            color: var(--error);
        }

        .chat-menu .cm-sep {
            height: 1px;
            background: var(--border);
            margin: 5px 4px;
        }

        .chat-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 14px 12px 10px;
            -webkit-overflow-scrolling: touch;
        }

        .msg {
            margin-bottom: 16px;
            animation: msgIn .22s cubic-bezier(.2, .8, .3, 1);
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .ai-tag {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 7px;
        }

        .ai-tag .ai-dot {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ai-tag .ai-dot i {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            background: var(--surface);
            display: block;
        }

        .ai-tag span {
            font-size: 12px;
            font-weight: 750;
            letter-spacing: -.01em;
        }

        .msg .bub {
            display: block;
            max-width: 100%;
            padding: 0;
            background: none;
            font-size: 14px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
        }

        .msg.user {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .msg.user .bub {
            display: inline-block;
            max-width: 88%;
            background: var(--text);
            color: #fff;
            padding: 9px 13px;
            border-radius: var(--radius-lg);
            border-bottom-right-radius: var(--radius-sm);
            text-align: left;
        }

        .msg.sys .bub {
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 12.5px;
            font-weight: 600;
            padding: 8px 11px;
            border-radius: var(--radius-md);
        }

        .msg-meta {
            font-size: 10.5px;
            color: var(--text-3);
            margin-top: 6px;
            display: flex;
            gap: 10px;
            align-items: center;
            opacity: .55;
        }

        .msg:focus-within .msg-meta,
        .msg:active .msg-meta {
            opacity: 1;
        }

        .msg.user .msg-meta {
            justify-content: flex-end;
        }

        .msg-meta button {
            color: var(--text-3);
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 10.5px;
        }

        .msg-meta button:active {
            color: var(--text);
        }

        .chat-widget {
            margin-top: 10px;
            max-width: 100%;
        }

        .chat-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .chip {
            border: 1px solid var(--border-strong);
            background: var(--surface);
            border-radius: var(--radius-pill);
            padding: 7px 13px;
            font-size: 12.5px;
            font-weight: 650;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chip:active {
            background: var(--surface-2);
        }

        .chip.on {
            background: var(--text);
            color: #fff;
            border-color: var(--text);
        }

        .chat-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background: var(--surface);
            padding: 13px;
            box-shadow: 0 6px 22px -14px rgba(0, 0, 0, .22);
            animation: cardIn .24s cubic-bezier(.2, .8, .3, 1);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: scale(.97) translateY(6px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .chat-card h4 {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: 750;
            letter-spacing: -.01em;
        }

        .card-cap {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 9px;
        }

        .plan-step {
            display: flex;
            gap: 8px;
            font-size: 12.5px;
            color: var(--text-2);
            margin-bottom: 5px;
        }

        .plan-step b {
            color: var(--text);
            font-weight: 700;
        }

        .plan-file,
        .log-block {
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.6;
            background: #111214;
            color: #e6e6e6;
            border-radius: var(--radius-md);
            padding: 9px 10px;
            margin-top: 8px;
            overflow-x: auto;
            white-space: pre;
            max-height: 190px;
            overflow-y: auto;
        }

        .plan-file .ln-add {
            color: #8ee79b;
        }

        .plan-file .ln-del {
            color: #ff9b9b;
        }

        /* actions accordion */
        .act-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 2px;
            font-size: 12.5px;
            font-weight: 650;
            color: var(--text-2);
            width: 100%;
        }

        .act-row:active {
            color: var(--text);
        }

        .act-row .ar-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .act-row .ar-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--text-3);
            flex: none;
        }

        .act-row .ar-chev {
            transition: transform .22s ease;
            color: var(--text-3);
        }

        .act-row.open .ar-chev {
            transform: rotate(180deg);
        }

        .act-body {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height .28s ease, opacity .22s ease;
            margin-left: 8px;
            padding-left: 14px;
            border-left: 1px solid var(--border);
        }

        .act-body.open {
            max-height: 420px;
            opacity: 1;
        }

        .act-line {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 12.5px;
            color: var(--text-2);
            padding: 5px 0;
            opacity: 0;
            transform: translateY(5px);
        }

        .act-body.open .act-line {
            animation: stepIn .3s ease forwards;
        }

        .act-body.open .act-line:nth-child(1) {
            animation-delay: .03s;
        }

        .act-body.open .act-line:nth-child(2) {
            animation-delay: .09s;
        }

        .act-body.open .act-line:nth-child(3) {
            animation-delay: .15s;
        }

        .act-body.open .act-line:nth-child(4) {
            animation-delay: .21s;
        }

        .act-body.open .act-line:nth-child(5) {
            animation-delay: .27s;
        }

        @keyframes stepIn {
            to {
                opacity: 1;
                transform: none;
            }
        }

        .act-line .al-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border-strong);
            flex: none;
        }

        /* status cards */
        .st-card {
            border-radius: var(--radius-lg);
            padding: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            animation: cardIn .24s cubic-bezier(.2, .8, .3, 1);
        }

        .st-card.pending {
            background: var(--accent-soft);
            border-color: var(--accent-border, var(--border));
        }

        .st-card.warn {
            background: var(--warning-bg);
            border-color: var(--warning-border);
        }

        .st-head {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .st-ic {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
        }

        .st-card.pending .st-ic {
            color: var(--accent);
        }

        .st-card.warn .st-ic {
            color: var(--warning);
        }

        .st-ic.spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .st-title {
            font-size: 13px;
            font-weight: 750;
            margin-bottom: 2px;
        }

        .st-text {
            font-size: 12.5px;
            line-height: 1.5;
            color: var(--text-2);
        }

        .st-actions {
            display: flex;
            gap: 8px;
            margin-top: 11px;
        }

        .st-actions .btn.sm,
        .st-actions button {
            font-size: 12px;
        }

        /* file / link result rows */
        .dl-row {
            display: flex;
            align-items: center;
            gap: 11px;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 11px;
            background: var(--surface);
            text-decoration: none;
            color: inherit;
            margin-top: 8px;
            box-shadow: 0 6px 22px -16px rgba(0, 0, 0, .25);
        }

        .dl-row .dl-ic {
            width: 38px;
            height: 38px;
            flex: none;
            border-radius: var(--radius-md);
            background: var(--surface-2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-2);
        }

        .dl-row .dl-body {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .dl-row .dl-name {
            font-family: var(--font-mono);
            font-size: 11.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dl-row .dl-sub {
            font-size: 10.5px;
            color: var(--text-3);
            font-weight: 650;
            margin-top: 2px;
        }

        .dl-row .dl-go {
            flex: none;
            color: var(--text-2);
        }

        /* quick action picker */
        .pick-card {
            border: 1.6px solid var(--text);
            border-radius: var(--radius-lg);
            background: var(--surface);
            padding: 13px;
            animation: cardIn .24s cubic-bezier(.2, .8, .3, 1);
        }

        .pick-card h4 {
            margin: 0 0 10px;
            font-size: 13.5px;
            font-weight: 750;
        }

        .pick-opt {
            display: flex;
            align-items: center;
            gap: 11px;
            width: 100%;
            text-align: left;
            padding: 11px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .pick-opt:active,
        .pick-opt.on {
            border-color: var(--text);
            background: var(--surface-2);
        }

        .pick-opt .pn {
            width: 22px;
            height: 22px;
            flex: none;
            border-radius: 50%;
            border: 1px solid var(--border-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-3);
        }

        .pick-opt.on .pn {
            background: var(--text);
            border-color: var(--text);
            color: #fff;
        }

        .pick-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }

        .pick-hint {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            color: var(--text-3);
            text-transform: uppercase;
        }

        /* checklist */
        .chat-checklist {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .cl-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 2px;
            font-size: 13px;
            font-weight: 600;
        }

        .cl-box {
            width: 20px;
            height: 20px;
            flex: none;
            border-radius: 6px;
            border: 1.7px solid var(--border-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: background .15s ease, border-color .15s ease;
        }

        .cl-box.on {
            background: var(--text);
            border-color: var(--text);
        }

        .cl-box.on .icon {
            animation: pop .24s cubic-bezier(.2, 1.4, .4, 1);
        }

        @keyframes pop {
            from {
                transform: scale(.4);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .chat-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            border-radius: var(--radius-pill);
            padding: 3px 9px;
            border: 1px solid var(--border);
        }

        .chat-status.running {
            background: var(--warning-bg);
            color: var(--warning);
            border-color: var(--warning-border);
        }

        .chat-status.success {
            background: var(--success-bg);
            color: var(--success);
            border-color: var(--success-border);
        }

        .chat-status.failure {
            background: var(--error-bg);
            color: var(--error);
            border-color: var(--error-border);
        }

        .chat-foot {
            flex: none;
            border-top: 1px solid var(--border);
            background: var(--surface);
            padding: 9px 12px calc(9px + var(--safe-b));
        }

        .chat-runrow {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 9px;
        }

        .chat-run-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border-radius: var(--radius-pill);
            background: var(--text);
            color: #fff;
            padding: 7px 15px;
            font-size: 12.5px;
            font-weight: 700;
        }

        .chat-run-btn[disabled] {
            opacity: .4;
        }

        .chat-run-btn:not([disabled]):active {
            transform: scale(.97);
        }

        .comp-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            border-radius: 26px;
            padding: 5px 6px 5px 8px;
            transition: border-color .15s ease;
        }

        .comp-row:focus-within {
            border-color: var(--text);
        }

        .comp-input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            padding: 9px 4px;
            font-size: 14.5px;
            resize: none;
            max-height: 120px;
            outline: none;
            color: var(--text);
        }

        .comp-send {
            width: 38px;
            height: 38px;
            flex: none;
            border-radius: var(--radius-pill);
            background: var(--text);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .12s ease;
        }

        .comp-send:active {
            transform: scale(.9);
        }

        .comp-send[disabled] {
            opacity: .3;
        }

        .ai-panel {
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
            padding: 12px;
            animation: menuIn .16s ease;
        }

        .ai-panel .field {
            margin-bottom: 10px;
        }

        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 9px 12px;
            background: var(--surface-2);
            border-radius: var(--radius-lg);
        }

        .typing i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-3);
            display: block;
            animation: tdot 1s infinite;
        }

        .typing i:nth-child(2) {
            animation-delay: .15s;
        }

        .typing i:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes tdot {

            0%,
            60%,
            100% {
                opacity: .3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        /* tip toast */
        .tip-toast {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: calc(var(--safe-b) + 108px);
            z-index: 70;
            background: #111214;
            color: #fff;
            border-radius: var(--radius-lg);
            padding: 11px 12px;
            display: flex;
            align-items: center;
            gap: 11px;
            overflow: hidden;
            box-shadow: 0 20px 44px -18px rgba(0, 0, 0, .6);
            animation: tipIn .28s cubic-bezier(.2, .8, .3, 1);
        }

        @keyframes tipIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .tip-toast.out {
            animation: tipOut .22s ease forwards;
        }

        @keyframes tipOut {
            to {
                opacity: 0;
                transform: translateY(10px);
            }
        }

        .tip-toast .tt-ic {
            width: 30px;
            height: 30px;
            flex: none;

            align-items: center;
            justify-content: center;
            color: #9ec5ff;

            flex: 1;
            min-width: 0;
        }

        .tip-toast .tt-title {
            font-size: 12.5px;
            font-weight: 700;
        }

        .tip-toast .tt-sub {
            font-size: 10.5px;
            color: rgba(255, 255, 255, .55);
            margin-top: 2px;
        }

        .tip-toast .tt-btn {
            font-size: 11px;
            font-weight: 750;
            padding: 6px 10px;
            border-radius: 9px;
            background: rgba(255, 255, 255, .14);
            color: #fff;
        }

        .tip-toast .tt-x {
            color: rgba(255, 255, 255, .6);
            padding: 4px;
        }

        .tip-bar {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 2px;
            background: #5b9dff;
            width: 100%;
            animation: tipShrink 12s linear forwards;
        }

        @keyframes tipShrink {
            from {
                width: 100%;
            }

            to {
                width: 0;
            }
        }

            background: #fff;
        }

        .gpc-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gpc-brand-ic {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #171717;
        }

        .gpc-brand-name {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -.02em;
            color: #171717;
        }

        .gpc-head-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gpc-pill-btn {
            background: #171717;

            font-size: 12px;
            font-weight: 600;
            padding: 6px 16px;

            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
            letter-spacing: .02em;
        }

        .gpc-pill-btn:active {
            transform: scale(.98);
        }

        .gpc-pill-btn[disabled] {
            opacity: .45;
        }

        .gpc-ic-btn {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            background: #F5F5F5;
            border: 1px solid #E5E5E5;
            color: #404040;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gpc-ic-btn:active {
            background: #E5E5E5;
        }

        .gpc-ic-btn.gpc-dot {
            position: relative;
        }

        .gpc-ic-btn.gpc-dot::after {
            content: '';
            position: absolute;
            top: 3px;
            right: 3px;
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #DC2626;
