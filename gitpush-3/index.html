                // place a successful dispatch says so (Fix 1.1).
                aiSay('Build started. It keeps running even if you leave this screen — come back any time for the status.');
                gpBuildStarting = false;
                gpPollBuild();
            } catch (e) {
                gpBuildStarting = false;
                chatBusy(false);
                pushMsg({
                    role: 'assistant',
                    kind: 'error',
                    content: gpPlainGhError(e, 'start the build')
                });
            }
        }

        /* -----------------------------------------------------------------------------
           SECTION 8 — DIAGNOSE → CONFIRM → APPLY
           Proposals are only committed when the user taps Apply.
        ----------------------------------------------------------------------------- */
        async function gpApplyFiles(msgId) {
            const m = state.chat.msgs.find(x => x.id === msgId);
            if (!m || !m.files || !m.files.length || m.applied) return;
            chatBusy(true);
            const applied = [];
            try {
                for (const f of m.files) {
                    let before = null;
                    try {
                        before = await ghReadFile(f.path);
                    } catch (e) {}
                    await gpCommitFile(f.path, f.content, 'GitPush AI: ' + (before == null ? 'create ' : 'update ') + f.path);
                    applied.push({
                        path: f.path,
                        before,
                        after: f.content
                    });
                }
                state.patchHist.undo.push({
                    ts: Date.now(),
                    files: applied
                });
                state.patchHist.redo = [];
                await savePatchHist();
                m.applied = true;
                chatBusy(false);
                // System-generated confirmation, fed back into the conversation history too.
                const summary = 'Applied ' + applied.length + ' file' + (applied.length === 1 ? '' : 's') + ' to ' +
                    ((state.setup && state.setup.branch) || 'main') + ': ' + applied.map(a => a.path).join(', ') + '.';
                aiSay(summary + ' Want me to start a build now?');
                state.chat.turns.push({
                    role: 'user',
                    content: '[system] The user approved and I committed: ' + applied.map(a => a.path).join(', ')
                });
                pushMsg({
                    role: 'assistant',
                    kind: 'options',
                    options: ['Yes, start the build', 'Not yet'],
                    answered: null
                });
            } catch (e) {
                chatBusy(false);
                pushMsg({
                    role: 'assistant',
                    kind: 'error',
                    content: gpPlainGhError(e, 'commit the change')
                });
            }
        }
        /* Dismissing discards the proposal entirely — no partial or ghost commits. */
        function gpDismissFiles(msgId) {
            state.chat.msgs = state.chat.msgs.filter(m => m.id !== msgId);
            state.chat.proposed = [];
            saveChat();
            render();
        }
        async function savePatchHist() {
            try {
                await storeSet('gp-patch-' + state.currentRepo.owner + '/' + state.currentRepo.name, state.patchHist);
            } catch (e) {}
        }
        async function gpCommitFile(path, content, message, isBase64) {
            const branch = (state.setup && state.setup.branch) || state.currentRepo.default_branch || 'main';
            const base = gpRepoBase() + '/contents/' + encodeURI(path);
            let sha = null;
            try {
                const ex = await ghApi(base + '?ref=' + encodeURIComponent(branch));
                sha = ex.sha;
            } catch (e) {}
            const body = {
                message,
                content: isBase64 ? content : b64EncodeUnicode(content),
                branch
            };
            if (sha) body.sha = sha;
            await ghApi(base, {
                method: 'PUT',
                body
            });
        }
        async function undoPatch() {
            const entry = state.patchHist.undo.pop();
            if (!entry) {
                toast('Nothing to undo', 'error');
                return;
            }
            chatBusy(true);
            try {
                for (const f of entry.files) {
                    if (f.before == null) await gpDeleteFile(f.path);
                    else await gpCommitFile(f.path, f.before, 'GitPush AI: undo ' + f.path);
                }
                state.patchHist.redo.push(entry);
                await savePatchHist();
                chatBusy(false);
                aiSay('Undone — the previous version is back on GitHub.');
            } catch (e) {
                chatBusy(false);
                state.patchHist.undo.push(entry);
                toast('Undo failed', 'error');
            }
        }
        async function redoPatch() {
            const entry = state.patchHist.redo.pop();
            if (!entry) {
                toast('Nothing to redo', 'error');
                return;
            }
            chatBusy(true);
            try {
                for (const f of entry.files) await gpCommitFile(f.path, f.after, 'GitPush AI: redo ' + f.path);
                state.patchHist.undo.push(entry);
                await savePatchHist();
                chatBusy(false);
                aiSay('Re-applied the change.');
            } catch (e) {
                chatBusy(false);
                state.patchHist.redo.push(entry);
                toast('Redo failed', 'error');
            }
        }
        async function gpDeleteFile(path) {
            const branch = (state.setup && state.setup.branch) || 'main';
            const base = gpRepoBase() + '/contents/' + encodeURI(path);
            try {
                const ex = await ghApi(base + '?ref=' + encodeURIComponent(branch));
                await ghApi(base, {
                    method: 'DELETE',
                    body: {
                        message: 'GitPush AI: remove ' + path,
                        sha: ex.sha,
                        branch
                    }
                });
            } catch (e) {}
        }

        /* -----------------------------------------------------------------------------
           SECTION 9 — OPTION PICKER, COMPOSER, EDIT / DELETE
        ----------------------------------------------------------------------------- */
        function gpSelectOption(msgId, idx) {
            const m = state.chat.msgs.find(x => x.id === msgId);
            if (!m || m.answered != null) return;
            m.selected = idx;
            saveChat();
            render();
        }

        function gpSubmitOption(msgId) {
            const m = state.chat.msgs.find(x => x.id === msgId);
            if (!m || m.answered != null) return;
            const own = document.getElementById('gpcOwn-' + msgId);
            const typed = own && own.value.trim();
            const label = typed || (m.selected != null ? m.options[m.selected] : '');
            if (!label) {
                toast('Pick an option or type your own', 'error');
                return;
            }
            m.answered = label;
            saveChat();
            meSay(label); // the choice becomes a normal user turn
            // "Start the build" is a real, explicit user action — dispatch it directly
            // rather than asking the model (which has no dispatch tool and could only
            // narrate about it, risking a second "Build started" message alongside the
            // real one). This is the only user-confirmed trigger point besides the
            // header Build button and the manual sheet (Fix 3.3 / Fix 1.1).
            if (label === 'Yes, start the build') {
                chatRunBuild();
                return;
            }
            gpRunAgent(label);
        }

        function gpOwnKey(ev, msgId) {
            if (ev.key === 'Enter') {
                ev.preventDefault();
                gpSubmitOption(msgId);
            }
        }

        function onChatInput(v) {
            state.chat.draft = v;
            const b = document.getElementById('gpcSend');
            if (b) b.disabled = !v.trim();
            const ta = document.getElementById('chatTa');
            if (ta) {
                ta.style.height = 'auto';
                ta.style.height = Math.min(ta.scrollHeight, 110) + 'px';
            }
        }

        function chatKeyDown(ev) {
            if (ev.key === 'Enter' && !ev.shiftKey) {
                ev.preventDefault();
                sendChat();
            }
        }

        function gpSetMode(mode) {
            state.chat.mode = mode;
            render();
        }

        async function sendChat() {
            const ta = document.getElementById('chatTa');
            const text = ((ta && ta.value) || state.chat.draft || '').trim();
            if (!text || state.chat.busy) return;
            state.chat.draft = '';
            meSay(text);
            const prefix = state.chat.mode === 'build' ?
                'Build mode: prefer concrete workflow fixes and propose files when useful.\n\n' :
                'Discuss mode: explain only, do not propose file changes unless asked.\n\n';
            gpRunAgent(prefix + text);
        }

        function copyMsg(id) {
            const m = state.chat.msgs.find(x => x.id === id);
            if (!m) return;
            try {
                navigator.clipboard.writeText(m.content || '');
                toast('Copied');
            } catch (e) {}
        }

        function editMessage(id) {
            const m = state.chat.msgs.find(x => x.id === id);
            if (!m) return;
            openModal('Edit message',
                '<div class="field" style="margin-bottom:4px"><label>Message</label><textarea id="edMsg" rows="4">' + esc(m.content || '') + '</textarea></div>',
                '<button class="btn ghost" onclick="closeAllOverlays()">Cancel</button>' +
                '<button class="btn primary" onclick="saveEditedMessage(\'' + m.id + '\')">Save &amp; resend</button>'
            );
        }
        /* Editing a user message rewinds the conversation to that point (UI messages
           AND raw tool-calling turns) and re-sends, so the model never sees stale context. */
        function saveEditedMessage(id) {
            const idx = state.chat.msgs.findIndex(x => x.id === id);
            if (idx < 0) return;
            const m = state.chat.msgs[idx];
            const v = document.getElementById('edMsg').value.trim();
            closeAllOverlays();
            m.content = v;
            m.edited = true;
            if (m.role !== 'user') {
                saveChat();
                render();
                return;
            }
            state.chat.msgs = state.chat.msgs.slice(0, idx + 1);
            const turnIdx = gpFindUserTurn(idx);
            if (turnIdx >= 0) state.chat.turns = state.chat.turns.slice(0, turnIdx);
            saveChat();
            render();
            gpRunAgent(v);
        }
        /* Map the Nth user UI message onto the matching raw user turn. */
        function gpFindUserTurn(msgIdx) {
            const n = state.chat.msgs.slice(0, msgIdx + 1).filter(x => x.role === 'user').length;
            let seen = 0;
            for (let i = 0; i < state.chat.turns.length; i++) {
                if (state.chat.turns[i].role === 'user') {
                    seen++;
                    if (seen === n) return i;
                }
            }
            return -1;
        }

        function deleteMessage(id) {
            const idx = state.chat.msgs.findIndex(x => x.id === id);
            if (idx < 0) return;
            const wasUser = state.chat.msgs[idx].role === 'user';
            const turnIdx = wasUser ? gpFindUserTurn(idx) : -1;
            state.chat.msgs.splice(idx, 1);
            if (turnIdx >= 0) state.chat.turns = state.chat.turns.slice(0, turnIdx);
            if (!state.chat.msgs.length) {
                state.chat.turns = [];
                storeDel(chatKey());
                toast('Conversation deleted');
                render();
                return;
            }
            saveChat();
            render();
        }

        /* ---- Provider settings panel (unchanged behaviour, restyled) ---- */
        function toggleAiPanel() {
            state.chat.panelOpen = !state.chat.panelOpen;
            render();
        }

        function setAiProvider(id) {
            aiCfg.provider = id;
            storeSet('gp-ai-config', aiCfg);
            render();
        }
        async function saveAiSettings() {
            aiCfg.keys[aiProvider().id] = document.getElementById('aiKey').value.trim();
            aiCfg.models[aiProvider().id] = document.getElementById('aiModel').value.trim();
            await storeSet('gp-ai-config', aiCfg);
            state.chat.panelOpen = false;
            toast('Provider settings saved');
            render();
        }

        function renderAiPanel() {
            const p = aiProvider();
            return (
                '<div class="gpc-panel">' +
                '<div class="field"><label>Provider</label><div class="gpc-chips">' +
                AI_PROVIDERS.map(x => '<button class="chip ' + (x.id === p.id ? 'on' : '') + '" onclick="setAiProvider(\'' + x.id + '\')">' + esc(x.label) + '</button>').join('') +
                '</div></div>' +
                '<div class="field"><label>' + esc(p.label) + ' API key</label>' +
                '<input type="password" id="aiKey" placeholder="Paste your key" value="' + esc((aiCfg.keys && aiCfg.keys[p.id]) || '') + '"></div>' +
                '<div class="field"><label>Model</label>' +
                '<input type="text" id="aiModel" placeholder="' + esc(p.model) + '" value="' + esc((aiCfg.models && aiCfg.models[p.id]) || '') + '"></div>' +
                '<div class="run-meta" style="margin-bottom:8px">Stored on this device only and sent straight to ' + esc(p.label) + '.</div>' +
                '<button class="btn primary" onclick="saveAiSettings()">Save</button>' +
                '</div>'
            );
        }

        /* -----------------------------------------------------------------------------
           SECTION 10 — RENDERING (faithful port of the A.html design)
        ----------------------------------------------------------------------------- */
        /* Lucide-style icon set used by the chat screen only. */
        function gpIc(name, size, cls) {
            const S = size || 16;
            const P = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
            const d = {
                'folder-git-2': '<path d="M9 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v3"/><circle cx="13" cy="12" r="2"/><path d="M18 19c-2.8 0-5-2.2-5-5v8"/><circle cx="20" cy="19" r="2"/>',
                bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
                user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
                play: '<polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/>',
                wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"/>',
                layers: '<path d="m12.83 2.18 8.34 4.17a1 1 0 0 1 0 1.3l-8.34 4.17a2 2 0 0 1-1.66 0L2.83 7.65a1 1 0 0 1 0-1.3l8.34-4.17a2 2 0 0 1 1.66 0Z"/><path d="m22 12.5-9.17 4.58a2 2 0 0 1-1.66 0L2 12.5"/><path d="m22 17.5-9.17 4.58a2 2 0 0 1-1.66 0L2 17.5"/>',
                sparkles: '<path d="m12 3-1.9 5.1L5 10l5.1 1.9L12 17l1.9-5.1L19 10l-5.1-1.9Z"/><path d="M5 18.5 5.7 20 7 20.7 5.7 21.4 5 22.9 4.3 21.4 3 20.7 4.3 20Z"/>',
                'git-branch': '<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
                'file-code-2': '<path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m5 12-3 3 3 3"/><path d="m9 18 3-3-3-3"/>',
                package: '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
                link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
                'shield-check': '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1Z"/><path d="m9 12 2 2 4-4"/>',
                'file-check-2': '<path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m3 15 2 2 4-4"/>',
                terminal: '<polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/>',
                cpu: '<rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"/>',
                archive: '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
                'check-circle-2': '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
                'alert-triangle': '<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
                'loader': '<path d="M12 2v4M12 18v4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9"/>',
                upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
                download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
                settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.5.6.9 1.11 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>',
                'arrow-left': '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
                copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
                more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
                pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
                trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
                plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
                'chevron-down': '<polyline points="6 9 12 15 18 9"/>',
                'arrow-up': '<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',
                check: '<polyline points="20 6 9 17 4 12"/>',
                file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h5"/>'
            };
            return '<svg width="' + S + '" height="' + S + '" class="' + (cls || '') + '" ' + P + '>' + (d[name] || d.file) + '</svg>';
        }

        /* Choose 2-3 distinct icons per step from its label — the A.html "multi-icon" row. */
        function gpStepIcons(label) {
            const l = String(label || '').toLowerCase();
            const pick = (a) => a.map((n, i) => gpIc(n, i === 2 ? 14 : 16)).join('');
            if (/check ?out|clone|branch|git/.test(l)) return pick(['git-branch', 'file-code-2']);
            if (/set ?up|initial|prepare|environment|job/.test(l)) return pick(['wrench', 'layers', 'sparkles']);
            if (/depend|install|npm|package|gradle|pod/.test(l)) return pick(['package', 'link']);
            if (/validate|verify|lint|schema|check/.test(l)) return pick(['shield-check', 'file-check-2']);
            if (/compile|build|run|assemble|test/.test(l)) return pick(['terminal', 'cpu']);
            if (/upload|artifact|package release|archive|deploy|publish/.test(l)) return pick(['archive', 'check-circle-2']);
            if (/log|diagnos|analy|read/.test(l)) return pick(['file-code-2', 'sparkles']);
            return pick(['layers', 'check-circle-2']);
        }

        function gpStepStatusIcon(status) {
            if (status === 'running') return gpIc('loader', 14, 'gpc-spin');
            if (status === 'failed') return gpIc('alert-triangle', 14);
            return '';
        }

        function mdLite(s) {
            return esc(s || '').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
        }

        function renderChat() {
            const st = buildStatusLabel();
            const busy = state.chat.busy;
            return (
                '<div class="gpc-screen">' +
                /* ---- Header (A.html: repo icon + name, Build pill, bell, profile) ---- */
                '<div class="gpc-head">' +
                '<div class="gpc-brand">' +
                '<button class="gpc-brand-ic" aria-label="Back" onclick="exitChat()">' + gpIc('arrow-left', 18) + '</button>' +
                '<div class="gpc-brand-ic">' + gpIc('folder-git-2', 20) + '</div>' +
                '<span class="gpc-brand-name">' + esc((state.setup && state.setup.appName) || state.currentRepo.name) + '</span>' +
                '</div>' +
                '<div class="gpc-head-right">' +
                '<button class="gpc-pill-btn" ' + (busy ? 'disabled' : '') + ' onclick="chatRunBuild()">' + gpIc('play', 11) + '<span>Build</span></button>' +
                '<button class="gpc-ic-btn ' + (st && st.cls !== 'success' ? 'gpc-dot' : '') + '" aria-label="Build status" title="' + (st ? esc(st.txt) : 'No build yet') + '" onclick="gpShowBuildStatus()">' + gpIc('bell', 15) + '</button>' +
                '<button class="gpc-ic-btn" aria-label="AI provider settings" onclick="toggleAiPanel()">' + gpIc('settings', 15) + '</button>' +
                '</div>' +
                '</div>' +
                (state.chat.panelOpen ? renderAiPanel() : '') +
                /* ---- Transcript ---- */
                '<div class="gpc-main" id="chatList">' +
                state.chat.msgs.map(m => renderMsg(m)).join('') +
                (busy ? '<div class="gpc-think">' + gpIc('loader', 15, 'gpc-spin') + '<span>Working on it…</span></div>' : '') +
                '</div>' +
                /* ---- Footer: mode toggle + composer ---- */
                '<div class="gpc-foot">' +
                '<div class="gpc-modes">' +
                '<span class="' + (state.chat.mode === 'build' ? 'on' : '') + '" onclick="gpSetMode(\'build\')">build</span>' +
                '<span class="' + (state.chat.mode === 'discuss' ? 'on' : '') + '" onclick="gpSetMode(\'discuss\')">Discuss</span>' +
                '</div>' +
                '<div class="gpc-comp">' +
                '<textarea id="chatTa" rows="2" placeholder="Fix the workflow and build the app" oninput="onChatInput(this.value)" onkeydown="chatKeyDown(event)">' + esc(state.chat.draft || '') + '</textarea>' +
                '<div class="gpc-comp-row">' +
                '<div class="gpc-comp-left">' +
                '<button title="Attach an app icon" onclick="triggerIconPick()">' + gpIc('plus', 16) + '</button>' +
                '<div class="gpc-model" onclick="toggleAiPanel()"><span>' + esc(aiProvider().label) + '</span>' + gpIc('chevron-down', 12) + '</div>' +
                '</div>' +
                '<button class="gpc-send" id="gpcSend" ' + ((state.chat.draft || '').trim() && !busy ? '' : 'disabled') + ' onclick="sendChat()">' + gpIc('arrow-up', 14) + '</button>' +
                '</div>' +
                '</div>' +
                '</div>' +
                '</div>'
            );
        }

        function gpShowBuildStatus() {
            const st = buildStatusLabel();
            toast(st ? st.txt : 'No build running');
        }

        function gpMsgActions(m) {
            return '<div class="gpc-actions">' +
                '<button title="Copy message" onclick="copyMsg(\'' + m.id + '\')">' + gpIc('copy', 14) + '</button>' +
                '<button title="Delete message" onclick="deleteMessage(\'' + m.id + '\')">' + gpIc('more', 14) + '</button>' +
                '</div>';
        }

        function renderMsg(m) {
            /* --- user bubble --- */
            if (m.role === 'user' && m.kind !== 'image') {
                return '<div class="gpc-user">' +
                    '<div class="gpc-user-bub">' + esc(m.content || '') + '</div>' +
                    '<div class="gpc-actions">' +
                    '<button title="Edit message" onclick="editMessage(\'' + m.id + '\')">' + gpIc('pencil', 13) + '</button>' +
                    '<button title="Delete message" onclick="deleteMessage(\'' + m.id + '\')">' + gpIc('trash', 13) + '</button>' +
                    '</div>' +
                    '</div>';
            }
            /* --- attached icon image --- */
            if (m.kind === 'image' && m.data && m.data.url) {
                return '<div class="gpc-user"><img src="' + esc(m.data.url) + '" alt="App icon" style="width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid #E4E4E7"></div>';
            }
            /* --- live / static step group --- */
            if (m.kind === 'steps') {
                return '<div class="gpc-steps">' + (m.steps || []).map(s =>
                    '<div class="gpc-step is-' + esc(s.status || 'done') + '">' +
                    '<div class="gpc-step-ics">' + gpStepIcons(s.label) + gpStepStatusIcon(s.status) + '</div>' +
                    '<span class="gpc-step-label">' + esc(s.label) + '</span>' +
                    '</div>').join('') + '</div>';
            }
            /* --- proposed files: Apply / Dismiss, never auto-committed --- */
            if (m.kind === 'files') {
                return '<div class="gpc-filecard">' +
                    '<h4>Proposed change' + ((m.files || []).length > 1 ? 's' : '') + '</h4>' +
                    (m.files || []).map(f => '<div class="gpc-fileitem">' +
                        '<div class="gpc-filepath">' + gpIc('file-code-2', 13) + esc(f.path) + ' <span style="color:#A1A1AA">(' + esc(f.action || 'update') + ')</span></div>' +
                        '<div class="gpc-filebody">' + esc(String(f.content || '').slice(0, 4000)) + '</div>' +
                        '</div>').join('') +
                    (m.applied ?
                        '<div class="gpc-applied">' + gpIc('check-circle-2', 13) + 'Applied to GitHub</div>' :
                        '<div class="gpc-filebtns">' +
                        '<button class="gpc-btn-dark" onclick="gpApplyFiles(\'' + m.id + '\')">' + gpIc('check', 13) + 'Apply</button>' +
                        '<button class="gpc-btn-light" onclick="gpDismissFiles(\'' + m.id + '\')">Dismiss</button>' +
                        '</div>') +
                    '</div>';
            }
            /* --- inline option picker (one option per row + type your own + Submit) --- */
            if (m.kind === 'options') {
                const done = m.answered != null;
                return '<div class="gpc-opts' + (done ? ' done' : '') + '">' +
                    (m.options || []).map((o, i) => {
                        const on = done ? (m.answered === o) : (m.selected === i);
                        return '<div class="gpc-opt' + (on ? ' on' : '') + '" ' + (done ? '' : 'onclick="gpSelectOption(\'' + m.id + '\',' + i + ')"') + '>' +
                            '<div class="gpc-opt-l"><span class="gpc-opt-n">' + (i + 1) + '</span><span class="gpc-opt-t">' + esc(o) + '</span></div>' +
                            (on ? gpIc('check', 15) : '') +
                            '</div>';
                    }).join('') +
                    (done ?
                        '' :
                        '<input class="gpc-opt-own" id="gpcOwn-' + m.id + '" placeholder="Type your own..." onkeydown="gpOwnKey(event,\'' + m.id + '\')">' +
                        '<button class="gpc-opt-submit" onclick="gpSubmitOption(\'' + m.id + '\')">Submit</button>') +
                    '</div>';
            }
            /* --- error state with retry --- */
            if (m.kind === 'error') {
                return '<div class="gpc-err">' + esc(m.content || '') +
                    (m.retry ? '<div><button onclick="gpRetry(\'' + m.id + '\')">Retry</button></div>' : '') +
                    '</div>';
            }
            /* --- artifact download --- */
            if (m.kind === 'result' && m.data) {
                return '<div class="gpc-filecard">' +
                    '<h4>Build output</h4>' +
                    '<button class="gpc-btn-dark" onclick="downloadArtifact(' + (m.data.artifactId || 0) + ',\'' + esc(m.data.filename || 'artifact') + '\')">' + gpIc('download', 13) + esc(m.data.filename || 'Download') + '</button>' +
                    '</div>';
            }
            /* --- assistant narration --- */
            return '<div>' +
                '<p class="gpc-narr">' + mdLite(m.content || '') + '</p>' +
                gpMsgActions(m) +
                '</div>';
        }

        /* App icon attachment (kept from the setup flow, wired to the composer "+"). */
        function triggerIconPick() {
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.accept = 'image/*';
            inp.style.display = 'none';
            document.body.appendChild(inp);
            inp.onchange = () => {
                const f = inp.files[0];
                inp.remove();
                if (!f) return;
                const rd = new FileReader();
                rd.onload = async () => {
                    state.setup.iconDataUrl = rd.result;
                    state.setup.iconName = f.name;
                    await saveSetup();
                    pushMsg({
                        role: 'user',
                        kind: 'image',
                        content: f.name,
                        data: {
                            url: rd.result
                        }
                    });
                    toast('Icon attached to this build');
                };
                rd.readAsDataURL(f);
            };
            inp.click();
        }

        function scrollChatBottom() {
            const l = document.getElementById('chatList');
            if (l) l.scrollTop = l.scrollHeight;
        }
        /* ===== GITPUSH AI CHAT MODULE END ===== */

        /* nav "+" item handler (moved out of the floating button) */
        function navAdd() {
            if (state.currentRepo && ['repo', 'editor'].includes(state.screen)) return openAddMenu();
            if (state.currentRepo) {
                goTo('repo');
                return openAddMenu();
            }
            goTo('create');
        }

        /* ============================================================
           MASTER RENDER
           ============================================================ */
        function render() {
            const app = document.getElementById('app');
            let body = '';
            let showNav = true;
            let showFab = false;
            switch (state.screen) {
                case 'home':
                    body = renderHome();
                    break;
                case 'create':
                    body = renderCreate();
                    break;
                case 'history':
                    body = renderHistory();
                    break;
                case 'repo':
                    body = renderRepo();
                    if (state.selectMode) showNav = false;
                    break;
                case 'editor':
                    body = renderEditor();
                    showNav = false;
                    break;
                case 'workflows':
                    body = renderWorkflows();
                    showNav = false;
                    break;
                case 'runLogs':
                    body = renderRunLogs();
                    showNav = false;
                    break;
                case 'releases':
                    body = renderReleases();
                    showNav = false;
                    break;
                case 'zipReview':
                    body = renderZipReview();
                    showNav = false;
                    break;
                case 'chat':
                    body = '';
                    showNav = false;
                    break;
                case 'profile':
                    body = renderProfile();
                    break;
                default:
                    body = renderHome();
            }
            if (state.screen === 'chat' && state.chat) {
                app.innerHTML = renderChat();
                requestAnimationFrame(scrollChatBottom);
                return;
            }
            const navPad = showNav || state.selectMode;
            app.innerHTML =
                renderHeader() +
                '<main class="content ' + (navPad ? '' : 'no-nav-pad') + (state.screen === 'editor' ? ' editor-mode' : '') + '">' + body + '</main>' +
                renderPendingBar() +
                (showNav ? renderNav() : '');
        }

        /* ---------------------------- Boot ---------------------------- */
        boot();
    </script>
</body>

</html>
