    } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

    // 1. Firebase Console --> Authentication --> Sign-in method --> Email/Password --> Enable 'Email link (passwordless sign-in)'.
    // 2. Confirm deployed domain is added under Authorized Domains.

    // Firebase Realtime Database Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAZnlTKHHlJIvuPjyoIKHcImtYOCJFtdXA",
      authDomain: "nsvs-3e969.firebaseapp.com",
      databaseURL: "https://nsvs-3e969-default-rtdb.firebaseio.com",
      projectId: "nsvs-3e969",
      storageBucket: "nsvs-3e969.firebasestorage.app",
      messagingSenderId: "1050106502182",
      appId: "1:1050106502182:web:0aa5f357d4c638873b9ae7",
      measurementId: "G-H8Z0GRC4EK"
    };

    // Initialize Firebase Services
    const firebaseApp = initializeApp(firebaseConfig);
    const db = getDatabase(firebaseApp);
    const auth = getAuth(firebaseApp);

    // Global Reactive App State
    const state = {
      user: null,
      savedAddresses: [],
      selectedAddress: null, // Module C: Initialized to null (no hardcoded location)
      locationBannerDismissed: false, // Module D: Permission banner dismiss tracker
      isSearchFocused: false, // Module F: Search focus mode tracker
      nearbyShops: [],
      selectedShop: null,
      categories: ['All', 'Vegetables', 'Fruits', 'Dairy', 'Snacks', 'Bakery', 'Beverages'],
      products: [],
      cart: [],
      wishlist: [],
      orders: [],
      notifications: [],
      chats: [],
      activeChatRoomId: null,
      currentView: 'splash',
      activeProductId: null,
      selectedAddrLabel: 'HOME',
      activeListeners: {},
      searchQuery: '',
      activeCategory: 'All',
      mapInstance: null,
      trackingMapInstance: null,
      deliveryMarker: null,
      confirmDeleteAddressId: null,
      addressFilterQuery: '',
      // Transient State & Timers
      _searchDebounce: null,
      _addressFilterDebounce: null,
      _locationSearchDebounce: null,
      _pinGeocodeDebounce: null,
      _searchRequestId: 0,
      locationSearchResults: [],
      locationSearchQuery: '',
      pendingPinLocation: null,
      pendingAddressPrefill: null,
      magicLinkSent: false,
      magicLinkEmail: '',
      resendCooldown: 0,
      confirmEmailRequired: false,
      pinConfirmMapInstance: null,
      pinConfirmAddressText: '',
      pinConfirmLocationData: null,
      mapHasMoved: false,
      myShopApplication: null,
      partnerForm: {
        shopName: '',
        ownerName: '',
        phone: '',
        category: 'Grocery',
        fullAddress: '',
        lat: null,
        lng: null,
        description: ''
      }
    };

    // CartoDB Voyager Tile Layer Constant (Module E - Free & Rich Labels)
    const CARTO_TILE_URL = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
    const CARTO_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>';

    // Utility Functions
    const utils = {
      formatCurrency: (amount) => `₹${parseFloat(amount || 0).toFixed(2)}`,
      formatDate: (timestamp) => {
        if (!timestamp) return '';
        const d = new Date(timestamp);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' | ' + d.toLocaleDateString();
      },
      escapeHTML: (str) => {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, (m) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[m]);
      },
      calculateDiscountPercent: (price, mrp) => {
        if (!mrp || mrp <= price) return null;
        return Math.round(((mrp - price) / mrp) * 100);
      },
      getDistanceKm: (lat1, lon1, lat2, lon2) => {
        if (!lat1 || !lon1 || !lat2 || !lon2) return 1.2;
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
      },
      hydrateIcons: () => {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          try { window.lucide.createIcons(); } catch(e) {}
        }
      },
      toast: (msg, type = 'info') => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const bgColors = {
          success: 'bg-emerald-600 text-white',
          error: 'bg-rose-600 text-white',
          warning: 'bg-amber-500 text-slate-950 font-bold',
          info: 'bg-slate-900 text-white'
        };
        toast.className = `p-3.5 rounded-2xl shadow-xl text-xs font-bold flex items-center justify-between transition-all duration-300 pointer-events-auto fade-in ${bgColors[type] || bgColors.info}`;
        toast.innerHTML = `<span>${utils.escapeHTML(msg)}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.classList.add('opacity-0');
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }
    };

    // Customer App Class
    class BazaarKartCustomerApp {
      constructor() {
        this.initApp();
      }

      async initApp() {
        if (isSignInWithEmailLink(auth, window.location.href)) {
          await this.completeMagicLinkSignIn();
          return;
        }

        onAuthStateChanged(auth, async (user) => {
          if (user) {
            state.user = {
              uid: user.uid,
              name: user.displayName || "Customer",
              phone: user.phoneNumber || "",
              email: user.email || "",
              photoURL: user.photoURL || null
            };
            await this.checkUserProfileAndLoad();
          } else {
            const savedUid = localStorage.getItem('bk_customer_uid');
            if (savedUid) {
              state.user = {
                uid: savedUid,
                name: localStorage.getItem('bk_customer_name') || "Valued Customer",
                phone: localStorage.getItem('bk_customer_phone') || ""
              };
              await this.checkUserProfileAndLoad();
            } else {
              this.navigateTo('auth');
            }
          }
        });
      }

      async checkUserProfileAndLoad() {
        if (!state.user) return;
        
        try {
          const userSnap = await get(ref(db, `users/${state.user.uid}`));
          if (userSnap.exists()) {
            const val = userSnap.val();
            state.user.name = val.name || state.user.name;
            state.user.phone = val.phone || state.user.phone;
          }
        } catch(e) {}

        localStorage.setItem('bk_customer_uid', state.user.uid);
        localStorage.setItem('bk_customer_name', state.user.name);

        if (!state.user.name || state.user.name === 'Customer' || state.user.name === 'Valued Customer') {
          this.navigateTo('complete-profile');
          return;
        }

        this.loadUserDataFromStorage();
        this.setupAddressListener();
        await this.loadNearbyShops();
      }

      async syncUserProfile() {
        if (!state.user) return;
        const userRef = ref(db, `users/${state.user.uid}`);
        await update(userRef, {
          name: state.user.name,
          phone: state.user.phone || '',
          email: state.user.email || '',
          lastLogin: Date.now()
        });
        localStorage.setItem('bk_customer_uid', state.user.uid);
        localStorage.setItem('bk_customer_name', state.user.name);
      }

      loadUserDataFromStorage() {
        if (!state.user) return;
        const cartKey = `bk_cart_${state.user.uid}`;
        const wishKey = `bk_wishlist_${state.user.uid}`;
        try { state.cart = JSON.parse(localStorage.getItem(cartKey)) || []; } catch(e) { state.cart = []; }
        try { state.wishlist = JSON.parse(localStorage.getItem(wishKey)) || []; } catch(e) { state.wishlist = []; }
      }

      clearListeners() {
        Object.keys(state.activeListeners).forEach(key => {
          if (state.activeListeners[key]) {
            try { off(state.activeListeners[key]); } catch(e) {}
          }
        });
        state.activeListeners = {};
      }

      setupAddressListener() {
        if (!state.user) return;
        const key = 'addresses';
        if (state.activeListeners[key]) {
          try { off(state.activeListeners[key]); } catch(e) {}
        }

        const addrRef = query(ref(db, 'addresses'), orderByChild('userId'), equalTo(state.user.uid));
        state.activeListeners[key] = addrRef;

        onValue(addrRef, (snap) => {
          const raw = snap.val() || {};
          const list = Object.keys(raw).map(id => {
            const item = raw[id];
            return {
              id,
              type: (item.label || 'HOME').toUpperCase(),
              address: item.fullAddress || '',
              landmark: item.landmark || '',
              pincode: item.pincode || '',
              lat: item.lat || 28.6139,
              lng: item.lng || 77.2090,
              isDefault: !!item.isDefault,
              isSelected: state.selectedAddress ? state.selectedAddress.id === id : !!item.isDefault
            };
          });

          state.savedAddresses = list;

          if (list.length > 0 && !state.selectedAddress) {
            const currentSelected = list.find(a => a.isSelected) || list.find(a => a.isDefault) || list[0];
            state.selectedAddress = currentSelected;
            state.locationBannerDismissed = true;
          }

          this.updateHeaderUI();
          if (state.currentView === 'location-selector') this.renderLocationSelector(true);
          if (state.currentView === 'profile') this.renderProfile(true);
        }, (err) => {
          utils.toast("Addresses sync issue — showing local data", "warning");
        });
      }

      async loadNearbyShops() {
        try {
          const shopSnap = await get(ref(db, 'shops'));
          let allShops = [];
          
          if (shopSnap.exists()) {
            const raw = shopSnap.val();
            allShops = Object.keys(raw).map(id => ({ id, ...raw[id] }));
          } else {
            const newShopRef = push(ref(db, 'shops'));
            const shopId = newShopRef.key;
            const demoShop = {
              shopName: "BazaarKart Fresh Express",
              ownerName: "Partner Merchant",
              phone: "9876543210",
              latitude: state.selectedAddress ? state.selectedAddress.lat : 28.6139,
              longitude: state.selectedAddress ? state.selectedAddress.lng : 77.2090,
              deliveryRadius: 10,
              status: "open",
              rating: 4.9,
              deliveryTimeMins: "30-40 Mins",
              minOrderValue: 49,
              createdAt: Date.now()
            };
            await set(newShopRef, demoShop);
            allShops = [{ id: shopId, ...demoShop }];

            await this.seedProductsCatalog(shopId);
          }

          const curLat = state.selectedAddress ? state.selectedAddress.lat : 28.6139;
          const curLng = state.selectedAddress ? state.selectedAddress.lng : 77.2090;

          state.nearbyShops = allShops.map(shop => {
            const dist = utils.getDistanceKm(curLat, curLng, shop.latitude || 28.6139, shop.longitude || 77.2090);
            return { ...shop, distanceKm: dist, deliveryTimeMins: shop.deliveryTimeMins || "30-40 Mins" };
          }).filter(s => s.distanceKm <= (s.deliveryRadius || 10) && s.status !== 'closed');

          if (state.nearbyShops.length === 0) {
            this.navigateTo('no-shops');
          } else {
            state.selectedShop = state.nearbyShops[0];
            this.setupRealtimeDataListeners();
            if (['splash', 'auth', 'no-shops', 'complete-profile'].includes(state.currentView)) {
              this.navigateTo('home');
            }
          }
        } catch (err) {
          utils.toast('Store catalog sync error: ' + err.message, 'error');
          if (state.currentView === 'splash') this.navigateTo('home');
        }
      }

      setupRealtimeDataListeners() {
        this.clearListeners();
        if (!state.selectedShop) return;

        this.setupAddressListener();

        const prodRef = ref(db, 'products');
        state.activeListeners['products'] = prodRef;
        onValue(prodRef, (snap) => {
          const raw = snap.val() || {};
          const list = [];
          for (let id in raw) {
            if (raw[id].shopId === state.selectedShop.id && raw[id].isAvailable !== false) {
              list.push({ id, ...raw[id] });
            }
          }
          state.products = list;
          if (state.currentView === 'home') this.renderHome(true);
          if (state.currentView === 'shop-profile') this.renderShopProfile(state.selectedShop.id, true);
          if (state.currentView === 'product-details' && state.activeProductId) this.renderProductDetails(state.activeProductId, true);
        });

        if (state.user) {
          const ordersRef = ref(db, 'orders');
          state.activeListeners['orders'] = ordersRef;
          onValue(ordersRef, (snap) => {
            const raw = snap.val() || {};
            const list = [];
            for (let id in raw) {
              if (raw[id].customerId === state.user.uid) {
                list.push({ id, ...raw[id] });
              }
            }
            state.orders = list.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
            if (state.currentView === 'orders') this.renderOrders(true);
          });
        }
      }

      updateFloatingCartBar() {
        const bar = document.getElementById('floating-cart-bar');
        const countEl = document.getElementById('floating-cart-count');
        const totalEl = document.getElementById('floating-cart-total');
        const bottomNav = document.getElementById('bottom-nav');

        const totalQty = state.cart.reduce((sum, item) => sum + item.quantity, 0);
        const totalPrice = state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

        if (totalQty > 0 && !['cart', 'checkout', 'location-search', 'location-pin-confirm', 'shop-partner-apply'].includes(state.currentView)) {
          countEl.textContent = totalQty;
          totalEl.textContent = utils.formatCurrency(totalPrice);
          bar.classList.remove('hidden');

          if (bottomNav && !bottomNav.classList.contains('hidden')) {
            const navHeight = bottomNav.offsetHeight || 60;
            bar.style.bottom = `${navHeight + 20}px`;
          } else {
            bar.style.bottom = '16px';
          }
        } else {
          bar.classList.add('hidden');
        }

        if (state.user) {
          localStorage.setItem(`bk_cart_${state.user.uid}`, JSON.stringify(state.cart));
        }

        this.updateLocationBanner();
      }

      // Module D: Non-blocking On-Launch Location Banner Renderer
      updateLocationBanner() {
        const banner = document.getElementById('location-banner');
        if (!banner) return;

        const mainViews = ['home', 'categories', 'orders', 'wishlist', 'profile'];
        const isSearchActive = state.currentView === 'home' && (state.isSearchFocused || (state.searchQuery && state.searchQuery.trim().length > 0));

        const shouldShow = (state.selectedAddress === null) && 
                           (!state.locationBannerDismissed) && 
                           mainViews.includes(state.currentView) && 
                           !isSearchActive;

        if (shouldShow) {
          banner.classList.remove('hidden');
          const cartBar = document.getElementById('floating-cart-bar');
          const bottomNav = document.getElementById('bottom-nav');

          if (cartBar && !cartBar.classList.contains('hidden')) {
            banner.style.bottom = '145px';
          } else if (bottomNav && !bottomNav.classList.contains('hidden')) {
            banner.style.bottom = '75px';
          } else {
            banner.style.bottom = '16px';
          }
        } else {
          banner.classList.add('hidden');
        }
      }

      dismissLocationBanner() {
        state.locationBannerDismissed = true;
        this.updateLocationBanner();
      }

      // Module F: Distraction-Free Search Mode Handler
      updateSearchDistractionFreeMode() {
        const isSearching = (state.currentView === 'home') && 
                            (state.isSearchFocused || (state.searchQuery && state.searchQuery.trim().length > 0));

        const nav = document.getElementById('bottom-nav');
        const cartBar = document.getElementById('floating-cart-bar');
        const locBanner = document.getElementById('location-banner');

        if (isSearching) {
          if (nav) nav.classList.add('hidden');
          if (cartBar) cartBar.classList.add('hidden');
          if (locBanner) locBanner.classList.add('hidden');
        } else {
          if (nav && !['splash', 'auth', 'no-shops', 'location-selector', 'complete-profile', 'add-address', 'edit-profile', 'location-search', 'location-pin-confirm', 'shop-partner-apply'].includes(state.currentView)) {
            nav.classList.remove('hidden');
          }
          this.updateFloatingCartBar();
          this.updateLocationBanner();
        }
      }

      onSearchFocus() {
        state.isSearchFocused = true;
        this.updateSearchDistractionFreeMode();
      }

      onSearchBlur() {
        state.isSearchFocused = false;
        setTimeout(() => {
          this.updateSearchDistractionFreeMode();
        }, 150);
      }

      refreshReactiveView() {
        const reactiveViews = ['home', 'wishlist', 'product-details', 'cart', 'shop-profile', 'categories'];
        if (reactiveViews.includes(state.currentView)) {
          if (state.currentView === 'product-details' && state.activeProductId) {
            this.renderProductDetails(state.activeProductId, true);
          } else if (state.currentView === 'home') {
            this.renderHome(true);
          } else if (state.currentView === 'wishlist') {
            this.renderWishlist(true);
          } else if (state.currentView === 'cart') {
            this.renderCart(true);
          } else if (state.currentView === 'shop-profile' && state.selectedShop) {
            this.renderShopProfile(state.selectedShop.id, true);
          } else if (state.currentView === 'categories') {
            this.renderCategories(true);
          }
        }
        this.updateFloatingCartBar();
        utils.hydrateIcons();
      }

      navigateTo(view, params = {}, isSoftRefresh = false) {
        state.currentView = view;
        this.closeBottomSheet();

        const header = document.getElementById('main-header');
        const nav = document.getElementById('bottom-nav');
        const content = document.getElementById('app-content');

        if (['splash', 'auth', 'no-shops', 'location-selector', 'complete-profile', 'add-address', 'edit-profile', 'location-search', 'location-pin-confirm', 'shop-partner-apply'].includes(view)) {
          header.classList.add('hidden');
          nav.classList.add('hidden');
        } else {
          header.classList.remove('hidden');
          nav.classList.remove('hidden');
        }

        this.updateHeaderUI();
        this.updateFloatingCartBar();
        this.updateSearchDistractionFreeMode();

        document.querySelectorAll('.nav-item').forEach(btn => {
          const n = btn.getAttribute('data-nav');
          const wrapper = btn.querySelector('.nav-icon-wrapper');
          if (n === view) {
            btn.className = "nav-item flex flex-col items-center py-1 px-3 text-brand-700 font-extrabold transition-all duration-200 active:scale-90";
            if (wrapper) wrapper.className = "nav-icon-wrapper relative w-10 h-10 flex items-center justify-center rounded-full bg-brand-600 text-white shadow-md shadow-brand-600/30 nav-pop";
          } else {
            btn.className = "nav-item flex flex-col items-center py-1 px-3 text-slate-400 hover:text-slate-700 font-bold transition-all duration-200 active:scale-90";
            if (wrapper) wrapper.className = "nav-icon-wrapper relative w-10 h-10 flex items-center justify-center rounded-full transition-all duration-300";
          }
        });

        if (!isSoftRefresh) {
          content.scrollTop = 0;
        }
        utils.hydrateIcons();

        content.setAttribute('data-current-view', view);

        switch (view) {
          case 'auth': this.renderAuth(isSoftRefresh); break;
          case 'complete-profile': this.renderCompleteProfile(isSoftRefresh); break;
          case 'no-shops': this.renderNoShops(isSoftRefresh); break;
          case 'home': this.renderHome(isSoftRefresh); break;
          case 'location-selector': this.renderLocationSelector(isSoftRefresh); break;
          case 'location-search': this.renderLocationSearch(isSoftRefresh); break;
          case 'location-pin-confirm': this.renderPinConfirm(isSoftRefresh); break;
          case 'add-address': this.renderAddAddress(params.addressId, isSoftRefresh); break;
          case 'edit-profile': this.renderEditProfile(isSoftRefresh); break;
          case 'shop-partner-apply': this.renderShopPartnerForm(isSoftRefresh); break;
          case 'shop-profile': this.renderShopProfile(params.shopId, isSoftRefresh); break;
          case 'product-details': this.renderProductDetails(params.productId, isSoftRefresh); break;
          case 'categories': this.renderCategories(isSoftRefresh); break;
          case 'cart': this.renderCart(isSoftRefresh); break;
          case 'checkout': this.renderCheckout(isSoftRefresh); break;
          case 'order-success': this.renderOrderSuccess(params.orderId, isSoftRefresh); break;
          case 'orders': this.renderOrders(isSoftRefresh); break;
          case 'tracking': this.renderOrderTracking(params.orderId, isSoftRefresh); break;
          case 'chat': this.renderChatRoom(params.chatRoomId, isSoftRefresh); break;
          case 'wishlist': this.renderWishlist(isSoftRefresh); break;
          case 'profile': this.renderProfile(isSoftRefresh); break;
          default: this.renderHome(isSoftRefresh); break;
        }

        lucide.createIcons();
      }

      updateHeaderUI() {
        const addrText = document.getElementById('header-address-text');
        const tagText = document.getElementById('address-type-tag');
        const avatarText = document.getElementById('header-user-avatar');
        const notifBadge = document.getElementById('notif-badge');

          addrText.textContent = state.selectedAddress ? (state.selectedAddress.address || 'Select delivery location') : 'Select delivery location';

          tagText.textContent = state.selectedAddress ? (state.selectedAddress.type || 'LOCATION') : 'LOCATION';

        if (avatarText && state.user) {
          avatarText.textContent = (state.user.name || 'U')[0].toUpperCase();

          const unreadCount = state.notifications ? state.notifications.filter(n => !n.read).length : 0;
          if (unreadCount > 0) notifBadge.classList.remove('hidden');
          else notifBadge.classList.add('hidden');

      async sendMagicLink(emailInput = null) {
        const email = (emailInput || document.getElementById('auth-email')?.value || '').trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
          utils.toast('Please enter a valid email address', 'error');
          return;
        }

        const btn = document.getElementById('send-link-btn');
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = `<span>SENDING LINK...</span><div class='animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent ml-2'></div>`;
        }

        try {
          const actionCodeSettings = {
            url: window.location.href.split('?')[0].split('#')[0],
            handleCodeInApp: true
          };
          await sendSignInLinkToEmail(auth, email, actionCodeSettings);
          localStorage.setItem('bazaarkart_emailForSignIn', email);
          state.magicLinkEmail = email;
          state.magicLinkSent = true;
          state.resendCooldown = 30;
          this.startResendCooldownTimer();
          utils.toast('Sign-in link sent to ' + email, 'success');
          this.renderAuth(true);
        } catch (err) {
          console.error('Magic Link Error:', err);
          utils.toast(err.message || 'Failed to send sign-in link', 'error');
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      startResendCooldownTimer() {
        if (state._resendTimer) clearInterval(state._resendTimer);
        state._resendTimer = setInterval(() => {
          if (state.resendCooldown > 0) {
            state.resendCooldown--;
            const resendBtn = document.getElementById('resend-link-btn');
            if (resendBtn) {
              if (state.resendCooldown > 0) {
                resendBtn.disabled = true;
                resendBtn.textContent = `Resend Link (${state.resendCooldown}s)`;
              } else {
                resendBtn.disabled = false;
                resendBtn.textContent = 'Resend Sign-In Link';
              }
            }
          } else {
            clearInterval(state._resendTimer);
          }
        }, 1000);
      }

      async resendMagicLink() {
        if (state.resendCooldown > 0) return;
        await this.sendMagicLink(state.magicLinkEmail);
      }

      resetAuthView() {
        state.magicLinkSent = false;
        state.magicLinkEmail = '';
        state.confirmEmailRequired = false;
        this.renderAuth(true);
      }

      async confirmMagicLinkEmail() {
        const emailInput = document.getElementById('auth-confirm-email');
        const email = (emailInput?.value || '').trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
          utils.toast('Please enter a valid email address', 'error');
          return;
        }

        const btn = document.getElementById('confirm-email-btn');
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'VERIFYING...';
        }

        try {
          const result = await signInWithEmailLink(auth, email, window.location.href);
          localStorage.removeItem('bazaarkart_emailForSignIn');
          state.confirmEmailRequired = false;

            const center = map.getCenter();
            state.pinConfirmLocationData.lat = center.lat;
            state.pinConfirmLocationData.lng = center.lng;

            if (state._pinGeocodeDebounce) clearTimeout(state._pinGeocodeDebounce);

            state._pinGeocodeDebounce = setTimeout(async () => {
              try {
                const resp = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + center.lat + '&longitude=' + center.lng + '&localityLanguage=en');

                const data = await resp.json();
                const parts = [data.locality || data.city, data.principalSubdivision, data.countryName].filter(Boolean);
                const resolvedAddr = parts.length > 0 ? parts.join(', ') : ('Location (' + center.lat.toFixed(4) + ', ' + center.lng.toFixed(4) + ')');
                state.pinConfirmLocationData.address = resolvedAddr;
                state.pinConfirmLocationData.pincode = data.postcode || '';

      async saveNewAddress(e, addressId) {
        e.preventDefault();
        const label = state.selectedAddrLabel || 'HOME';
        const fullAddress = document.getElementById('addr-full').value.trim();
        const landmark = document.getElementById('addr-landmark').value.trim();
        const pincode = document.getElementById('addr-pincode').value.trim().replace(/\D/g, '');
        const dupErr = document.getElementById('addr-duplicate-err');

        const fullErr = document.getElementById('addr-full-err');
        const pinErr = document.getElementById('addr-pin-err');

        let valid = true;
        if (fullAddress.length < 10) {
          fullErr.classList.remove('hidden');
          valid = false;
        } else fullErr.classList.add('hidden');

        if (pincode.length !== 6) {
          pinErr.classList.remove('hidden');
          valid = false;
        } else pinErr.classList.add('hidden');

        if (!valid) return;

        const isDuplicate = state.savedAddresses.some(a => 
          a.id !== addressId && 
          a.address.toLowerCase() === fullAddress.toLowerCase() && 
          a.pincode === pincode
        );

        if (isDuplicate) {
          dupErr.classList.remove('hidden');
          return;
        } else dupErr.classList.add('hidden');

        const payload = {
          userId: state.user ? state.user.uid : 'guest',
          label: label,
          fullAddress: fullAddress,
          landmark: landmark,
          pincode: pincode,
          lat: state.selectedAddress ? state.selectedAddress.lat : 28.6139,
          lng: state.selectedAddress ? state.selectedAddress.lng : 77.2090,
          isDefault: state.savedAddresses.length === 0,
          createdAt: Date.now()
        };

        try {
          let savedId = addressId;
          if (state.user) {
            if (addressId) {
              await update(ref(db, `addresses/${addressId}`), payload);
              utils.toast("Address updated!", "success");
            } else {
              const newRef = await push(ref(db, 'addresses'), payload);
              savedId = newRef.key;
              utils.toast("Address saved successfully!", "success");
            }
          } else {
            savedId = 'addr_' + Date.now();
            utils.toast("Address set!", "success");
          }

          state.selectedAddress = {
            id: savedId,
            type: label,
            address: fullAddress,
            landmark,
            pincode,
            lat: payload.lat,
            lng: payload.lng,
            isSelected: true
          };

          state.locationBannerDismissed = true;
          this.updateLocationBanner();
          await this.loadNearbyShops();
          this.navigateTo('location-selector');
        } catch (err) {
          utils.toast("Failed to save address: " + err.message, "error");
        }
      }

        }

      selectAddress(addrId) {
        const found = state.savedAddresses.find(a => a.id === addrId);
        if (found) {
          state.savedAddresses.forEach(a => a.isSelected = (a.id === addrId));
          state.selectedAddress = found;
          state.locationBannerDismissed = true;
          this.updateLocationBanner();
          utils.toast(`Delivery address set to ${found.type}`, "success");
          this.loadNearbyShops();
        }
      }

      detectCurrentGPS() {
        if (!navigator.geolocation) {
          utils.toast("Geolocation not supported by device", "error");
          return;
        }

        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            let addrStr = "Current GPS Location";

            try {
              const resp = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lng + '&localityLanguage=en');
              const data = await resp.json();
              const parts = [data.locality || data.city, data.principalSubdivision, data.countryName].filter(Boolean);
              if (parts.length > 0) addrStr = parts.join(', ');
            } catch(e) {}

            state.selectedAddress = {
              id: 'gps_' + Date.now(),
              type: 'GPS',
              address: addrStr,
              lat: lat,
              lng: lng,
              isSelected: true
            };

            state.locationBannerDismissed = true;
            this.updateLocationBanner();
            utils.toast("GPS location set!", "success");
            this.loadNearbyShops();
          },
          () => utils.toast("GPS Permission Denied", "error"),
          { enableHighAccuracy: true }
        );
      }

      renderHomeProductGridHTML() {
        const filtered = state.products.filter(p => {
          const catMatch = state.activeCategory === 'All' || p.category === state.activeCategory;
          const qMatch = !state.searchQuery || p.name.toLowerCase().includes(state.searchQuery.toLowerCase());
          return catMatch && qMatch;
        });

        let suggestionsHTML = '';
        if (state.searchQuery && state.searchQuery.trim().length > 0) {
          const matches = state.products.filter(p => p.name.toLowerCase().includes(state.searchQuery.toLowerCase())).slice(0, 5);
          if (matches.length > 0) {
            suggestionsHTML = `
              <div class="mb-3 space-y-1">
                <span class="text-[9px] font-black text-slate-400 uppercase tracking-wider block">SEARCH SUGGESTIONS</span>
                <div class="flex flex-wrap gap-1.5">
                  ${matches.map(m => `
                    <button onclick="app.applySuggestion('${utils.escapeHTML(m.name).replace(/'/g, "\\'")}')" class="px-2.5 py-1 rounded-lg bg-brand-50 border border-brand-200 text-brand-800 text-[10px] font-black hover:bg-brand-100 transition">

      async placeOrder() {
        if (state.cart.length === 0) return;

        const subtotal = state.cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
        const deliveryFee = subtotal >= 99 ? 0 : 25;
        const grandTotal = subtotal + deliveryFee;

        const newOrderRef = push(ref(db, 'orders'));
        const orderId = newOrderRef.key;

        const orderObj = {
          shopId: state.selectedShop ? state.selectedShop.id : '',
          customerId: state.user ? state.user.uid : 'guest',
          customerName: state.user ? state.user.name : 'Guest Customer',
          customerPhone: state.user ? state.user.phone : '',
          deliveryAddress: state.selectedAddress ? state.selectedAddress.address : '',
          items: state.cart,
          subtotal: subtotal,
          deliveryCharge: deliveryFee,
          totalAmount: grandTotal,
          status: 'Confirmed',
          otp: Math.floor(1000 + Math.random() * 9000).toString(),
          createdAt: Date.now()
        };

        try {
          await set(newOrderRef, orderObj);
          state.cart = [];
          this.updateFloatingCartBar();
          
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          this.navigateTo('order-success', { orderId });
        } catch (err) {
          utils.toast("Failed to place order: " + err.message, "error");
        }

                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
              </div>

              <div onclick="app.navigateTo('orders')" class="p-3.5 flex items-center justify-between cursor-pointer hover:bg-slate-50 active:scale-98 transition">
                <div class="flex items-center space-x-3">
                  <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                  </div>
                  <div>
                    <h4 class="text-xs font-black text-slate-900">Order History</h4>
                    <p class="text-[10px] text-slate-400 font-bold">View past deliveries and re-order</p>
                  </div>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
              </div>

              <div onclick="app.navigateTo('wishlist')" class="p-3.5 flex items-center justify-between cursor-pointer hover:bg-slate-50 active:scale-98 transition">
                <div class="flex items-center space-x-3">
                  <div class="w-9 h-9 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center">
                    <i data-lucide="heart" class="w-4 h-4"></i>
                  </div>
                  <div>
                    <h4 class="text-xs font-black text-slate-900">Saved Wishlist</h4>
                    <p class="text-[10px] text-slate-400 font-bold">Your favorite grocery items</p>
                  </div>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
              </div>

              <!-- BECOME A SHOP PARTNER ENTRY ROW -->
              <div onclick="app.navigateTo('shop-partner-apply')" class="p-3.5 flex items-center justify-between cursor-pointer hover:bg-emerald-50/50 active:scale-98 transition bg-emerald-50/20">
                <div class="flex items-center space-x-3">
                  <div class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center">
                    <i data-lucide="store" class="w-4 h-4"></i>
                  </div>
                  <div>
                    <h4 class="text-xs font-black text-slate-900">Become a Shop Partner</h4>
                    <p class="text-[10px] text-emerald-700 font-bold">List your store on BazaarKart</p>
                  </div>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-emerald-600"></i>
              </div>
            </div>

            <!-- Card 3: Saved Delivery Addresses -->
            <div class="bg-white border border-slate-200/80 rounded-3xl p-4 space-y-3 shadow-xs">
              <div class="flex items-center justify-between">
                <h4 class="text-xs font-black text-slate-900 uppercase tracking-wider">Saved Addresses</h4>
                <button onclick="app.navigateTo('add-address')" class="text-xs font-black text-brand-600 flex items-center space-x-1">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                  <span>Add New</span>
                </button>
              </div>

              <div class="space-y-2">
                ${state.savedAddresses.length === 0 ? `
                  <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl text-center text-xs text-slate-400 font-bold">
                    No saved addresses
                  </div>
                ` : state.savedAddresses.map(a => `
                  <div class="p-3 bg-slate-50 border border-slate-200/80 rounded-2xl flex items-center justify-between shadow-xs">
                    <div class="flex items-center space-x-3 min-w-0 flex-1 pr-2">
                      <div class="w-8 h-8 rounded-xl ${a.type === 'HOME' ? 'bg-blue-50 text-blue-600' : 'bg-purple-50 text-purple-600'} flex items-center justify-center font-black text-xs">
                        <i data-lucide="${a.type === 'HOME' ? 'home' : 'building'}" class="w-4 h-4"></i>
                      </div>
                      <div class="min-w-0">
                        <div class="flex items-center space-x-1">
                          <span class="text-xs font-black text-slate-900 block">${a.type}</span>
                          ${a.isDefault ? `<span class="px-1.5 py-0.2 bg-brand-100 text-brand-800 text-[8px] font-black rounded">DEFAULT</span>` : ''}
                        </div>
                        <p class="text-[10px] text-slate-500 font-medium truncate max-w-[170px]">${utils.escapeHTML(a.address)}</p>
                      </div>
                    </div>

                    <div class="flex items-center space-x-1">
                      <button onclick="app.navigateTo('add-address', { addressId: '${a.id}' })" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700">
                        <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                      </button>
                      
                      ${state.confirmDeleteAddressId === a.id ? `
                        <button onclick="app.deleteAddress('${a.id}')" class="px-2 py-1 rounded-lg bg-rose-500 text-white font-extrabold text-[9px]">
                          CONFIRM
                        </button>
                      ` : `
                        <button onclick="app.confirmDeleteAddressPrompt('${a.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-500">
                          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                      `}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Danger Zone Action -->
            <button onclick="app.logout()" class="w-full p-3.5 bg-rose-50 text-rose-600 border border-rose-200 font-black rounded-2xl text-xs flex items-center justify-center space-x-2 active:scale-98 transition shadow-xs">
              <i data-lucide="log-out" class="w-4 h-4"></i>
              <span>LOGOUT ACCOUNT</span>
            </button>
          </div>
        `;
      }

      // SHOP PARTNER APPLICATION FORM (MODULE B ICON HYDRATION FIX)
      async renderShopPartnerForm(isSoft = false) {
        const container = document.getElementById('app-content');

        if (state.user && !isSoft) {
          try {
            const appQuery = query(ref(db, 'shopApplications'), orderByChild('applicantUserId'), equalTo(state.user.uid));
            const snap = await get(appQuery);
            if (snap.exists()) {
              const raw = snap.val();
              const appId = Object.keys(raw)[0];
              state.myShopApplication = { id: appId, ...raw[appId] };
            } else {
              state.myShopApplication = null;
            }
          } catch(e) {}
        }

        if (!state.partnerForm.ownerName && state.user) state.partnerForm.ownerName = state.user.name || '';
        if (!state.partnerForm.phone && state.user) state.partnerForm.phone = (state.user.phone || '').replace('+91 ', '');
        if (!state.partnerForm.fullAddress && state.selectedAddress) {
          state.partnerForm.fullAddress = state.selectedAddress.address || '';
          state.partnerForm.lat = state.selectedAddress.lat;
          state.partnerForm.lng = state.selectedAddress.lng;
        }

        if (state.myShopApplication) {
          const app = state.myShopApplication;
          const statusColors = {
            pending: 'bg-amber-100 text-amber-800 border-amber-300',
            approved: 'bg-emerald-100 text-emerald-800 border-emerald-300',
            rejected: 'bg-rose-100 text-rose-800 border-rose-300'
          };

          container.innerHTML = `
            <div class="space-y-4 ${isSoft ? '' : 'fade-in'}">
              <div class="flex items-center space-x-2">
                <button onclick="app.navigateTo('profile')" class="p-2 rounded-xl bg-white border border-slate-200 text-slate-700">
                  <i data-lucide="arrow-left" class="w-4 h-4"></i>
                </button>
                <h2 class="text-sm font-black text-slate-900 uppercase tracking-wider">Partner Application Status</h2>
              </div>

              <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-xs text-center space-y-4">
                <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-3xl flex items-center justify-center mx-auto border border-brand-200">
                  <i data-lucide="check-circle-2" class="w-8 h-8"></i>
                </div>

                <div class="space-y-1">
                  <span class="px-3 py-1 rounded-full text-xs font-black uppercase border ${statusColors[app.status] || 'bg-slate-100 text-slate-700'}">
                    STATUS: ${(app.status || 'pending').toUpperCase()}
                  </span>
                  <h3 class="text-base font-black text-slate-900 pt-2">${utils.escapeHTML(app.shopName)}</h3>
                  <p class="text-xs text-slate-500 font-medium">Applied on ${utils.formatDate(app.createdAt)}</p>
                </div>

                <div class="p-4 bg-slate-50 rounded-2xl text-left space-y-2 text-xs font-semibold text-slate-700">
                  <div class="flex justify-between"><span>Owner Name:</span><span class="font-bold text-slate-900">${utils.escapeHTML(app.ownerName)}</span></div>
                  <div class="flex justify-between"><span>WhatsApp Phone:</span><span class="font-bold text-slate-900">+91 ${utils.escapeHTML(app.phone)}</span></div>
                  <div class="flex justify-between"><span>Category:</span><span class="font-bold text-slate-900">${utils.escapeHTML(app.category)}</span></div>
                  <div class="flex justify-between"><span>Location:</span><span class="font-bold text-slate-900 truncate max-w-[150px]">${utils.escapeHTML(app.fullAddress)}</span></div>
                </div>

                <p class="text-xs text-slate-600 leading-relaxed font-medium">
                  Our onboarding team will review your application and reach out to you on WhatsApp within 24-48 hours.
                </p>

                <button onclick="app.navigateTo('profile')" class="w-full bg-brand-600 text-white font-black py-3.5 rounded-2xl text-xs shadow-md">
                  BACK TO PROFILE
                </button>
              </div>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        const categories = ['Grocery', 'Organic', 'Fruits & Veggies', 'Dairy & Bakery', 'Snacks & Beverages', 'Pharmacy', 'Others'];
        const form = state.partnerForm;

        const phoneDigits = (form.phone || '').replace(/\D/g, '');
        const isValid = form.shopName.length >= 2 && 
                        form.ownerName.length >= 2 && 
                        phoneDigits.length === 10 && 
                        form.category && 
                        form.fullAddress.length >= 5;

        container.innerHTML = `
          <div class="space-y-4 ${isSoft ? '' : 'fade-in'}">
            <div class="flex items-center space-x-2">
              <button onclick="app.navigateTo('profile')" class="p-2 rounded-xl bg-white border border-slate-200 text-slate-700">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
              </button>
              <h2 class="text-sm font-black text-slate-900 uppercase tracking-wider">Become a Shop Partner</h2>
            </div>

            <form onsubmit="app.submitShopApplication(event)" class="bg-white p-5 rounded-3xl border border-slate-200/80 shadow-xs space-y-4">
              
              <div>
                <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1">Shop / Store Name *</label>
                <input type="text" id="pa-shop-name" value="${utils.escapeHTML(form.shopName)}" placeholder="e.g. Metro Supermart" required
                  oninput="app.updatePartnerFormField('shopName', this.value)"
                  class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 px-4 text-xs font-bold text-slate-900 focus:outline-none focus:border-brand-600">
              </div>

              <div>
                <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1">Owner Name *</label>
                <input type="text" id="pa-owner-name" value="${utils.escapeHTML(form.ownerName)}" placeholder="Your Full Name" required
                  oninput="app.updatePartnerFormField('ownerName', this.value)"
                  class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 px-4 text-xs font-bold text-slate-900 focus:outline-none focus:border-brand-600">
              </div>

              <div>
                <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1">WhatsApp Mobile Number *</label>
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-xs font-black text-slate-500">+91</span>
                  <input type="tel" id="pa-phone" value="${utils.escapeHTML(form.phone)}" placeholder="9876543210" required maxlength="10"
                    oninput="app.updatePartnerFormField('phone', this.value)"
                    class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 pl-14 pr-4 text-xs font-bold text-slate-900 focus:outline-none focus:border-brand-600">
                </div>
                <span class="text-[9px] text-slate-500 font-bold block mt-1">We'll reach out to this number on WhatsApp after review</span>
              </div>

              <div>
                <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Primary Category *</label>
                <div class="flex flex-wrap gap-1.5">
                  ${categories.map(c => `
                    <button type="button" onclick="app.selectPartnerCategory('${c}')"
                      class="px-3 py-1.5 rounded-xl text-xs font-black transition ${form.category === c ? 'bg-brand-600 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:text-slate-900'}">
                      ${c}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div>
                <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1">Store Address & GPS *</label>
                <button type="button" onclick="app.navigateTo('location-search')" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-left flex items-center justify-between">
                  <div class="min-w-0 flex-1 pr-2">
                    <span class="text-xs font-bold text-slate-900 block truncate">${form.fullAddress ? utils.escapeHTML(form.fullAddress) : 'Select Store Location'}</span>
                    <span class="text-[9px] text-brand-700 font-black">${form.lat ? 'GPS Location Set ✓' : 'Tap to pick location on map'}</span>
                  </div>
                  <i data-lucide="map-pin" class="w-4 h-4 text-brand-600 flex-shrink-0"></i>
                </button>
              </div>

              <div>
                <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1">Shop Description (Optional)</label>
                <textarea id="pa-desc" rows="2" placeholder="Brief details about items sold, business age..."
                  oninput="app.updatePartnerFormField('description', this.value)"
                  class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 px-4 text-xs font-bold text-slate-900 focus:outline-none focus:border-brand-600">${utils.escapeHTML(form.description)}</textarea>
              </div>

              <div class="p-3 bg-slate-50 rounded-2xl space-y-1 text-[10px] font-bold">
                <div class="${form.shopName.length >= 2 ? 'text-emerald-600' : 'text-slate-400'}">✓ Valid Shop Name</div>
                <div class="${form.ownerName.length >= 2 ? 'text-emerald-600' : 'text-slate-400'}">✓ Valid Owner Name</div>
                <div class="${phoneDigits.length === 10 ? 'text-emerald-600' : 'text-slate-400'}">✓ 10-Digit Mobile Number</div>
                <div class="${form.fullAddress.length >= 5 ? 'text-emerald-600' : 'text-slate-400'}">✓ Store Location Selected</div>
              </div>

              <button type="submit" ${!isValid ? 'disabled' : ''} 
                class="w-full bg-brand-600 hover:bg-brand-700 disabled:bg-slate-200 disabled:text-slate-400 text-white font-black py-4 rounded-2xl shadow-lg shadow-brand-600/25 text-xs tracking-wider transition active:scale-98">
                SUBMIT PARTNER APPLICATION
              </button>
            </form>
          </div>
        `;
        lucide.createIcons();
      }

      updatePartnerFormField(field, val) {
        state.partnerForm[field] = val;
        this.renderShopPartnerForm(true);
      }

      selectPartnerCategory(cat) {
        state.partnerForm.category = cat;
        this.renderShopPartnerForm(true);
      }

      async submitShopApplication(e) {
        e.preventDefault();
        const form = state.partnerForm;
        const phoneDigits = (form.phone || '').replace(/\D/g, '');

        if (!state.user) {
          utils.toast("Sign in required to submit application", "error");
          return;
        }

        if (form.shopName.length < 2 || form.ownerName.length < 2 || phoneDigits.length !== 10 || !form.fullAddress) {
          utils.toast("Please complete all required fields correctly", "error");
          return;
        }

        try {
          const appRef = push(ref(db, 'shopApplications'));
          await set(appRef, {
            applicantUserId: state.user.uid,
            shopName: form.shopName,
            ownerName: form.ownerName,
            phone: phoneDigits,
            category: form.category,
            fullAddress: form.fullAddress,
            lat: form.lat || 28.6139,
            lng: form.lng || 77.2090,
            description: form.description || '',
            status: 'pending',
            createdAt: Date.now()
          });

          state.myShopApplication = {
            id: appRef.key,
            shopName: form.shopName,
            ownerName: form.ownerName,
            phone: phoneDigits,
            category: form.category,
            fullAddress: form.fullAddress,
            status: 'pending',
            createdAt: Date.now()
          };

          utils.toast("Application submitted successfully!", "success");
          this.renderShopPartnerForm(true);
        } catch(err) {
          utils.toast("Submission failed: " + err.message, "error");
        }
      }

      logout() {
        localStorage.removeItem('bk_customer_uid');
        state.user = null;
        signOut(auth);
        this.navigateTo('auth');
      }

      closeBottomSheet() {
        document.getElementById('bottom-sheet-backdrop').classList.add('hidden');
      }
    }

    // Initialize App Instance
    window.app = new BazaarKartCustomerApp();
    window.addEventListener('load', () => { if (window.utils) utils.hydrateIcons(); });
    setInterval(() => { if (window.utils) utils.hydrateIcons(); }, 1000);
  </script>
</body>
</html>
